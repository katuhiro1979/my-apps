<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>家電管理</title>
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家電管理">
<link rel="manifest" href="kaden-manifest.json">
<link rel="icon" href="kaden-icon-192.png">
<link rel="apple-touch-icon" href="kaden-icon-192.png">
<script>
  /* 保存済みの表示設定を、画面が描かれる前に反映（ちらつき防止） */
  try{ var t=localStorage.getItem('kaden-app-theme'); if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t); }catch(e){}
</script>
<style>
  /* ===== デザイントークン（ライト／ダーク。ダークは端末の設定に自動で従う） ===== */
  :root{
    color-scheme:light dark;
    --bg:#F4F5F7; --paper:#FFFFFF; --surface-2:#EEF0F4;
    --ink:#1B2333; --ink-soft:#505A6E; --line:#D7DBE3; --line-strong:#8A93A5;
    --accent:#1B2333; --on-accent:#FFFFFF;
    --danger:#B3281C; --warn:#854F0B; --ok:#3B6D11;
    --warn-bg:#FAEEDA; --danger-bg:#FCEBEB;
    --shadow-lg:0 8px 28px rgba(27,35,51,.22);
    --radius:14px;
    --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0E1116; --paper:#171B22; --surface-2:#1F242C;
      --ink:#E8ECF2; --ink-soft:#A3ADBD; --line:#2D3440; --line-strong:#6B7686;
      --accent:#E8ECF2; --on-accent:#0E1116;
      --danger:#FF8176; --warn:#EF9F27; --ok:#97C459;
      --warn-bg:#3A2A10; --danger-bg:#3A1C1A;
      --shadow-lg:0 8px 28px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"]{ color-scheme:light; }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0E1116; --paper:#171B22; --surface-2:#1F242C;
    --ink:#E8ECF2; --ink-soft:#A3ADBD; --line:#2D3440; --line-strong:#6B7686;
    --accent:#E8ECF2; --on-accent:#0E1116;
    --danger:#FF8176; --warn:#EF9F27; --ok:#97C459;
    --warn-bg:#3A2A10; --danger-bg:#3A1C1A;
    --shadow-lg:0 8px 28px rgba(0,0,0,.6);
  }

  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); line-height:1.6; padding:env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom)); }
  main{ max-width:640px; margin:0 auto; }
  @media (min-width:720px){ main, .dock > div{ max-width:960px !important; } } /* 広い画面ではカードを2列に */
  header{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:16px 0 8px; }
  h1{ font-size:1.25rem; margin:0; }
  button, input, select, textarea{ font:inherit; color:inherit; }
  button{ min-height:44px; padding:0 14px; border:1px solid var(--line); border-radius:10px; background:var(--paper); cursor:pointer; }
  button.primary{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  button.danger{ color:var(--danger); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:3px solid #3B82F6; outline-offset:2px; }
  input, select, textarea{ min-height:44px; padding:0 12px; border:1px solid var(--line-strong); border-radius:10px; background:var(--paper); width:100%; }
  textarea{ padding:8px 12px; min-height:72px; resize:vertical; }

  /* 集計の帯 */
  .sum{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:4px 0 12px; }
  .sum div{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
  .sum small{ display:block; font-size:.72rem; color:var(--ink-soft); line-height:1.3; }
  .sum b{ font-size:1rem; font-weight:700; }
  .sum .hot{ background:var(--warn-bg); border-color:transparent; }
  .sum .hot small, .sum .hot b{ color:var(--warn); }

  .filter{ display:flex; gap:8px; margin-bottom:10px; }
  .filter input{ flex:1; min-width:0; }
  .filter select{ width:42%; }
  .tabs{ display:flex; align-items:center; gap:6px; margin-bottom:10px; }
  .tabs button{ min-height:44px; border-radius:999px; padding:0 14px; font-size:.9rem; }
  .tabs button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .tabs select{ margin-left:auto; width:auto; max-width:50%; min-height:44px; font-size:1rem; padding:0 8px; }

  /* 家電カード（左端の色の帯＋右の大きな残り時間で、状態を先に伝える） */
  ul{ list-style:none; margin:0; padding:0; }
  #list{ display:grid; gap:10px; }
  @media (min-width:720px){ #list{ grid-template-columns:1fr 1fr; } }
  #list li{ container-type:inline-size; }
  .card{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 12px; align-items:center; width:100%; text-align:left; min-height:0; padding:12px 14px 12px 12px; background:var(--paper); border:1px solid var(--line); border-left:6px solid var(--line); border-radius:12px; transition:transform .12s, box-shadow .12s; }
  .card:active{ transform:scale(.99); }
  .card.lv-ok{ border-left-color:var(--ok); }
  .card.lv-warn{ border-left-color:var(--warn); background:color-mix(in srgb, var(--warn) 7%, var(--paper)); }
  .card.lv-danger{ border-left-color:var(--danger); background:color-mix(in srgb, var(--danger) 8%, var(--paper)); }
  .card .name{ font-weight:700; font-size:1.05rem; line-height:1.4; word-break:break-word; }
  .card .sub{ font-size:.8rem; color:var(--ink-soft); }
  .card .sub span{ white-space:nowrap; }
  .card .big{ text-align:right; line-height:1.2; white-space:nowrap; }
  .card .big b{ display:block; font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .card .big small{ font-size:.75rem; font-weight:700; }
  .card .big b .pre{ font-size:.7rem; font-weight:700; margin-right:4px; }
  .card .pills{ grid-column:1/-1; display:flex; flex-wrap:wrap; gap:6px; }
  .pill{ font-size:.75rem; font-weight:600; padding:1px 8px; border-radius:999px; background:var(--surface-2); color:var(--ink-soft); }
  .pill.c-warn{ background:var(--warn-bg); }
  .bar{ grid-column:1/-1; height:8px; background:color-mix(in srgb, var(--ink) 12%, var(--paper)); box-shadow:inset 0 0 0 1px var(--line); border-radius:4px; overflow:hidden; }
  .bar i{ display:block; height:100%; border-radius:4px; }
  .card .row3{ grid-column:1/-1; display:flex; justify-content:space-between; gap:8px; font-size:.8rem; color:var(--ink-soft); }
  @container (max-width:300px){ .card .big b{ font-size:1.1rem; } }
  .c-ok{ color:var(--ok); } .c-warn{ color:var(--warn); } .c-danger{ color:var(--danger); }
  .b-ok{ background:var(--ok); } .b-warn{ background:var(--warn); } .b-danger{ background:var(--danger); }
  .empty{ grid-column:1/-1; color:var(--ink-soft); text-align:center; padding:40px 0; }
  .empty svg{ display:block; margin:0 auto 12px; width:72px; height:72px; stroke:var(--ink-soft); fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; opacity:.7; }

  /* 日付・年月の入力欄（ダークでも浮かないように、左寄せ＋アイコンの色を揃える） */
  input[type="date"], input[type="month"]{ text-align:left; min-width:0; }
  input[type="date"]::-webkit-date-and-time-value, input[type="month"]::-webkit-date-and-time-value{ text-align:left; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) ::-webkit-calendar-picker-indicator{ filter:invert(.85); } }
  :root[data-theme="dark"] ::-webkit-calendar-picker-indicator{ filter:invert(.85); }

  /* 画面下の操作 */
  .dock{ position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); background:var(--paper); border-top:1px solid var(--line); z-index:20; }
  .dock > div{ position:relative; max-width:640px; margin:0 auto; display:flex; gap:8px; padding-right:64px; } /* 右端は☁ボタンの場所 */
  .dock button{ white-space:nowrap; }
  .dock .primary{ flex:1; }
  .dock #moreBtn{ width:48px; padding:0; font-size:1.2rem; }
  .menu{ position:absolute; right:64px; bottom:calc(100% + 10px); display:flex; flex-direction:column; gap:4px; padding:6px; background:var(--paper); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-lg); }
  .menu[hidden]{ display:none; }
  .menu button{ border:0; text-align:left; background:transparent; }

  /* 追加・編集の画面（下から出るシート。保存ボタンは下に固定） */
  dialog{ width:min(560px,100%); max-width:100%; max-height:92dvh; margin:auto auto 0; padding:0; border:0; border-radius:20px 20px 0 0; background:var(--paper); color:var(--ink); box-shadow:var(--shadow-lg); overflow:hidden; }
  @media (min-width:720px){ dialog{ margin:auto; border-radius:20px; max-height:88dvh; } }
  dialog[open]{ animation:sheet-in .22s ease-out; }
  @keyframes sheet-in{ from{ transform:translateY(32px); opacity:0; } }
  dialog::backdrop{ background:rgba(0,0,0,.45); }
  .dlg{ display:flex; flex-direction:column; max-height:inherit; }
  .dlg .head{ padding:8px 16px 0; }
  .dlg .head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .dlg h2:focus{ outline:none; }
  #closeBtn{ width:44px; padding:0; font-size:1.3rem; border:0; background:transparent; }
  .dlg .body{ overflow:auto; overscroll-behavior:contain; padding:0 16px 8px; }
  .dlg h2{ font-size:1.1rem; margin:0 0 8px; }
  .grp{ font-size:.75rem; font-weight:700; letter-spacing:.04em; color:var(--ink-soft); margin:14px 0 6px; }
  .more{ display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .more:not(:has(button:not([hidden]))){ display:none; }
  .foot{ flex-shrink:0; padding:8px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--paper); }
  .fld{ margin-bottom:12px; }
  .fld label{ display:block; font-size:.8rem; color:var(--ink-soft); margin-bottom:2px; }
  .two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .rep{ border-top:1px solid var(--line); padding-top:10px; margin-top:4px; }
  .rep h3{ font-size:.9rem; margin:0 0 6px; }
  .rep li{ display:flex; align-items:center; gap:8px; font-size:.85rem; padding:4px 0; }
  .rep li span{ flex:1; word-break:break-word; }
  .rep li button{ min-height:44px; padding:0 10px; }
  .rep .add{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px; }
  .rep .add .wide{ grid-column:1/-1; }
  .acts{ display:flex; gap:8px; }
  .acts .primary{ flex:1; }
  .err{ color:var(--danger); font-size:.85rem; min-height:1.2em; margin-bottom:4px; }

  .toast{ position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:none; align-items:center; gap:12px; padding:10px 14px; background:var(--ink); color:var(--bg); border-radius:12px; box-shadow:var(--shadow-lg); z-index:50; max-width:calc(100vw - 32px); }
  .toast{ top:auto; right:auto; margin:0; border:0; overflow:visible; } /* popover（最前面の層）の既定の見た目を打ち消す */
  .toast.show{ display:flex; }
  .toast button{ min-height:44px; background:transparent; color:inherit; border-color:currentColor; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>家電管理</h1>
    <button id="themeBtn" type="button" title="表示の切り替え"></button>
  </header>

  <div class="sum" id="sum"></div>

  <div class="filter">
    <input id="q" type="search" placeholder="名前・型番で検索" aria-label="検索" autocomplete="off">
    <select id="placeSel" aria-label="置き場所で絞り込み"></select>
  </div>
  <div class="tabs">
    <button type="button" id="tabUse" aria-pressed="true"></button>
    <button type="button" id="tabHist" aria-pressed="false"></button>
    <select id="sortSel" aria-label="並べ替え">
      <option value="life">寿命が近い順</option>
      <option value="old">購入が古い順</option>
      <option value="price">購入額が高い順</option>
      <option value="yearly">年あたり費用が高い順</option>
    </select>
  </div>

  <ul id="list"></ul>

  <p style="font-size:.8rem;color:var(--ink-soft);margin-top:16px">年あたり費用は、(購入額＋修理費) ÷ 使用年数で計算します（使用1年未満は1年として計算）。</p>
</main>

<div class="dock"><div>
  <button class="primary" id="addBtn" type="button">＋ 追加</button>
  <button id="moreBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu" aria-label="その他の操作">⋯</button>
  <div class="menu" id="menu" hidden>
    <button id="exportBtn" type="button">書き出し（バックアップ）</button>
    <button id="importBtn" type="button">読み込み</button>
    <button id="rescueBtn" type="button">退避データを書き出す</button>
  </div>
  <input id="importFile" type="file" accept="application/json,.json" hidden>
</div></div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form class="dlg" id="form" novalidate>
    <div class="head"><h2 id="dlgTitle" tabindex="-1">家電を追加</h2><button type="button" id="closeBtn" aria-label="閉じる">×</button></div>
    <div class="body">
    <div id="replBox" hidden>
      <div class="grp">買い替え</div>
      <div class="two">
        <div class="fld"><label for="fReplaced">買い替えた日</label><input id="fReplaced" type="date"></div>
        <div class="fld" style="align-self:end"><button type="button" id="statusBtn" style="width:100%"></button></div>
      </div>
    </div>
    <div class="grp">基本</div>
    <div class="fld"><label for="fName">名前（必須）</label><input id="fName" maxlength="60" autocomplete="off" placeholder="例: 冷蔵庫"></div>
    <div class="two">
      <div class="fld"><label for="fPlace">置き場所</label><input id="fPlace" maxlength="30" list="placeList" autocomplete="off" placeholder="例: 台所"><datalist id="placeList"></datalist></div>
      <div class="fld"><label for="fBought">購入した年月</label><input id="fBought" type="month"></div>
    </div>
    <div class="two">
      <div class="fld"><label for="fPrice">購入額（円）</label><input id="fPrice" type="number" inputmode="numeric" min="0" max="100000000" step="1" placeholder="例: 120000"></div>
      <div class="fld"><label for="fLife">寿命の目安（年）</label><input id="fLife" type="number" inputmode="decimal" min="0" max="50" step="0.5" placeholder="例: 10"></div>
    </div>
    <div class="grp">保証・機種</div>
    <div class="two">
      <div class="fld"><label for="fWarranty">保証の期限</label><input id="fWarranty" type="date"></div>
      <div class="fld"><label for="fMaker">メーカー</label><input id="fMaker" maxlength="40" autocomplete="off"></div>
    </div>
    <div class="two">
      <div class="fld"><label for="fModel">型番</label><input id="fModel" maxlength="40" autocomplete="off"></div>
      <div class="fld"><label for="fUrl">説明書のURL</label><input id="fUrl" type="url" maxlength="300" placeholder="https://" autocomplete="off"><a id="urlLink" href="#" target="_blank" rel="noopener noreferrer" hidden style="font-size:.8rem">説明書を開く</a></div>
    </div>
    <div class="fld"><label for="fMemo">メモ</label><textarea id="fMemo" maxlength="500"></textarea></div>

    <div class="rep">
      <h3>修理の履歴</h3>
      <ul id="repList"></ul>
      <div class="add">
        <input id="rDate" type="date" aria-label="修理した日">
        <input id="rCost" type="number" inputmode="numeric" min="0" max="10000000" step="1" placeholder="費用（円）" aria-label="修理の費用">
        <input id="rNote" class="wide" maxlength="60" placeholder="内容（例: 部品交換）" aria-label="修理の内容" autocomplete="off">
        <button class="wide" id="rAdd" type="button">修理を追加</button>
      </div>
    </div>

    <div class="more">
      <button type="button" id="delBtn" class="danger" hidden>削除</button>
    </div>
    </div>
    <div class="foot">
      <div class="err" id="err" role="alert"></div>
      <div class="acts">
        <button class="primary" type="submit">保存</button>
        <button type="button" id="cancelBtn">キャンセル</button>
      </div>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" popover="manual" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" type="button">元に戻す</button></div>

<!-- クラウド同期（右下の☁ボタンは、このスクリプトが作る）。読み込めなくても端末内だけで動く -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous" defer></script>
<script src="cloud-sync.js" defer></script>
<script>
(function(){
  'use strict';
  const $ = (s) => document.querySelector(s);

  const STORAGE_KEY = 'kaden-app-data-v1';
  const THEME_KEY = 'kaden-app-theme';
  const SORT_KEY = 'kaden-app-sort';
  const APP_NAME = '家電管理'; // クラウドの app_name。他のアプリと重複させない（重複すると上書きされる）
  const SYNC_KEY = 'data-v1';

  let items = [];       // 家電の一覧
  let cloud = null;     // クラウド同期。読み込めない環境では null のまま
  let undoFn = null;    // 直前の操作を元に戻す関数
  let tab = 'use';      // 'use'（使用中）／'hist'（履歴）

  // ---------- 日付と計算 ----------
  const pad = (n) => (n < 10 ? '0' : '') + n;
  function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  // 'YYYY-MM' または 'YYYY-MM-DD' → 年×12+月（0始まり）。不正なら null
  function monthIdx(s){
    const m = /^(\d{4})-(\d{2})/.exec(s || '');
    return m ? Number(m[1]) * 12 + Number(m[2]) - 1 : null;
  }
  const nowIdx = () => monthIdx(todayISO());
  function fmtSpan(m){ // 月数 → 「2年3か月」「8か月」
    m = Math.max(0, Math.round(m));
    const y = Math.floor(m / 12), r = m % 12;
    return (y ? y + '年' : '') + (r || !y ? r + 'か月' : '');
  }
  const fmtYM = (s) => s.slice(0, 4) + '年' + Number(s.slice(5, 7)) + '月';
  const yen = (n) => '¥' + Math.round(n).toLocaleString('ja-JP');

  // 1台ぶんの計算結果（買い替え済みは、買い替えた月までを使用期間にする）
  function calc(it){
    const b = monthIdx(it.bought);
    const end = it.status === 'replaced' && monthIdx(it.replacedAt) !== null ? monthIdx(it.replacedAt) : nowIdx();
    const used = b === null ? null : Math.max(0, end - b);
    const repair = it.repairs.reduce((s, r) => s + r.cost, 0);
    const lifeM = it.life > 0 ? Math.round(it.life * 12) : null;
    const remain = (b !== null && lifeM !== null) ? b + lifeM - nowIdx() : null; // 寿命までの残り月数（負なら超過）
    const yearly = (used !== null && (it.price || repair)) ? (it.price + repair) / Math.max(used / 12, 1) : null;
    let warn = null; // 保証の状態: 'out'（切れ）／日数（90日以内）
    if(it.warranty){
      const days = Math.floor((new Date(it.warranty + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 86400000);
      if(days < 0) warn = 'out'; else if(days <= 90) warn = days;
    }
    return { used, repair, lifeM, remain, yearly, warn, ratio: (used !== null && lifeM) ? used / lifeM : null };
  }
  function level(c){ // 寿命の色分け
    if(c.remain === null) return '';
    if(c.remain < 0) return 'danger';
    return c.remain <= 12 ? 'warn' : 'ok';
  }

  // ---------- 保存と読み込み ----------
  // 読み込んだ値を検証して、壊れた項目や不正な値を取り除く（端末・クラウド・ファイルに共通）
  const num = (v, max) => { const n = Number(v); return Number.isFinite(n) && n > 0 ? Math.min(Math.round(n), max) : 0; };
  const str = (v, n) => (typeof v === 'string' ? v.trim().slice(0, n) : '');
  function sanitizeItem(x){
    if(!x || typeof x.name !== 'string' || !x.name.trim()) return null;
    const life = Number(x.life);
    const url = str(x.url, 300);
    return {
      id: String(x.id || Date.now() + Math.random()),
      name: x.name.trim().slice(0, 60),
      place: str(x.place, 30),
      bought: /^\d{4}-\d{2}$/.test(x.bought) ? x.bought : '',
      price: num(x.price, 100000000),
      life: Number.isFinite(life) && life > 0 ? Math.min(Math.round(life * 2) / 2, 50) : 0,
      warranty: /^\d{4}-\d{2}-\d{2}$/.test(x.warranty) ? x.warranty : '',
      maker: str(x.maker, 40), model: str(x.model, 40),
      url: /^https?:\/\//i.test(url) ? url : '',
      memo: str(x.memo, 500),
      status: x.status === 'replaced' ? 'replaced' : 'using',
      replacedAt: /^\d{4}-\d{2}-\d{2}$/.test(x.replacedAt) ? x.replacedAt : '',
      repairs: (Array.isArray(x.repairs) ? x.repairs : []).slice(0, 50).map((r) => r && /^\d{4}-\d{2}-\d{2}$/.test(r.date) ? { id: String(r.id || Date.now() + Math.random()), date: r.date, note: str(r.note, 60), cost: num(r.cost, 10000000) } : null).filter(Boolean)
    };
  }
  // 検証して、id の重複を振り直す（重複すると片方の編集でもう片方が消えるため）
  function sanitizeList(arr){
    const seen = new Set(), seenR = new Set();
    const fresh = () => String(Date.now() + Math.random());
    return arr.map(sanitizeItem).filter(Boolean).map((it) => {
      if(seen.has(it.id)) it.id = fresh();
      seen.add(it.id);
      it.repairs.forEach((r) => { if(seenR.has(it.id + '/' + r.id)) r.id = fresh(); seenR.add(it.id + '/' + r.id); });
      return it;
    });
  }
  let lastRaw = null;       // 最後に保存・読み込みした保存データ（古い画面の検出用）
  let loadFailed = false;   // 保存データが壊れていて、空で起動したとき true
  // 読み込めなかった元データを別キーへ退避する（次の保存で消えないように）
  function quarantine(raw, msg){
    try{
      const k = STORAGE_KEY + '-corrupt'; // 1つだけ。同じ内容なら書き直さない
      if(localStorage.getItem(k) !== raw) localStorage.setItem(k, raw);
      toast(msg + '元データは「' + k + '」に退避しました（⋯→退避データを書き出す）。', null, true);
    }catch(e2){ toast(msg + '退避もできませんでした。ブラウザのデータを消さずにご相談ください。', null, true); }
  }
  function load(){
    let raw = null;
    try{
      raw = localStorage.getItem(STORAGE_KEY); lastRaw = raw;
      const d = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(d)) throw new Error('形式が正しくありません');
      items = sanitizeList(d);
      // 配列は読めたが、中身が検証で落ちたとき（黙って消えて、次の保存で確定するのを防ぐ）
      if(d.length && items.length < d.length){
        if(!items.length) loadFailed = true;
        quarantine(raw, '保存データの一部（' + (d.length - items.length) + '件）を読み込めませんでした。');
      }
    }catch(e){
      items = []; loadFailed = true;
      if(raw) quarantine(raw, '保存データを読み込めませんでした。');
    }
  }
  // 保存できたら true。失敗時は警告を出して false（クラウドへは知らせない）
  function save(){
    try{
      const s = JSON.stringify(items);
      localStorage.setItem(STORAGE_KEY, s); lastRaw = s;
    }catch(e){
      toast('端末に保存できませんでした。このまま閉じると変更が失われます。書き出しで保存してください。');
      return false;
    }
    if(cloud) cloud.notifyChanged(); // 端末へ保存した直後に必ず呼ぶ
    return true;
  }

  // 別のタブで保存されたら最新の内容に更新する（古い画面のまま上書きして消すのを防ぐ）
  function adoptStored(raw){
    try{
      const d = JSON.parse(raw || '[]');
      if(!Array.isArray(d)) return;
      lastRaw = raw;
      items = sanitizeList(d);
      clearUndo();
      closeOpenSheets();
      render();
      toast('別のタブでデータが更新されたため、最新の内容に更新しました。');
    }catch(err){ /* 壊れた値は無視 */ }
  }
  window.addEventListener('storage', (e) => { if(e.key === STORAGE_KEY) adoptStored(e.newValue); });
  // 凍結・キャッシュ復帰したタブは storage イベントを受け取れないため、戻ったときに見比べる
  function checkStale(){
    let cur = null;
    try{ cur = localStorage.getItem(STORAGE_KEY); }catch(e){ return; }
    if(cur && lastRaw !== null && cur !== lastRaw) adoptStored(cur);
  }
  window.addEventListener('pageshow', (e) => { if(e.persisted) checkStale(); });
  document.addEventListener('visibilitychange', () => { if(!document.hidden){ checkStale(); render(); } });

  // ---------- 画面 ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  function getSort(){ try{ return localStorage.getItem(SORT_KEY) || 'life'; }catch(e){ return 'life'; } }

  function render(){
    const cur = items.filter((it) => it.status === 'using'), hist = items.filter((it) => it.status === 'replaced');
    // 集計（使用中のみ）
    const cs = cur.map(calc);
    const total = cur.reduce((s, it) => s + it.price, 0);
    const near = cs.filter((c) => c.remain !== null && c.remain <= 12).length;
    const wnear = cs.filter((c) => c.warn !== null && c.warn !== 'out').length;
    $('#sum').innerHTML =
      '<div><small>購入額の合計</small><b>' + yen(total) + '</b></div>' +
      '<div class="' + (near ? 'hot' : '') + '"><small>' + (near ? '▲ ' : '') + '寿命が近い</small><b>' + near + '台</b></div>' +
      '<div class="' + (wnear ? 'hot' : '') + '"><small>' + (wnear ? '▲ ' : '') + '保証切れ間近</small><b>' + wnear + '台</b></div>';
    $('#tabUse').textContent = '使用中 ' + cur.length;
    $('#tabHist').textContent = '履歴 ' + hist.length;
    $('#tabUse').setAttribute('aria-pressed', tab === 'use');
    $('#tabHist').setAttribute('aria-pressed', tab === 'hist');

    // 置き場所の選択肢（今の選択は保つ。なくなっていたら「すべて」に戻す）
    const places = [...new Set(items.map((it) => it.place).filter(Boolean))].sort();
    const sel = $('#placeSel'), keep = places.indexOf(sel.value) >= 0 ? sel.value : '';
    sel.innerHTML = '<option value="">すべての場所</option>' + places.map((p) => '<option>' + esc(p) + '</option>').join('');
    sel.value = keep;
    $('#placeList').innerHTML = places.map((p) => '<option value="' + esc(p) + '">').join('');
    $('#sortSel').value = getSort();

    // 絞り込みと並べ替え
    const q = $('#q').value.trim().toLowerCase();
    let rows = (tab === 'use' ? cur : hist).filter((it) =>
      (!keep || it.place === keep) && (!q || (it.name + ' ' + it.maker + ' ' + it.model).toLowerCase().indexOf(q) >= 0));
    const info = new Map(rows.map((it) => [it.id, calc(it)]));
    const sortBy = getSort();
    $('#sortSel').options[0].textContent = tab === 'hist' ? '買い替えが新しい順' : '寿命が近い順';
    const big = (v) => (v === null ? Infinity : v);
    rows.sort((a, b) => {
      const ca = info.get(a.id), cb = info.get(b.id);
      let d;
      if(sortBy === 'old') d = (a.bought || '9999') < (b.bought || '9999') ? -1 : ((a.bought || '9999') > (b.bought || '9999') ? 1 : 0);
      else if(sortBy === 'price') d = b.price - a.price;
      else if(sortBy === 'yearly') d = (cb.yearly || 0) - (ca.yearly || 0);
      else if(tab === 'hist') d = (b.replacedAt || '') < (a.replacedAt || '') ? -1 : ((b.replacedAt || '') > (a.replacedAt || '') ? 1 : 0);
      else d = big(ca.remain) === big(cb.remain) ? 0 : big(ca.remain) - big(cb.remain); // 寿命未設定同士は NaN になるため
      return d || a.name.localeCompare(b.name, 'ja');
    });

    const ul = $('#list');
    if(!rows.length){
      ul.innerHTML = '<li class="empty"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="13" y="5" width="22" height="38" rx="4"/><path d="M13 20h22M18 11v5M18 25v8"/></svg>' + emptyText(!!(q || keep)) + '</li>';
      return;
    }
    ul.innerHTML = rows.map((it) => {
      const c = info.get(it.id), lv = it.status === 'using' ? level(c) : '';
      // 右の大きな表示（色だけに頼らず、文字と記号でも状態を伝える）
      let big;
      if(it.status === 'replaced') big = '<b style="font-size:1.05rem">買い替え済み</b><small>' + (it.replacedAt ? esc(fmtYM(it.replacedAt)) : '') + '</small>';
      else if(c.remain === null) big = '<b>―</b><small>' + (it.life > 0 && !it.bought ? '購入年月が未入力' : '寿命未設定') + '</small>';
      else if(c.remain < 0) big = '<b><span class="pre">超過</span>' + fmtSpan(-c.remain) + '</b><small>⚠ 寿命</small>';
      else if(c.remain === 0) big = '<b>今月</b><small>▲ 寿命</small>';
      else big = '<b>' + fmtSpan(c.remain) + '</b><small>' + (lv === 'warn' ? '▲ ' : '✓ ') + '寿命まで</small>';
      let pills = '';
      if(it.status === 'using' && c.warn === 'out') pills = '<span class="pill">保証切れ</span>';
      else if(it.status === 'using' && c.warn !== null) pills = '<span class="pill c-warn">▲ 保証あと' + c.warn + '日</span>';
      const sub = [it.place, it.bought ? fmtYM(it.bought) + '購入' : '', c.used !== null ? '使用' + (c.used < 1 ? '1か月未満' : fmtSpan(c.used)) : ''].filter(Boolean).map((s) => '<span>' + esc(s) + '</span>').join(' ・ '); // 項目の途中では折り返さない
      const bar = (it.status === 'using' && c.ratio !== null) ? '<div class="bar" aria-hidden="true"><i class="b-' + lv + '" style="width:' + Math.min(100, Math.round(c.ratio * 100)) + '%"></i></div>' : '';
      // 読み上げ用の名前（表示の断片をつなげず、1文にする）
      const plain = (h) => h.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      const label = it.name + '、' + plain(big) + (pills ? '、' + plain(pills) : '') + '。タップで編集';
      const cost = (it.price ? yen(it.price) : '購入額未入力') + (c.repair ? ' ＋修理' + yen(c.repair) : '');
      return '<li style="view-transition-name:c' + esc(it.id.replace(/\W/g, '_')) + '"><button class="card' + (lv ? ' lv-' + lv : '') + '" type="button" data-id="' + esc(it.id) + '" aria-label="' + esc(label) + '">' +
        '<div><div class="name">' + esc(it.name) + '</div><div class="sub">' + (sub || '&nbsp;') + '</div></div>' +
        '<div class="big' + (lv ? ' c-' + lv : '') + '">' + big + '</div>' +
        (pills ? '<div class="pills">' + pills + '</div>' : '') + bar +
        '<div class="row3"><span>' + cost + '</span><span>' + (c.yearly !== null ? '年あたり ' + yen(c.yearly) : '') + '</span></div></button></li>';
    }).join('');
  }

  function emptyText(filtered){
    if(filtered) return '条件に合う家電がありません<br><button type="button" class="clr" style="margin-top:12px">条件をクリア</button>';
    if(!items.length) return 'まだ家電がありません。<br>下の「＋ 追加」から登録してください';
    return tab === 'hist' ? '買い替え済みの家電はまだありません' : '使用中の家電はありません';
  }
  // タブ・並べ替えは、カードが動いて入れ替わる（非対応の環境や、動きを減らす設定では普通に切り替える）
  function renderAnimated(){
    if(document.startViewTransition && !matchMedia('(prefers-reduced-motion:reduce)').matches) document.startViewTransition(render);
    else render();
  }
  $('#tabUse').addEventListener('click', () => { tab = 'use'; renderAnimated(); });
  $('#tabHist').addEventListener('click', () => { tab = 'hist'; renderAnimated(); });
  $('#q').addEventListener('input', render);
  $('#placeSel').addEventListener('change', render);
  $('#sortSel').addEventListener('change', (e) => { try{ localStorage.setItem(SORT_KEY, e.target.value); }catch(err){} renderAnimated(); });

  // ---------- 「⋯」メニュー（書き出し・読み込み） ----------
  const menu = $('#menu'), moreBtn = $('#moreBtn');
  function setMenu(open){ menu.hidden = !open; moreBtn.setAttribute('aria-expanded', open); }
  moreBtn.addEventListener('click', (e) => { e.stopPropagation(); setMenu(menu.hidden); });
  menu.addEventListener('click', () => setMenu(false));
  document.addEventListener('click', () => setMenu(false));
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') setMenu(false); });

  // ---------- 追加・編集の画面 ----------
  const dlg = $('#dlg');
  const F = { name:'#fName', place:'#fPlace', bought:'#fBought', price:'#fPrice', life:'#fLife', warranty:'#fWarranty', maker:'#fMaker', model:'#fModel', url:'#fUrl', memo:'#fMemo', replacedAt:'#fReplaced' };
  let editId = null;      // 編集中の家電の id（追加のときは null）
  let draftRepairs = [];  // 編集中の修理履歴
  let editOrig = '';      // 開いた時点の内容（変更の有無の判定用）
  let editBaseJson = '';  // 開いた時点の、保存済みの1台ぶん（他で更新されたかの判定用）
  function snap(){
    const o = {}; Object.keys(F).forEach((k) => { o[k] = $(F[k]).value; });
    return JSON.stringify([o, draftRepairs]);
  }
  function updateUrlLink(){
    const u = $('#fUrl').value.trim(), a = $('#urlLink');
    a.hidden = !/^https?:\/\//i.test(u);
    if(!a.hidden) a.href = u;
  }
  $('#fUrl').addEventListener('input', updateUrlLink);
  function renderRepairs(){
    $('#repList').innerHTML = draftRepairs.length ? draftRepairs.map((r) =>
      '<li><span>' + esc(r.date) + ' ' + esc(r.note || '修理') + (r.cost ? '（' + yen(r.cost) + '）' : '') + '</span>' +
      '<button type="button" data-rid="' + esc(r.id) + '" aria-label="' + esc(r.date + ' ' + (r.note || '修理')) + 'の記録を削除">削除</button></li>').join('')
      : '<li style="color:var(--ink-soft)">修理の記録はありません</li>';
  }
  function openEdit(id){
    const it = id ? items.find((x) => x.id === id) : null;
    if(id && !it) return;
    editId = id || null;
    $('#dlgTitle').textContent = it ? '家電を編集' : '家電を追加';
    Object.keys(F).forEach((k) => { $(F[k]).value = it ? (it[k] === 0 ? '' : it[k]) : ''; });
    draftRepairs = it ? it.repairs.map((r) => Object.assign({}, r)) : [];
    $('#rDate').value = todayISO(); $('#rCost').value = ''; $('#rNote').value = '';
    $('#err').textContent = '';
    $('#delBtn').hidden = !it;
    $('#replBox').hidden = !it;
    if(!(it && it.status === 'replaced')) $('#fReplaced').value = todayISO(); // 買い替えた日の初期値は今日
    if(it) $('#statusBtn').textContent = it.status === 'using' ? '保存して買い替え済みにする' : '保存して使用中に戻す';
    updateUrlLink();
    renderRepairs();
    editOrig = snap();
    editBaseJson = it ? JSON.stringify(it) : '';
    dlg.showModal();
    if(it) $('#dlgTitle').focus(); else $('#fName').focus();
  }
  // 同期・他タブの更新で内容が入れ替わるとき、編集中でなければ画面を閉じる（入力中の内容は残す）
  function closeOpenSheets(){
    if(dlg.open && snap() === editOrig) dlg.close();
  }
  $('#list').addEventListener('click', (e) => {
    if(e.target.closest('.clr')){ $('#q').value = ''; $('#placeSel').value = ''; render(); return; }
    const b = e.target.closest('.card');
    if(b) openEdit(b.dataset.id);
  });
  $('#addBtn').addEventListener('click', () => openEdit(null));
  // 入力途中で閉じるときは、破棄してよいか確認する（キャンセルボタンと Esc キーの両方）
  function askClose(){
    if(snap() === editOrig || confirm('入力した内容を破棄して閉じますか？')) dlg.close();
  }
  $('#cancelBtn').addEventListener('click', askClose);
  $('#closeBtn').addEventListener('click', askClose);
  dlg.addEventListener('cancel', (e) => { e.preventDefault(); askClose(); });
  // 入力中の修理を下書きへ足す。足せなければ false（理由は #err に出す）
  function addRepair(){
    const date = $('#rDate').value;
    if(!date){ $('#err').textContent = '修理した日を入力してください。'; return false; }
    if(draftRepairs.length >= 50){ $('#err').textContent = '修理の記録は50件までです。'; return false; }
    draftRepairs.push({ id: String(Date.now() + Math.random()), date: date, note: $('#rNote').value.trim().slice(0, 60), cost: num($('#rCost').value, 10000000) });
    draftRepairs.sort((a, b) => (a.date < b.date ? 1 : -1));
    $('#rCost').value = ''; $('#rNote').value = ''; $('#err').textContent = '';
    renderRepairs();
    return true;
  }
  $('#rAdd').addEventListener('click', addRepair);
  // 修理欄で Enter を押したときは、全体を保存せず、修理を追加する
  ['#rDate', '#rCost', '#rNote'].forEach((s) => $(s).addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){ e.preventDefault(); addRepair(); }
  }));
  $('#repList').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-rid]');
    if(!b) return;
    draftRepairs = draftRepairs.filter((r) => r.id !== b.dataset.rid);
    renderRepairs();
  });

  // フォームの内容から、保存する1台ぶんを作る。名前が空なら null
  function readForm(base){
    const o = {};
    Object.keys(F).forEach((k) => { o[k] = $(F[k]).value; });
    if(!(base && base.status === 'replaced')) o.replacedAt = ''; // 使用中の家電に買い替え日を残さない
    return sanitizeItem(Object.assign({}, base || {}, o, { id: base ? base.id : String(Date.now()), repairs: draftRepairs }));
  }
  // 保存前の入力チェック。問題があれば、メッセージと対象の欄を返す（黙って空にしない）
  function validateForm(){
    const bad = (sel, msg) => ({ sel: sel, msg: msg });
    const url = $('#fUrl').value.trim();
    if(url && !/^https?:\/\//i.test(url)) return bad('#fUrl', '説明書のURLは http:// または https:// で始めてください。');
    for(const [sel, label] of [['#fBought', '購入した年月'], ['#fWarranty', '保証の期限'], ['#fReplaced', '買い替えた日']]){
      if($(sel).validity.badInput) return bad(sel, label + 'を正しく入力してください。');
    }
    const price = $('#fPrice').value;
    if(price !== '' && (!(Number(price) >= 0) || Number(price) > 100000000)) return bad('#fPrice', '購入額は0〜1億円で入力してください。');
    const life = $('#fLife').value;
    if(life !== '' && (!(Number(life) >= 0) || Number(life) > 50)) return bad('#fLife', '寿命の目安は0〜50年で入力してください。');
    return null;
  }
  // 保存。statusChange があれば、状態（使用中／買い替え済み）も切り替える
  function commit(statusChange){
    const base = editId ? items.find((x) => x.id === editId) : null;
    if(editId && !base){
      dlg.close();
      toast('この家電は他の端末で削除されたため、保存できませんでした。');
      return;
    }
    // 「修理を追加」を押し忘れた入力は、保存時に取り込む
    if($('#rCost').value || $('#rNote').value.trim()){ if(!addRepair()) return; }
    const v = validateForm();
    if(v){ $('#err').textContent = v.msg; $(v.sel).focus(); return; }
    const next = readForm(base);
    if(!next){ $('#err').textContent = '名前を入力してください。'; $('#fName').focus(); return; }
    // 開いてから、他の端末・タブでこの家電が更新されていたら、上書きの確認を取る
    if(base && JSON.stringify(base) !== editBaseJson && !confirm('この家電は、編集中に他の端末で更新されました。今の入力で上書きしますか？')) return;
    if(statusChange){
      next.status = base.status === 'using' ? 'replaced' : 'using';
      next.replacedAt = next.status === 'replaced' ? ($('#fReplaced').value || todayISO()) : '';
    }
    if(!setItems(base ? items.map((x) => (x.id === base.id ? next : x)) : [next].concat(items))){
      $('#err').textContent = '端末に保存できませんでした。⋯→書き出しで、データを保存してください。'; // シートの下にトーストは見えないため、ここにも出す
      return;
    }
    dlg.close();
    const prevTab = tab;
    if(statusChange) tab = next.status === 'replaced' ? 'hist' : 'use';
    else if(!base){ tab = 'use'; $('#q').value = ''; $('#placeSel').value = ''; } // 追加した家電が見えるように、絞り込みを外す
    render();
    if(statusChange) toast(next.status === 'replaced' ? '買い替え済みにしました' : '使用中に戻しました', () => {
      // この1台だけを戻す（同期などで入った他の更新は消さない）
      if(!items.some((x) => x.id === base.id)) return;
      if(setItems(items.map((x) => (x.id === base.id ? base : x)))){ tab = prevTab; render(); }
    });
    else if(!base) toast('追加しました');
  }
  $('#form').addEventListener('submit', (e) => { e.preventDefault(); commit(false); });
  $('#statusBtn').addEventListener('click', () => commit(true));
  $('#delBtn').addEventListener('click', () => {
    const i = items.findIndex((x) => x.id === editId);
    dlg.close();
    if(i < 0) return;
    const removed = items[i];
    if(!setItems(items.filter((x) => x.id !== removed.id))) return;
    render();
    toast('「' + removed.name + '」を削除しました', () => {
      if(items.some((x) => x.id === removed.id)) return;
      const at = Math.min(i, items.length);
      if(setItems(items.slice(0, at).concat(removed, items.slice(at)))) render();
    });
  });

  // ---------- 元に戻す（トースト） ----------
  // 保存して items を入れ替える。保存できなければ元に戻して false（警告は save() が出す）
  function setItems(next){
    const before = items;
    items = next;
    if(!save()){ items = before; return false; }
    return true;
  }
  let toastTimer = null;
  const toastEl = $('#toast');
  function hideToast(){
    toastEl.classList.remove('show');
    try{ if(toastEl.hidePopover && toastEl.matches(':popover-open')) toastEl.hidePopover(); }catch(e){}
  }
  // important: 警告など、読む時間が要るメッセージ（長く出し、タップで閉じる）
  function toast(msg, undo, important){
    $('#toastMsg').textContent = msg;
    undoFn = undo || null;
    $('#toastUndo').style.display = undo ? '' : 'none';
    toastEl.classList.add('show');
    // 編集シートはいちばん手前の層に出るため、トーストも同じ層に出して隠れないようにする
    try{ if(toastEl.showPopover && !toastEl.matches(':popover-open')) toastEl.showPopover(); }catch(e){}
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, important ? 30000 : 6000);
  }
  // 外部の更新が入ったら、古い「元に戻す」は使えなくする
  function clearUndo(){
    if(undoFn){ undoFn = null; hideToast(); }
  }
  $('#toastUndo').addEventListener('click', () => {
    if(undoFn) undoFn();
    undoFn = null;
    hideToast();
  });
  toastEl.addEventListener('click', (e) => { if(!e.target.closest('button')) hideToast(); });

  // ---------- 書き出し・読み込み（バックアップ用） ----------
  function exportJson(prefix){
    const blob = new Blob([JSON.stringify({ app: APP_NAME, items: items })], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'kaden-' + (prefix || '') + new Date().toISOString().slice(0, 10) + '.json';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $('#exportBtn').addEventListener('click', () => exportJson());
  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  // 壊れたデータの退避（-corrupt）と、取り込み前の退避（-prev-）を、読み込める形のJSONで書き出す
  $('#rescueBtn').addEventListener('click', () => {
    let keys = [];
    try{ keys = Object.keys(localStorage).filter((k) => k.indexOf(STORAGE_KEY + '-') === 0).sort(); }catch(e){}
    if(!keys.length){ toast('退避されたデータはありません'); return; }
    keys.forEach((k, n) => setTimeout(() => {
      let text = localStorage.getItem(k) || '';
      try{ const a = JSON.parse(text); if(Array.isArray(a)) text = JSON.stringify({ app: APP_NAME, items: a }); }catch(e){ /* 壊れたデータは、そのまま書き出す */ }
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      link.download = 'kaden-退避' + k.slice(STORAGE_KEY.length) + '.json';
      document.body.append(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }, n * 400));
    toast(keys.length + '件の退避データを書き出します');
  });
  $('#importFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    try{
      const d = JSON.parse(await file.text());
      if(!d || !Array.isArray(d.items)) throw new Error('形式が違います');
      // 他のアプリのバックアップや、別形式のファイルを取り込まない
      if(d.app !== undefined && d.app !== APP_NAME) throw new Error('このアプリのバックアップではありません');
      if(d.items.length && !d.items.some((x) => x && typeof x.name === 'string')) throw new Error('形式が違います');
      const next = sanitizeList(d.items);
      let msg = '現在のデータ（' + items.length + '件）を、読み込んだ ' + next.length + ' 件に置き換えます。よろしいですか？';
      if(!next.length && items.length) msg = '【注意】ファイルは0件です。現在の' + items.length + '件がすべて消えます。 ' + msg;
      else if(items.length >= 5 && next.length < items.length / 2) msg = '【注意】ファイルの件数が現在の半分未満です。 ' + msg;
      if(!confirm(msg)) return;
      // 置き換える前のデータを退避する（日時つきで3世代まで）。あわせてJSONも自動で保存する
      try{
        const cur = localStorage.getItem(STORAGE_KEY);
        if(cur){
          localStorage.setItem(STORAGE_KEY + '-prev-' + Date.now(), cur);
          Object.keys(localStorage).filter((k) => k.indexOf(STORAGE_KEY + '-prev-') === 0).sort().slice(0, -3).forEach((k) => localStorage.removeItem(k));
        }
      }catch(e2){ /* 退避できなくても、JSONの自動保存で守る */ }
      exportJson('取り込み前-');
      const before = items;
      if(!setItems(next)) return;
      render();
      toast('読み込みました', () => { if(setItems(before)) render(); });
    }catch(err){
      toast('読み込めませんでした: ' + err.message);
    }
  });

  // ---------- 表示の切り替え（自動 → ライト → ダーク） ----------
  const THEME_NEXT = { auto:'light', light:'dark', dark:'auto' };
  const THEME_LABEL = { auto:'◐ 自動', light:'☀ ライト', dark:'☾ ダーク' };
  function getTheme(){
    try{ const t = localStorage.getItem(THEME_KEY); return (t === 'light' || t === 'dark') ? t : 'auto'; }
    catch(e){ return 'auto'; }
  }
  function applyTheme(t){
    if(t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    $('#themeBtn').textContent = THEME_LABEL[t];
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => {
      const dark = (m.getAttribute('media') || '').indexOf('dark') >= 0;
      m.setAttribute('content', t === 'light' ? '#F4F5F7' : (t === 'dark' ? '#0E1116' : (dark ? '#0E1116' : '#F4F5F7')));
    });
  }
  $('#themeBtn').addEventListener('click', () => {
    const next = THEME_NEXT[getTheme()];
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){ /* 保存できなくても表示は切り替える */ }
    applyTheme(next);
  });
  applyTheme(getTheme());

  // ---------- オフライン対応（PWA） ----------
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    navigator.serviceWorker.register('kaden-sw.js').catch(() => {});
  }

  load();
  render();

  // ---------- クラウド同期（cloud-sync.js） ----------
  function startCloud(){
    if(!window.CloudSync) return;
    cloud = CloudSync.init({
      appName: APP_NAME,
      key: SYNC_KEY,
      getData: function(){ return { items: items }; },
      trustEmpty: function(){ return !loadFailed; }, // 破損で空になっただけなら、空をクラウドへ送らない
      hasData: function(){ return items.length > 0; },
      applyData: function(d){
        if(!d || !Array.isArray(d.items)) throw new Error('データ形式が違います');
        const next = sanitizeList(d.items);
        // 先に端末へ保存する。失敗したら画面も古いままにして、次回の同期でやり直す
        try{ const s = JSON.stringify(next); localStorage.setItem(STORAGE_KEY, s); lastRaw = s; }
        catch(e){ toast('クラウドのデータを端末に保存できませんでした。'); throw e; }
        items = next;
        loadFailed = false;
        clearUndo();
        closeOpenSheets();
        render();
      }
    });
  }
  // 同期スクリプトは defer で後から読むため、読み込みが終わってから始める（CDNが遅くても、一覧は先に出る）
  if(document.readyState === 'complete') startCloud(); else window.addEventListener('load', startCloud);
})();
</script>
</body>
</html>
