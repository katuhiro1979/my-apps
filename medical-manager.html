<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>医療管理</title>
<meta name="theme-color" content="#F4F7F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1514" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="医療管理">
<link rel="manifest" href="medical-manifest.json">
<link rel="icon" href="medical-icon-192.png">
<link rel="apple-touch-icon" href="medical-icon-192.png">
<script>
  /* 保存済みの表示設定を、画面が描かれる前に反映（ちらつき防止） */
  try{ var t=localStorage.getItem('medical-app-theme'); if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t); }catch(e){}
</script>
<style>
  /* ===== デザイントークン（ライト／ダーク。ダークは端末の設定に自動で従う） ===== */
  :root{
    color-scheme:light dark;
    --bg:#F4F7F6; --paper:#FFFFFF; --surface-2:#EAF0EE;
    --ink:#16221F; --ink-soft:#52625D; --line:#D3DEDA;
    --accent:#0F6B5C; --on-accent:#FFFFFF; --tint:#E1F2EE; --focus:#1D6FD8;
    --danger:#B3261E; --danger-bg:#FDECEA;
    --shadow-lg:0 8px 28px rgba(22,34,31,.22);
    --radius:14px; --radius-s:10px; /* カード／ボタン・入力欄 */
    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; /* 余白の刻み */
    --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0F1514; --paper:#182120; --surface-2:#1F2B29;
      --ink:#E8F0ED; --ink-soft:#9FB1AB; --line:#2A3735;
      --accent:#5CC7B2; --on-accent:#06231E; --tint:#173A34; --focus:#6FA8FF;
      --danger:#FF8F87; --danger-bg:#3A1D1B;
      --shadow-lg:0 8px 28px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"]{ color-scheme:light; }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0F1514; --paper:#182120; --surface-2:#1F2B29;
    --ink:#E8F0ED; --ink-soft:#9FB1AB; --line:#2A3735;
    --accent:#5CC7B2; --on-accent:#06231E; --tint:#173A34; --focus:#6FA8FF;
    --danger:#FF8F87; --danger-bg:#3A1D1B;
    --shadow-lg:0 8px 28px rgba(0,0,0,.6);
  }

  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); line-height:1.6; font-variant-numeric:tabular-nums; padding:env(safe-area-inset-top) 16px calc(112px + env(safe-area-inset-bottom)); }
  main{ max-width:640px; margin:0 auto; }
  header{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:16px 0 8px; }
  h1{ font-size:1.25rem; margin:0; }
  h2{ font-size:1.05rem; margin:20px 0 8px; }
  button, input, select, textarea{ font:inherit; color:inherit; }
  button{ min-height:44px; padding:0 14px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--paper); cursor:pointer; }
  button.primary{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:3px solid var(--focus); outline-offset:2px; }
  .bar{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 16px; }
  .card{ padding:12px 14px; margin-bottom:10px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); }
  .card .num{ font-size:1.4rem; font-weight:700; }
  .soft{ color:var(--ink-soft); font-size:.9rem; }
  .vh{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; } /* 読み上げだけに出す文字 */
  /* 下のタブ（画面の切り替え） */
  #tabs{ position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--paper); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  #tabs .in{ display:flex; max-width:640px; margin:0 auto; }
  #tabs button{ flex:1 1 0; min-width:0; min-height:56px; padding:0 2px; border:0; border-radius:0; background:transparent; color:var(--ink-soft); font-size:.8rem; }
  @media (min-width:360px){ #tabs button{ font-size:.875rem; } }
  #tabs button[aria-current="page"]{ color:var(--accent); font-weight:700; box-shadow:inset 0 3px 0 var(--accent); }
  /* 消えない通知（警告など。閉じるまで残る） */
  .notice{ display:flex; align-items:flex-start; gap:8px; margin:4px 0 12px; padding:10px 12px; border:1px solid var(--danger); border-radius:var(--radius-s); background:var(--danger-bg); color:var(--danger); font-size:.9rem; }
  .notice[hidden]{ display:none; }
  .notice span{ flex:1; padding-top:10px; }
  .notice button{ min-height:44px; background:transparent; color:inherit; border-color:currentColor; }
  /* 確認画面（標準の confirm の代わり） */
  #cfm{ margin:auto; width:min(420px,calc(100% - 32px)); max-height:none; padding:16px; border-radius:16px; }
  #cfm p{ margin:0 0 14px; line-height:1.6; white-space:pre-line; }
  #cfm .acts{ display:flex; gap:8px; }
  #cfm .acts button{ flex:1; }
  .err{ color:var(--danger); font-size:.875rem; min-height:1.2em; margin-bottom:4px; } /* 入力エラーの表示欄 */
  .toast{ position:fixed; left:50%; bottom:calc(80px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:none; align-items:center; gap:12px; padding:10px 14px; background:var(--ink); color:var(--bg); border-radius:12px; box-shadow:var(--shadow-lg); z-index:50; max-width:calc(100vw - 32px); }
  .toast{ top:auto; right:auto; margin:0; border:0; overflow:visible; } /* popover（最前面の層）の既定の見た目を打ち消す */
  .toast.show{ display:flex; }
  .toast button{ min-height:44px; background:transparent; color:inherit; border-color:currentColor; }
  h3{ font-size:1rem; margin:16px 0 8px; }
  .field{ margin-bottom:10px; }
  button[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  /* 記録: 最新の数値タイルと、グラフの面 */
  .tiles{ display:grid; grid-template-columns:repeat(2,1fr); gap:var(--sp-2); margin-bottom:var(--sp-3); }
  .tile{ display:flex; flex-direction:column; gap:2px; padding:12px 14px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); min-width:0; }
  .tile b{ font-size:2rem; line-height:1.1; color:var(--accent); overflow-wrap:anywhere; }
  .tile .unit{ font-size:.875rem; color:var(--ink-soft); }
  .tile .soft{ font-size:.875rem; }
  .card[data-kind=labResults] .mn{ font-size:1.25rem; }
  #recBody svg, #labBody svg{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:var(--sp-2); box-sizing:border-box; }
  .chtab{ margin:8px 0 16px; }
  .chtab summary{ min-height:44px; display:flex; align-items:center; cursor:pointer; }
  .chtab table{ width:100%; border-collapse:collapse; font-size:.9rem; }
  .chtab th, .chtab td{ text-align:left; padding:6px 4px; border-bottom:1px solid var(--line); }
  .bar .field{ flex:1 1 140px; margin:0; }
  .field label{ display:block; font-size:.9rem; color:var(--ink-soft); margin-bottom:2px; }
  .field input, .field select, .field textarea{ width:100%; min-height:44px; padding:8px 12px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--paper); }
  .field textarea{ resize:vertical; }
  .field [aria-invalid="true"]{ border-color:var(--danger); }
  /* 緊急情報（読むだけの画面。文字を大きく） */
  #emg{ margin:auto; width:min(560px,calc(100% - 24px)); max-height:90vh; overflow:auto; padding:16px; border-radius:16px; }
  #emg h2{ margin:0 0 8px; }
  #emg dl{ margin:0 0 12px; }
  #emg .er{ padding:8px 0; border-top:1px solid var(--line); }
  #emg dt{ font-size:.875rem; color:var(--ink-soft); }
  #emg dd{ margin:0; font-size:1.15rem; white-space:pre-wrap; word-break:break-word; }
  #emg ul{ margin:0; padding-left:1.2em; list-style:disc; }
  #emg .acts button{ width:100%; }
  /* 診察用要約（緊急情報と同じ作り。文字は少し小さめ） */
  #sum{ margin:auto; width:min(640px,calc(100% - 24px)); max-height:90vh; overflow:auto; padding:16px; border-radius:16px; }
  #sum h2{ margin:0 0 8px; }
  #sum h3{ margin:16px 0 4px; font-size:1.05rem; padding-left:8px; border-left:4px solid var(--accent); }
  #sum dl{ margin:0; }
  #sum .er{ padding:6px 0; border-top:1px solid var(--line); }
  #sum dt{ font-size:.875rem; color:var(--ink-soft); }
  #sum dd{ margin:0; word-break:break-word; white-space:pre-wrap; }
  #sum ul{ margin:0; padding-left:1.2em; list-style:disc; }
  #sum .acts button{ width:100%; }
  /* 薬の一覧と登録・編集 */
  .card .acts{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .card.ended{ background:var(--surface-2); }
  .hl{ margin:6px 0 0; padding-left:1.2em; list-style:disc; }
  /* ホーム: 次の予約を一番目立たせ、気をつけることは左の太線で示す */
  .card.hero{ background:var(--tint); border-color:var(--accent); }
  .card.hero .num{ font-size:1.8rem; color:var(--accent); }
  .card.hero .hl > li:first-child{ font-size:1.3rem; font-weight:700; }
  .card .ttl{ font-size:1rem; font-weight:700; color:var(--ink); }
  .tag.today{ background:var(--accent); color:var(--on-accent); font-weight:700; }
  .card.attn{ border-left:5px solid var(--danger); }
  /* お薬手帳・通院・設定: 見出しの左線、薬名・日時を大きく、設定の入力欄を面にまとめる */
  #v-med h3, #v-visit h3, #v-set h3{ padding-left:8px; border-left:4px solid var(--accent); }
  h4.grp{ margin:14px 0 6px; font-size:1rem; color:var(--ink-soft); }
  .card .mn{ font-size:1.15rem; }
  .card.ended .mn{ color:var(--ink-soft); }
  #pfForm, #rgForm{ padding:var(--sp-3); background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); }
  #rgForm:empty{ display:none; }
  /* 共通部品: 警告バッジ（色だけに頼らず、▲と文字を必ず付ける）／状態の札／空の状態 */
  .warn{ display:inline-block; color:var(--danger); background:var(--danger-bg); font-weight:700; font-size:.9rem; padding:1px 10px; border-radius:8px; }
  .tag{ display:inline-block; font-size:.875rem; padding:1px 10px; border-radius:99px; background:var(--tint); color:var(--ink); }
  .empty{ padding:20px 16px; text-align:center; border:1px dashed var(--line); border-radius:var(--radius); background:var(--paper); }
  .card .acts{ padding-top:var(--sp-2); border-top:1px solid var(--line); }
  .field input:focus-visible, .field select:focus-visible, .field textarea:focus-visible{ border-color:var(--accent); }
  button{ transition:background-color .15s, border-color .15s, transform .1s; }
  button:active{ transform:scale(.98); }
  @media (hover:hover){ button:not(.primary):not([aria-pressed="true"]):hover{ background:var(--surface-2); } button.primary:hover{ filter:brightness(1.08); } }
  @media (prefers-reduced-motion:reduce){ button{ transition:none; } button:active{ transform:none; } }
  #ed{ margin:auto; width:min(560px,calc(100% - 24px)); max-height:92vh; overflow:auto; padding:0; border-radius:16px; }
  #edForm{ padding:16px; }
  #edForm h2{ margin:0 0 12px; }
  #edForm fieldset{ border:0; margin:0 0 10px; padding:0; }
  #edForm legend{ font-size:.9rem; color:var(--ink-soft); padding:0; margin-bottom:2px; }
  .chks{ display:flex; flex-wrap:wrap; gap:8px; }
  .chks label{ display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0 12px; border:1px solid var(--line); border-radius:var(--radius-s); background:var(--paper); }
  .chks input{ width:20px; height:20px; margin:0; }
  #edForm .acts{ display:flex; gap:8px; flex-wrap:wrap; }
  #edForm .acts button{ flex:1; }
  button.danger{ color:var(--danger); border-color:var(--danger); }
  /* 同期の☁ボタン（cloud-sync.js が作る）を、下のタブの上へ逃がす */
  #cs-btn{ bottom:calc(68px + env(safe-area-inset-bottom,0px)) !important; }
  #cs-panel{ bottom:calc(120px + env(safe-area-inset-bottom,0px)) !important; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>医療管理</h1>
    <button id="themeBtn" type="button" aria-label="表示の切り替え"></button>
  </header>

  <div class="notice" id="notice" role="alert" hidden><span id="noticeMsg"></span><button type="button" id="noticeClose" aria-label="この通知を閉じる">閉じる</button></div>

  <!-- 画面ごとの入れ物。表示するのは1つだけ。中身は各フェーズで作る -->
  <section id="v-home" aria-labelledby="t-home">
    <h2 id="t-home">ホーム</h2>
    <div class="bar"><button id="emgBtn" type="button" class="primary">緊急情報を開く</button><button id="sumBtn" type="button">診察用の要約を開く</button></div>
    <div id="homeBody"></div>
  </section>
  <section id="v-med" aria-labelledby="t-med" hidden>
    <h2 id="t-med">お薬手帳</h2>
    <div id="medBody"></div>
  </section>
  <section id="v-visit" aria-labelledby="t-visit" hidden>
    <h2 id="t-visit">通院</h2>
    <div id="visitBody"></div>
  </section>
  <section id="v-rec" aria-labelledby="t-rec" hidden>
    <h2 id="t-rec">記録</h2>
    <div id="recBody"></div>
  </section>
  <section id="v-lab" aria-labelledby="t-lab" hidden>
    <h2 id="t-lab">検査</h2>
    <div id="labBody"></div>
  </section>
  <section id="v-set" aria-labelledby="t-set" hidden>
    <h2 id="t-set">設定</h2>
    <h3>プロフィール</h3>
    <form id="pfForm" novalidate>
      <div class="field"><label for="pf-name">氏名</label><input id="pf-name" type="text" maxlength="100" autocomplete="off"></div>
      <div class="field"><label for="pf-birth">生年月日</label><input id="pf-birth" type="date"></div>
      <div class="field"><label for="pf-blood">血液型（ABO式）</label><select id="pf-blood"><option value="">未登録</option><option value="A">A型</option><option value="B">B型</option><option value="O">O型</option><option value="AB">AB型</option></select></div>
      <div class="field"><label for="pf-height">身長（cm）</label><input id="pf-height" type="number" inputmode="decimal" min="1" max="300" step="0.1"></div>
      <div class="field"><label for="pf-allergy">アレルギー</label><textarea id="pf-allergy" rows="2" maxlength="1000"></textarea></div>
      <div class="field"><label for="pf-disease">持病</label><textarea id="pf-disease" rows="2" maxlength="1000"></textarea></div>
      <div class="field"><label for="pf-history">既往歴</label><textarea id="pf-history" rows="2" maxlength="1000"></textarea></div>
      <div class="field"><label for="pf-doctor">かかりつけ医</label><input id="pf-doctor" type="text" maxlength="100" autocomplete="off"></div>
      <div class="field"><label for="pf-contactName">緊急連絡先の名前</label><input id="pf-contactName" type="text" maxlength="100" autocomplete="off"></div>
      <div class="field"><label for="pf-contactTel">緊急連絡先の電話番号</label><input id="pf-contactTel" type="tel" maxlength="30" autocomplete="off"></div>
      <div class="err" id="pfErr" role="alert"></div>
      <div class="bar"><button class="primary" type="submit">プロフィールを保存</button></div>
    </form>
    <h3>基準値（グラフの線）</h3>
    <p class="soft">記録タブのグラフに、下限・上限の線を引きます。外れた値には「▲」がつきます。空欄は未設定です。医師に指示された目安などを入れてください（このアプリは判定をしません）。</p>
    <form id="rgForm" novalidate></form>
    <h3>データ</h3>
    <div class="bar">
      <button id="exportBtn" type="button">書き出し（JSON）</button>
      <button id="importBtn" type="button">読み込み</button>
      <button id="rescueBtn" type="button">退避データを書き出す</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
    <h3>ごみ箱</h3>
    <p class="soft">削除した項目がここに入ります。復元するか、1件ずつ完全に削除できます。</p>
    <div id="trashBody"></div>
    <p class="soft">データ件数: <span id="setCount"></span></p>
    <p class="soft">このアプリは記録のためのものです。医療行為の判断には使わず、医師・薬剤師の指示に従ってください。</p>
  </section>
</main>

<nav id="tabs" aria-label="画面の切り替え">
  <div class="in">
    <button type="button" data-view="home" aria-current="page">ホーム</button>
    <button type="button" data-view="med">お薬手帳</button>
    <button type="button" data-view="visit">通院</button>
    <button type="button" data-view="rec">記録</button>
    <button type="button" data-view="lab">検査</button>
    <button type="button" data-view="set">設定</button>
  </div>
</nav>

<dialog id="emg" aria-labelledby="emgTitle">
  <h2 id="emgTitle" tabindex="-1">緊急情報</h2>
  <dl id="emgBody"></dl>
  <form method="dialog" class="acts"><button class="primary" id="emgClose">閉じる</button></form>
</dialog>

<dialog id="sum" aria-labelledby="sumTitle">
  <h2 id="sumTitle" tabindex="-1">診察用の要約</h2>
  <div class="field"><label for="sumDays">記録・症状メモの期間</label><select id="sumDays"></select></div>
  <div id="sumBody"></div>
  <form method="dialog" class="acts"><button class="primary" id="sumClose">閉じる</button></form>
</dialog>

<dialog id="ed" aria-labelledby="edTitle">
  <form id="edForm" novalidate>
    <h2 id="edTitle"></h2>
    <div id="edFields"></div>
    <div class="err" id="edErr" role="alert"></div>
    <div class="acts">
      <button class="primary" type="submit">保存</button>
      <button type="button" id="edCancel">キャンセル</button>
      <button type="button" id="edDel" class="danger">削除</button>
    </div>
  </form>
</dialog>

<dialog id="cfm" aria-labelledby="cfmMsg">
  <form method="dialog">
    <p id="cfmMsg"></p>
    <div class="acts"><button class="primary" id="cfmNo" value="no"></button><button id="cfmOk" value="ok"></button></div>
  </form>
</dialog>

<div class="vh" id="live" role="status" aria-live="polite"></div>
<div class="toast" id="toast" popover="manual"><span id="toastMsg"></span><button id="toastUndo" type="button">元に戻す</button><button id="toastClose" type="button" aria-label="閉じる">×</button></div>

<!-- クラウド同期（右下の☁ボタンは、このスクリプトが作る）。読み込めなくても端末内だけで動く -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4" integrity="sha384-GFr3yTh5lJznCbZfpTtXnwboFsxqtTQoeTZCRHhE0579KrRmlCzen5AA8ohaB5ug" crossorigin="anonymous" defer></script>
<script src="cloud-sync.js" defer></script>
<script>
(function(){
  'use strict';
  const $ = (s) => document.querySelector(s);

  const STORAGE_KEY = 'medical-app-data-v1';
  const THEME_KEY = 'medical-app-theme';
  const APP_NAME = '医療管理'; // クラウドの app_name。他のアプリと重複させない（重複すると上書きされる）
  const SYNC_KEY = 'data-v1';
  const DATA_VERSION = 1;

  let state = null;     // アプリのデータ本体（emptyState と同じ形）
  let cloud = null;     // クラウド同期。読み込めない環境では null のまま
  let undoFn = null;    // 直前の操作を元に戻す関数
  let view = 'home';    // 表示中の画面

  // ---------- 日付・値の部品 ----------
  const pad = (n) => (n < 10 ? '0' : '') + n;
  function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  // 日付の検証（13月や2月30日、5桁の年を通さない）
  function isDate(s){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
    if(!m) return false;
    const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    return d.getFullYear() === Number(m[1]) && d.getMonth() === Number(m[2]) - 1 && d.getDate() === Number(m[3]);
  }
  // 日時（YYYY-MM-DDTHH:mm）の検証。25時や60分を通さない
  function isDateTime(s){

  // ---------- 保存と読み込み ----------
  let lastRaw = null;       // 最後に保存・読み込みした保存データ（古い画面の検出用）

  // 読み込めなかった元データを別キーへ退避する（次の保存で消えないように）。日時つきで3世代まで

  // ごみ箱（設定画面）: 削除した項目を種類をまたいで新しい順に並べる

  // ---------- プロフィール（設定画面） ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const PF_KEYS = ['name', 'birth', 'blood', 'height', 'allergy', 'disease', 'history', 'doctor', 'contactName', 'contactTel'];
  const pf = (k) => $('#pf-' + k);
  // 保存済みの値を入力欄へ入れる。入力中は、書きかけを消さないよう上書きしない
  function fillProfile(force){
    if(!force && $('#pfForm').contains(document.activeElement) && document.activeElement.tagName !== 'BUTTON') return;

  // ---------- 基準値（設定画面） ----------

  function fillRanges(force){
    if(!force && $('#rgForm').contains(document.activeElement) && document.activeElement.tagName !== 'BUTTON') return;

  // ---------- 薬・病院・予約・診察記録 ----------

  const uid = () => Date.now() + '_' + Math.random().toString(36).slice(2, 8);

  const hospName = (id) => { const h = alive(state.hospitals).filter((x) => x.id === id)[0]; return h ? h.name : (id ? '（削除済みの病院）' : ''); };
  const nowLocal = () => { const n = new Date(); return todayISO() + 'T' + pad(n.getHours()) + ':' + pad(n.getMinutes()); };
  const ymd = (s) => s.replace(/-/g, '/');

  // 予約: これから（近い順）と過去（新しい順）。今日・明日は記号つきで強調（色だけに頼らない）
  function apCard(a, past){
    const d = a.at.slice(0, 10), mark = past ? '' : (d === todayISO() ? '今日' : (d === tomorrowISO() ? '明日' : ''));
    const hn = hospName(a.hospitalId);

  function visitCard(v){

      line(v.prescribed ? '処方: あり' : '') + line(v.next ? '次回予定: ' + ymd(v.next) : '') + line(v.cost !== null ? '費用: ' + yen(v.cost) : '') +

  // 診察記録を病院ごとにまとめる（新しい日付順に並んだ vs を受け取る。最近行った病院が上）
  // 病院が2つ以上あるときは、病院で絞り込むボタンを上に出す。1つのまとまりは最新5件まで、残りは「さらに見る」で開く
  const VISIT_LIMIT = 5;
  let visitSel = '*';          // 絞り込み中の病院id（'*'＝すべて、''＝病院の指定なし）。保存しない
  const visitMore = new Set(); // 「さらに見る」で全件開いた病院id
  function visitGroups(vs){
    const groups = [], idx = new Map();
    vs.forEach((v) => {
      const k = v.hospitalId || '';
      if(!idx.has(k)){ idx.set(k, groups.length); groups.push({ key: k, name: hospName(k) || '', list: [] }); }
      groups[idx.get(k)].list.push(v);
    });
    if(visitSel !== '*' && !idx.has(visitSel)) visitSel = '*';
    const gname = (g) => g.name || '病院の指定なし';
    const chip = (k, l) => '<button type="button" data-vsel="' + esc(k) + '" aria-pressed="' + (visitSel === k) + '">' + esc(l) + '</button>';
    const chips = groups.length > 1 ? '<div class="bar" role="group" aria-label="病院で絞り込む">' + chip('*', 'すべて（' + vs.length + '）') +
      groups.map((g) => chip(g.key, gname(g) + '（' + g.list.length + '）')).join('') + '</div>' : '';
    return chips + groups.filter((g) => visitSel === '*' || g.key === visitSel).map((g) => {
      const list = visitMore.has(g.key) ? g.list : g.list.slice(0, VISIT_LIMIT), rest = g.list.length - list.length;
      return '<h4 class="grp">' + esc(gname(g)) + '（' + g.list.length + '件）</h4>' + list.map(visitCard).join('') +
        (rest > 0 ? '<div class="bar"><button type="button" data-vmore="' + esc(g.key) + '">さらに' + rest + '件を見る</button></div>' : '');
    }).join('');
  }
  $('#visitBody').addEventListener('click', (e) => {
    const s = e.target.closest('button[data-vsel]'), m = e.target.closest('button[data-vmore]');
    if(s){

      const nb = Array.from(document.querySelectorAll('#visitBody button[data-vsel]')).filter((x) => x.dataset.vsel === visitSel)[0]; if(nb) nb.focus();
    }else if(m){
      // 開く前の最後のカードを覚えておき、開いた後はその次（新しく出た最初のカード）へフォーカスを移す
      const last = m.closest('.bar').previousElementSibling, lastId = last && last.dataset.id;
      visitMore.add(m.dataset.vmore); renderVisitTab();
      const lc = Array.from(document.querySelectorAll('#visitBody .card[data-kind=visits]')).filter((x) => x.dataset.id === lastId)[0];
      const fb = lc && lc.nextElementSibling && lc.nextElementSibling.querySelector('button'); if(fb) fb.focus();
    }
  });
  function hospCard(h){
    return card('hospitals', h.id, '',
      '<div><b class="mn">' + esc(h.name) + '</b></div>' + line(h.dept ? '診療科: ' + h.dept : '') + line(h.address ? '住所: ' + h.address : '') +
      (h.tel ? '<div class="soft">電話: ' + telLink(h.tel) + '</div>' : '') + line(h.hours ? '診療時間: ' + h.hours : '') +
      '<div class="acts">' + editBtn(h.name) + '</div>');
  }
  function renderVisitTab(){
    const nowKey = (() => { const n = new Date(); return todayISO() + 'T' + pad(n.getHours()) + ':' + pad(n.getMinutes()); })();
    const aps = alive(state.appointments);
    const next = aps.filter((a) => a.at >= nowKey).sort((a, b) => a.at < b.at ? -1 : 1);
    const past = aps.filter((a) => a.at < nowKey).sort((a, b) => a.at < b.at ? 1 : -1);
    const vs = alive(state.visits).slice().sort((a, b) => a.date < b.date ? 1 : -1);
    const hs = alive(state.hospitals).slice().sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    const none = (t) => '<p class="soft empty">' + t + '</p>';
    $('#visitBody').innerHTML =
      addBar([['appointments', '予約を追加', 1], ['visits', '診察記録を追加'], ['hospitals', '病院を追加']]) +
      '<h3>これからの予約（' + next.length + '件）</h3>' + (next.length ? next.map((a) => apCard(a, false)).join('') : none('予定はありません。')) +
      (past.length ? '<h3>過去の予約（' + past.length + '件）</h3>' + past.map((a) => apCard(a, true)).join('') : '') +
      '<h3>診察記録（' + vs.length + '件）</h3>' + (vs.length ? visitGroups(vs) : none('まだありません。')) +
      '<h3>病院（' + hs.length + '件）</h3>' + (hs.length ? hs.map(hospCard).join('') : none('まだありません。'));
  }
  // 記録タブ: 測定と症状メモを、新しい順に並べる。日付で絞り込める
  let recFrom = '', recTo = '';
  const vitalText = (x) => [
    x.temp !== null ? '体温 ' + x.temp + '℃' : '',
    x.sys !== null || x.dia !== null ? '血圧 ' + (x.sys !== null ? x.sys : '－') + '/' + (x.dia !== null ? x.dia : '－') + ' mmHg' : '',
    x.pulse !== null ? '脈拍 ' + x.pulse + ' 回/分' : '', x.weight !== null ? '体重 ' + x.weight + ' kg' : ''].filter(Boolean).join('　');
  // 基準値との比較（未設定なら ''）。外れたら 'high' / 'low'
  const flagOf = (k, v) => { const r = state.settings.ranges[k]; return v === null ? '' : (r.high !== null && v > r.high ? 'high' : (r.low !== null && v < r.low ? 'low' : '')); };
  const flagText = (f) => f === 'high' ? '高い' : '低い';
  const flagsOf = (x) => VITAL_KEYS.filter((k) => flagOf(k, x[k])).map((k) => '▲' + VITAL_LABEL[k] + ' ' + flagText(flagOf(k, x[k])));

  // 折れ線グラフ（SVG）。o: { series:[{ name, pts:[{ t, v }], low, high, dash }], from, to, label }
  // 基準値の外の点は、色に加えて三角（▲）で示す。点が0個・1個でも崩れない
  function drawChart(o){
    const all = o.series.reduce((a, s) => a.concat(s.pts), []);
    if(!all.length) return '<p class="soft">この期間の測定はありません。</p>';
    const W = 340, H = 200, L = 40, R = 10, T = 12, B = 26, pw = W - L - R, ph = H - T - B;
    const vals = all.map((p) => p.v);
    o.series.forEach((s) => { if(s.low !== null) vals.push(s.low); if(s.high !== null) vals.push(s.high); });
    let mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
    if(mn === mx){ mn -= 1; mx += 1; }
    const pad = (mx - mn) * 0.12; mn -= pad; mx += pad;
    const X = (t) => L + (t - o.from) / (o.to - o.from) * pw, Y = (v) => T + ph - (v - mn) / (mx - mn) * ph;
    const r1 = (v) => Math.round(v * 10) / 10;
    let g = '';
    for(let i = 0; i < 4; i++){
      const v = mn + (mx - mn) * i / 3, y = Y(v).toFixed(1);
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="var(--line)"/><text x="' + (L - 4) + '" y="' + (Number(y) + 3) + '" text-anchor="end" font-size="12" fill="var(--ink-soft)">' + r1(v) + '</text>';
    }
    [0, 0.5, 1].forEach((f) => {
      const d = new Date(o.from + (o.to - o.from) * f);
      g += '<text x="' + (L + pw * f).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (f === 0 ? 'start' : f === 1 ? 'end' : 'middle') + '" font-size="12" fill="var(--ink-soft)">' + (d.getMonth() + 1) + '/' + d.getDate() + '</text>';
    });
    o.series.forEach((s) => {
      [['low', '下限'], ['high', '上限']].forEach((b) => {
        if(s[b[0]] === null) return;
        const y = Y(s[b[0]]).toFixed(1);
        g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="var(--ink-soft)" stroke-dasharray="2 3"/><text x="' + (W - R - 2) + '" y="' + (Number(y) - 2) + '" text-anchor="end" font-size="11" fill="var(--ink-soft)">' + (o.series.length > 1 ? s.name : '') + b[1] + ' ' + s[b[0]] + '</text>';
      });
    });
    o.series.forEach((s, si) => {
      if(s.pts.length > 1) g += '<polyline fill="none" stroke="var(--ink)" stroke-width="1.5"' + (s.dash ? ' stroke-dasharray="5 3"' : '') + ' points="' + s.pts.map((p) => X(p.t).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ') + '"/>';
      s.pts.forEach((p) => {
        const x = X(p.t), y = Y(p.v);
        if(p.flag) g += '<polygon points="' + x.toFixed(1) + ',' + (y - 6).toFixed(1) + ' ' + (x - 5.5).toFixed(1) + ',' + (y + 4).toFixed(1) + ' ' + (x + 5.5).toFixed(1) + ',' + (y + 4).toFixed(1) + '" fill="var(--danger)" stroke="var(--danger)"/>';
        else g += si ? '<rect x="' + (x - 3.5).toFixed(1) + '" y="' + (y - 3.5).toFixed(1) + '" width="7" height="7" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/>'
          : '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="3.5" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/>';
      });
    });
    const legend = o.series.length > 1 ? '<div class="soft">●実線＝' + o.series[0].name + '　■破線＝' + o.series[1].name + '</div>' : '';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="' + esc(o.label + '（' + all.length + '点）。値は、下の一覧にあります') + '">' + g + '</svg>' + legend +

  function validateEd(){
    const cfg = EDITORS[edKind], v = {};
    for(const f of cfg.fields){
      const el = $(fid(f.k));
      if(el.validity && el.validity.badInput) return { el, msg: f.l.replace('（必須）', '') + 'が正しくありません。' };
      v[f.k] = readField(f);
      if(f.req && !v[f.k]) return { el, msg: f.req };
      if(f.t === 'date' && v[f.k] && !isDate(v[f.k])) return { el, msg: f.l.replace('（必須）', '') + 'が正しくありません。' };
      if(f.t === 'dt' && v[f.k] && !isDateTime(v[f.k])) return { el, msg: f.l.replace('（必須）', '') + 'が正しくありません。' };
      if(f.t === 'num' && v[f.k] !== null && !(Number.isFinite(v[f.k]) && v[f.k] >= f.range[0] && v[f.k] <= f.range[1])) return { el, msg: f.l + 'は ' + f.range[0] + '〜' + f.range[1] + ' の範囲で入力してください。' };

  const toastEl = $('#toast');
  function hideToast(){
    toastEl.classList.remove('show');
    try{ if(toastEl.hidePopover && toastEl.matches(':popover-open')) toastEl.hidePopover(); }catch(e){}
  }
  // important: 警告など、読む時間が要るメッセージ（長く出す）。<dialog> を使うアプリでも隠れないよう、popover の最前面の層に出す
  function toast(msg, undo, important){
    $('#toastMsg').textContent = msg;
    $('#live').textContent = ''; setTimeout(() => { $('#live').textContent = msg; }, 50); // display:none から出る通知は読まれにくいため、常設の領域にも入れる
    undoFn = undo || null;
    $('#toastUndo').style.display = undo ? '' : 'none';
    toastEl.classList.add('show');
    try{ if(toastEl.showPopover && !toastEl.matches(':popover-open')) toastEl.showPopover(); }catch(e){}
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, important ? 30000 : 6000);
  }
  // 外部の更新（他タブ・クラウド）が入ったら、古い「元に戻す」は使えなくする
  function clearUndo(){
    if(undoFn){ undoFn = null; hideToast(); }
  }
  $('#toastUndo').addEventListener('click', () => {
    if(undoFn) undoFn();
    undoFn = null;
    hideToast();
  });
  toastEl.addEventListener('click', (e) => { if(!e.target.closest('button')) hideToast(); });
  $('#toastClose').addEventListener('click', () => { undoFn = null; hideToast(); });

  // ---------- 確認画面（標準の confirm の代わり） ----------
  // 押したボタンが ok なら true。安全な方（戻る）に初期フォーカスを置く
  function askConfirm(msg, okLabel, noLabel){
    return new Promise((resolve) => {
      const d = $('#cfm');
      $('#cfmMsg').textContent = msg; $('#cfmOk').textContent = okLabel; $('#cfmNo').textContent = noLabel || 'キャンセル';
      d.returnValue = 'no';
      d.addEventListener('close', () => resolve(d.returnValue === 'ok'), { once: true });
      d.showModal(); $('#cfmNo').focus();
    });
  }

  // ---------- 書き出し・読み込み（バックアップ用） ----------
  function exportJson(prefix){
    const blob = new Blob([JSON.stringify({ app: APP_NAME, data: state })], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'medical-' + (prefix || '') + todayISO() + '.json';
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $('#exportBtn').addEventListener('click', () => exportJson());
  $('#importBtn').addEventListener('click', () => $('#importFile').click());
  // 壊れたデータの退避（-corrupt）と、取り込み前の退避（-prev-）を、読み込める形のJSONで書き出す
  $('#rescueBtn').addEventListener('click', () => {
    let keys = [];
    try{ keys = Object.keys(localStorage).filter((k) => k.indexOf(STORAGE_KEY + '-') === 0).sort(); }catch(e){}
    if(!keys.length){ toast('退避されたデータはありません'); return; }
    keys.forEach((k, n) => setTimeout(() => {
      let text = localStorage.getItem(k) || '';
      try{ const o = JSON.parse(text); if(o && typeof o === 'object' && !Array.isArray(o)) text = JSON.stringify({ app: APP_NAME, data: o }); }catch(e){ /* 壊れたデータは、そのまま書き出す */ }
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      link.download = 'medical-退避' + k.slice(STORAGE_KEY.length) + '.json';
      document.body.append(link); link.click(); link.remove();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    }, n * 400));
    toast(keys.length + '件の退避データを書き出します');
  });
  $('#importFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    try{
      const d = JSON.parse(await file.text());
      if(!d || typeof d.data !== 'object' || !d.data || Array.isArray(d.data)) throw new Error('形式が違います');
      // 他のアプリのバックアップや、別形式のファイルを取り込まない
      if(d.app !== undefined && d.app !== APP_NAME) throw new Error('このアプリのバックアップではありません');
      if(!LISTS.concat('profile').some((k) => k in d.data)) throw new Error('形式が違います');
      const r = sanitizeState(d.data);
      const next = r.state;
      const cur = countItems(state), nn = countItems(next);
      let msg = '現在のデータ（' + cur + '件）を、読み込んだ ' + nn + ' 件に置き換えます。よろしいですか？';
      if(r.bad) msg = '読み込めない項目が' + r.bad + '件ありました（取り除きます）。 ' + msg;
      if(!nn && cur) msg = '【注意】ファイルは0件です。現在の' + cur + '件がすべて消えます。 ' + msg;
      else if(cur >= 5 && nn < cur / 2) msg = '【注意】ファイルの件数が現在の半分未満です。 ' + msg;
      if(!(await askConfirm(msg, '置き換える', 'やめる'))) return;
      // 置き換える前のデータを退避する（日時つきで3世代まで）。あわせてJSONも自動で保存する
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw){
          localStorage.setItem(STORAGE_KEY + '-prev-' + Date.now(), raw);
          Object.keys(localStorage).filter((k) => k.indexOf(STORAGE_KEY + '-prev-') === 0).sort().slice(0, -3).forEach((k) => localStorage.removeItem(k));
        }
      }catch(e2){ /* 退避できなくても、JSONの自動保存で守る */ }
      exportJson('取り込み前-');
      const before = state;
      if(!setState(next)) return;
      render();
      toast('読み込みました', () => { if(setState(before)) render(); });
    }catch(err){
      toast('読み込めませんでした: ' + err.message);
    }
  });

  // ---------- 表示の切り替え（自動 → ライト → ダーク） ----------
  const THEME_NEXT = { auto:'light', light:'dark', dark:'auto' };
  const THEME_LABEL = { auto:'◐ 自動', light:'☀ ライト', dark:'☾ ダーク' };
  function getTheme(){
    try{ const t = localStorage.getItem(THEME_KEY); return (t === 'light' || t === 'dark') ? t : 'auto'; }
    catch(e){ return 'auto'; }
  }
  function applyTheme(t){
    if(t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    $('#themeBtn').textContent = THEME_LABEL[t];
    $('#themeBtn').setAttribute('aria-label', '表示の切り替え（現在: ' + THEME_LABEL[t].slice(2) + '。押すと' + THEME_LABEL[THEME_NEXT[t]].slice(2) + '）');
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => {
      const dark = (m.getAttribute('media') || '').indexOf('dark') >= 0;
      m.setAttribute('content', t === 'light' ? '#F4F7F6' : (t === 'dark' ? '#0F1514' : (dark ? '#0F1514' : '#F4F7F6')));
    });
  }
  $('#themeBtn').addEventListener('click', () => {
    const next = THEME_NEXT[getTheme()];
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){ /* 保存できなくても表示は切り替える */ }
    applyTheme(next);
  });
  applyTheme(getTheme());

  // ---------- オフライン対応（PWA） ----------
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    navigator.serviceWorker.register('medical-sw.js').catch(() => {});
  }

  load();
  render();

  // ---------- クラウド同期（cloud-sync.js） ----------
  function startCloud(){
    if(!window.CloudSync) return;
    cloud = CloudSync.init({
      appName: APP_NAME,
      key: SYNC_KEY,
      getData: function(){ return { data: state }; },
      trustEmpty: function(){ return !loadFailed; }, // 破損で空になっただけなら、空をクラウドへ送らない
      hasData: function(){ return !isEmptyState(state); },
      applyData: function(d){
        if(!d || typeof d.data !== 'object' || !d.data) throw new Error('データ形式が違います');
        const next = sanitizeState(d.data).state;
        // 先に端末へ保存する。失敗したら画面も古いままにして、次回の同期でやり直す
        try{ const s = JSON.stringify(next); localStorage.setItem(STORAGE_KEY, s); lastRaw = s; }
        catch(e){ notice('クラウドのデータを端末に保存できませんでした。'); throw e; }
        state = next;
        loadFailed = false;
        clearUndo();
        closeEdIfClean();
        render();
      }
    });
  }
  // 同期スクリプトは defer で後から読むため、読み込みが終わってから始める（CDNが遅くても、画面は先に出る）
  if(document.readyState === 'complete') startCloud(); else window.addEventListener('load', startCloud);
})();
</script>
