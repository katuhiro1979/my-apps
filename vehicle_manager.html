<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車両管理</title>
<meta name="theme-color" content="#526b4e">
<link rel="manifest" href="vehicle-manifest.json">
<link rel="icon" href="vehicle-icon-192.png">
<link rel="apple-touch-icon" href="vehicle-icon-192.png">
<style>
  :root{
    --field:#fff;
    --paper:#f6f4ec;
    --ink:#23261f;
    --ink-soft:#5a5c50;
    --rule:#cfc9b4;
    --stamp-red:#a8382b;
    --stamp-red-bg:#f4e3df;
    --sage:#526b4e;
    --sage-bg:#e6ebe0;
    --amber:#a1731f;
    --amber-bg:#f2e6cf;
    --card:#fffdf7;
    --shadow:0 1px 0 rgba(35,38,31,0.06);
  }
  /* ダークモード（端末の設定に合わせる。右上のボタンで固定も可） */
  @media screen and (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --field:#2d3027;--paper:#1c1e1a;--ink:#e8e6dc;--ink-soft:#a9aa9c;--rule:#4a4c42;
      --stamp-red:#e0796b;--stamp-red-bg:#3d2623;--sage:#8fb08a;--sage-bg:#26301f;
      --amber:#d9a94a;--amber-bg:#3a2f17;--card:#25271f;--shadow:none;color-scheme:dark;
    }
    :root:not([data-theme="light"]) .stats{background:var(--rule);border-color:var(--rule);}
  }
  :root[data-theme="dark"]{
    --field:#2d3027;--paper:#1c1e1a;--ink:#e8e6dc;--ink-soft:#a9aa9c;--rule:#4a4c42;
    --stamp-red:#e0796b;--stamp-red-bg:#3d2623;--sage:#8fb08a;--sage-bg:#26301f;
    --amber:#d9a94a;--amber-bg:#3a2f17;--card:#25271f;--shadow:none;color-scheme:dark;
  }
  :root[data-theme="dark"] .stats{background:var(--rule);border-color:var(--rule);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Iowan Old Style","Noto Serif JP",Georgia,serif;line-height:1.6;min-height:100vh;padding:0 0 60px 0;}
  .wrap{max-width:960px;margin:0 auto;padding:36px 24px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:28px;gap:16px;flex-wrap:wrap;}
  header h1{font-size:28px;letter-spacing:0.04em;margin:0;font-weight:600;}
  header .sub{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .date-today{font-size:13px;color:var(--ink-soft);}

  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--ink);border:1px solid var(--ink);margin-bottom:24px;}
  .stat{background:var(--card);padding:8px 14px;text-align:left;}
  .stat .num{font-size:20px;font-weight:600;line-height:1.3;}
  .stat .label{font-size:11px;color:var(--ink-soft);}
  .stat.overdue .num{color:var(--stamp-red);}
  .stat.soon .num{color:var(--amber);}

  .panel{background:var(--card);border:1px solid var(--rule);box-shadow:var(--shadow);margin-bottom:24px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule);gap:10px;flex-wrap:wrap;}
  .panel-head h2{font-size:16px;margin:0;}
  .panel-body{padding:18px;}
  details.add > summary{cursor:pointer;padding:14px 18px;font-size:16px;font-weight:600;list-style:none;}
  details.add > summary::-webkit-details-marker{display:none;}
  details.add > summary::before{content:"＋ ";}
  details.add[open] > summary{border-bottom:1px solid var(--rule);}

  button{font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 16px;font-size:13px;border-radius:2px;}
  button.ghost{background:transparent;color:var(--ink);}
  button.small{padding:5px 11px;font-size:12px;}
  button.danger{color:var(--stamp-red);border-color:var(--stamp-red);}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--stamp-red);outline-offset:1px;}
  input,select,textarea{font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;font-size:14px;padding:9px 10px;border:1px solid var(--rule);background:var(--field);color:var(--ink);border-radius:2px;width:100%;}
  label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-soft);font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;}
  .form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px;}
  .form-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .img-pick{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;color:var(--ink-soft);font-family:-apple-system,sans-serif;}
  .img-pick img{width:64px;height:64px;object-fit:cover;border:1px solid var(--rule);}

  .vehicle{padding:16px 18px;border-top:1px solid var(--rule);}
  .vehicle:first-child{border-top:none;}
  .v-top{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start;}
  .thumb{width:120px;height:120px;object-fit:cover;border:1px solid var(--rule);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--rule);}
  .v-name{font-size:18px;font-weight:600;}
  .v-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .badge{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:20px;margin-right:6px;font-family:-apple-system,sans-serif;}
  .badge.ok{background:var(--sage-bg);color:var(--sage);}
  .badge.soon{background:var(--amber-bg);color:var(--amber);}
  .badge.overdue{background:var(--stamp-red-bg);color:var(--stamp-red);}
  .badge.none{background:var(--paper);color:var(--ink-soft);border:1px solid var(--rule);}
  .v-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

  .dl-list{list-style:none;margin:14px 0 0;padding:0;border-top:1px dashed var(--rule);}
  .dl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px dashed var(--rule);font-size:14px;}
  .dl .t{font-weight:600;min-width:6.5em;}
  .dl .d{color:var(--ink-soft);font-size:13px;}
  .dl .sp{flex:1;}
  .dl-hist{font-size:11.5px;color:var(--ink-soft);padding:0 0 6px 6.5em;font-family:-apple-system,sans-serif;}
  .dl-form{display:grid;grid-template-columns:1fr 1fr 1.4fr auto auto;gap:8px;margin-top:10px;align-items:end;}
  .m-box{margin-top:18px;border:1px solid var(--rule);background:var(--field);padding:12px 14px;}
  .m-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:16px;font-weight:600;}
  .m-toggle{background:transparent;color:var(--ink);border:none;padding:4px 2px;font-size:16px;font-weight:600;font-family:inherit;text-align:left;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .m-toggle .arrow{font-size:11px;color:var(--ink-soft);}
  .m-brief{font-size:12.5px;font-weight:400;color:var(--ink-soft);font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;margin-left:6px;}
  .m-sum{display:flex;gap:6px 22px;flex-wrap:wrap;margin-top:10px;padding:8px 10px;background:var(--paper);font-size:13px;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;}
  .m-sum b{display:block;font-size:11px;font-weight:400;color:var(--ink-soft);}
  .m-next{margin-top:10px;padding:8px 10px;background:var(--amber-bg);font-size:13px;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;}
  .m-next b{display:block;font-size:11px;font-weight:600;color:var(--amber);}
  .m-list{list-style:none;margin:10px 0 0;padding:0;}
  .m-year{display:flex;justify-content:space-between;padding:6px 0 4px;margin-top:6px;border-bottom:2px solid var(--ink);font-size:13px;font-weight:600;}
  .m-year:first-child{margin-top:0;}
  .m-item{display:grid;grid-template-columns:3.2em 1fr auto;gap:8px;align-items:start;padding:9px 0;border-bottom:1px dashed var(--rule);font-size:15px;}
  .m-date{font-size:14px;color:var(--ink-soft);font-family:-apple-system,sans-serif;padding-top:2px;}
  .m-row{display:flex;gap:10px;align-items:baseline;justify-content:space-between;}
  .m-row .t{font-weight:600;}
  .m-row .c{font-family:-apple-system,sans-serif;font-size:14px;white-space:nowrap;}
  .m-sub{font-size:12.5px;color:var(--ink-soft);font-family:-apple-system,sans-serif;margin-top:2px;}
  .m-note{white-space:pre-wrap;word-break:break-word;}
  .m-btns{display:flex;gap:6px;}
  .m-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px;align-items:end;}
  .m-form .w2{grid-column:span 2;}
  .m-form .w4{grid-column:1 / -1;}
  .empty{padding:28px 18px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .io-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;}
  .io-row input[type=file]{width:auto;}

  .v-vin{display:none;}
  /* 印刷（車ごとの「整備履歴を印刷」ボタンで、その車だけを白黒向けに出力） */
  @media print{
    :root,:root[data-theme]{--field:#fff;--paper:#fff;--ink:#000;--ink-soft:#444;--rule:#999;--card:#fff;--sage:#222;--sage-bg:#fff;--amber:#222;--amber-bg:#fff;--stamp-red:#222;--stamp-red-bg:#fff;--shadow:none;color-scheme:light;}
    .no-print,.stats,details.add,.v-actions,.dl-form,.m-btns,.m-head [data-act="madd"],.m-toggle .arrow,.m-form,.m-box > button,#cs-btn,#cs-panel{display:none !important;}
    body{background:#fff;}
    .wrap{padding:0;max-width:none;}
    .panel{border:none;margin:0;}
    .v-vin{display:block;}
    body.printing .vehicle:not(.print-target),body.printing .dl-list,body.printing .panel-head{display:none;}
    .vehicle{padding:0;}
    .m-item,.m-year{break-inside:avoid;}
    .m-next{border:1px solid #999;}
  }
  @media (max-width:640px){
    .wrap{padding:20px 14px;}
    header h1{font-size:23px;}
    .form-grid{grid-template-columns:1fr;}
    .v-top{grid-template-columns:96px 1fr;gap:12px;}
    .thumb{width:96px;height:96px;}
    .m-box{padding:10px;}
    .m-btns{flex-direction:column;}
    .m-form{grid-template-columns:1fr 1fr;}
    .m-form .w2,.m-form .w4{grid-column:1 / -1;}
    .dl-form{grid-template-columns:1fr 1fr;}
    .dl-form .wide{grid-column:1 / -1;}
    .dl-hist{padding-left:0;}
    .stat{padding:6px 8px;}
    .stat .label{font-size:10px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>車両管理</h1>
      <div class="sub">車検・保険・税の期限をまとめて確認</div>
    </div>
    <div style="text-align:right">
      <div class="date-today" id="today"></div>
      <button type="button" class="ghost small no-print" id="btnTheme" style="margin-top:6px"></button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="stCount">0</div><div class="label">登録台数</div></div>
    <div class="stat soon"><div class="num" id="stSoon">0</div><div class="label">まもなく期限（30日以内）</div></div>
    <div class="stat overdue"><div class="num" id="stOver">0</div><div class="label">期限切れ</div></div>
  </div>

  <div class="panel">
    <details class="add" id="addPanel">
      <summary id="formTitle">車を登録する</summary>
      <div class="panel-body">
        <div class="img-pick">
          <img id="imgPrev" alt="" style="display:none">
          <input type="file" id="fImage" accept="image/*" style="width:auto">
          <button type="button" class="ghost small" id="btnImgClear" style="display:none">写真を外す</button>
        </div>
        <div class="form-grid">
          <label class="f">愛称（必須）<input id="fName" maxlength="30" placeholder="例：家族のミニバン"></label>
          <label class="f">メーカー<input id="fMaker" maxlength="30" placeholder="例：トヨタ"></label>
          <label class="f">車種<input id="fModel" maxlength="30" placeholder="例：シエンタ"></label>
          <label class="f">年式<input id="fYear" maxlength="10" placeholder="例：2020"></label>
          <label class="f">ナンバー<input id="fPlate" maxlength="30" placeholder="例：品川 300 あ 12-34"></label>
          <label class="f">状態
            <select id="fStatus"><option>使用中</option><option>保管中</option><option>売却済み</option></select>
          </label>
          <label class="f">現在の走行距離（km）<input id="fOdo" type="number" min="0" inputmode="numeric"></label>
          <label class="f">色<input id="fColor" maxlength="20"></label>
          <label class="f">車台番号<input id="fVin" maxlength="40"></label>
        </div>
        <div class="form-actions">
          <button type="button" id="btnSave">登録する</button>
          <button type="button" class="ghost" id="btnCancel" style="display:none">編集をやめる</button>
        </div>
      </div>
    </details>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>車両一覧</h2></div>
    <div id="list"></div>
  </div>

  <div class="panel no-print">
    <div class="panel-head"><h2>バックアップ</h2></div>
    <div class="panel-body">
      <div class="io-row">
        <button type="button" class="ghost small" id="btnExport">書き出す（JSON）</button>
        <label>読み込む：<input type="file" id="fImport" accept="application/json"></label>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud-sync.js"></script>
<script>
(function(){
  var KEY='vehicle-manager-data';
  var TYPES=['車検','自賠責保険','任意保険','自動車税','免許更新','その他'];
  var data=load();
  var cloud=null;    // 同期モジュール（cloud-sync.js）
  var editId=null;   // 編集中の車両ID
  var imgData='';    // フォーム上の写真
  var openForm={};   // 期限追加フォームを開いている車両ID
  var openM={};      // 整備フォーム（true=追加 / 記録ID=編集）
  var showAllM={};   // 整備記録を全件表示している車両ID
  // 整備記録の折りたたみ状態（この端末の表示設定のみ。同期しない）
  var COLL_KEY='vehicle-manager-collapsed';
  var collM=(function(){try{return JSON.parse(localStorage.getItem(COLL_KEY))||{};}catch(e){return {};}})();
  function saveColl(){try{localStorage.setItem(COLL_KEY,JSON.stringify(collM));}catch(e){}}
  var M_SHOW=6;    // 通常表示する整備記録の件数

  function load(){
    try{
      var d=JSON.parse(localStorage.getItem(KEY));
      if(d&&Array.isArray(d.vehicles))return d;
    }catch(e){}
    return {vehicles:[]};
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(data));if(cloud)cloud.notifyChanged();}
    catch(e){alert('保存できませんでした（容量が足りない可能性があります）');}
  }
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function $(id){return document.getElementById(id);}

  // 日付（時刻を除いた日数差）
  function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function daysLeft(due){
    var a=new Date(due+'T00:00:00'),b=new Date(ymd(new Date())+'T00:00:00');
    return Math.round((a-b)/86400000);
  }
  function level(n){return n<0?'overdue':(n<=30?'soon':'ok');}
  function leftText(n){
    if(n<0)return Math.abs(n)+'日超過';
    if(n===0)return '今日まで';
    return 'あと'+n+'日';
  }

  // 写真を縮小してJPEGにする
  function shrink(file,cb){
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var max=600,s=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas');
        c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        cb(c.toDataURL('image/jpeg',0.8));
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  }

  function showImg(){
    $('imgPrev').style.display=imgData?'block':'none';
    $('imgPrev').src=imgData||'';
    $('btnImgClear').style.display=imgData?'inline-block':'none';
  }
  $('fImage').onchange=function(){
    var f=this.files[0];if(!f)return;
    shrink(f,function(u){imgData=u;showImg();});
  };
  $('btnImgClear').onclick=function(){imgData='';$('fImage').value='';showImg();};

  var FIELDS=[['fName','name'],['fMaker','maker'],['fModel','model'],['fYear','year'],['fPlate','plate'],['fStatus','status'],['fOdo','odometer'],['fColor','color'],['fVin','vin']];

  function resetForm(){
    editId=null;imgData='';
    FIELDS.forEach(function(p){$(p[0]).value=(p[0]==='fStatus')?'使用中':'';});
    $('fImage').value='';showImg();
    $('formTitle').textContent='車を登録する';
    $('btnSave').textContent='登録する';
    $('btnCancel').style.display='none';
  }
  $('btnCancel').onclick=function(){resetForm();$('addPanel').open=false;};

  $('btnSave').onclick=function(){
    var name=$('fName').value.trim();
    if(!name){alert('愛称を入力してください');$('fName').focus();return;}
    var v=editId?find(editId):null;
    if(!v){
      if(data.vehicles.length>=20&&!confirm('20台を超えます。登録しますか？'))return;
      v={id:uid(),deadlines:[]};data.vehicles.push(v);
    }
    FIELDS.forEach(function(p){v[p[1]]=$(p[0]).value.trim();});
    v.image=imgData;
    save();resetForm();$('addPanel').open=false;render();
  };

  function find(id){
    for(var i=0;i<data.vehicles.length;i++)if(data.vehicles[i].id===id)return data.vehicles[i];
    return null;
  }

  function startEdit(id){
    var v=find(id);if(!v)return;
    editId=id;imgData=v.image||'';
    FIELDS.forEach(function(p){$(p[0]).value=v[p[1]]||'';});
    showImg();
    $('formTitle').textContent='車を編集する';
    $('btnSave').textContent='保存する';
    $('btnCancel').style.display='inline-block';
    $('addPanel').open=true;
    $('addPanel').scrollIntoView({behavior:'smooth',block:'start'});
  }

  function nearest(v){
    var best=null;
    (v.deadlines||[]).forEach(function(d){
      var n=daysLeft(d.dueDate);
      if(best===null||n<best.n)best={n:n,d:d};
    });
    return best;
  }

  function render(){
    $('today').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
    var soon=0,over=0;
    data.vehicles.forEach(function(v){
      (v.deadlines||[]).forEach(function(d){
        var l=level(daysLeft(d.dueDate));
        if(l==='soon')soon++;else if(l==='overdue')over++;
      });
    });
    $('stCount').textContent=data.vehicles.length;
    $('stSoon').textContent=soon;
    $('stOver').textContent=over;

    if(!data.vehicles.length){
      $('list').innerHTML='<div class="empty">まだ車が登録されていません。上の「車を登録する」から追加してください。</div>';
      return;
    }
    $('list').innerHTML=data.vehicles.map(vehicleHtml).join('');
  }

  function vehicleHtml(v){
    var nr=nearest(v),badge;
    if(nr){
      var l=level(nr.n);
      badge='<span class="badge '+l+'">'+esc(nr.d.type==='その他'&&nr.d.note?nr.d.note:nr.d.type)+'：'+leftText(nr.n)+'</span>';
    }else badge='<span class="badge none">期限の登録なし</span>';
    var meta=[v.maker,v.model,v.year?v.year+'年式':'',v.color].filter(Boolean).join(' / ');
    var meta2=[v.plate,v.odometer?Number(v.odometer).toLocaleString()+' km':'',v.status].filter(Boolean).join(' ・ ');
    var thumb=v.image?'<img class="thumb" src="'+v.image+'" alt="">':'<div class="thumb">🚗</div>';
    var dls=(v.deadlines||[]).slice().sort(function(a,b){return a.dueDate<b.dueDate?-1:1;});
    var dlHtml=dls.map(function(d){
      var n=daysLeft(d.dueDate),l=level(n);
      var label=esc(d.type)+(d.type==='その他'?'':(d.note?'':''));
      var hist=(d.history&&d.history.length)?'<div class="dl-hist">更新履歴：'+d.history.slice(-3).reverse().map(function(h){return esc(h.due)+'分（'+esc(h.doneAt)+'に更新）';}).join('、')+'</div>':'';
      return '<li><div class="dl"><span class="t">'+label+'</span><span class="d">'+esc(d.dueDate)+(d.type!=='その他'&&d.note?'　'+esc(d.note):'')+(d.type==='その他'&&d.note?'　'+esc(d.note):'')+'</span>'
        +'<span class="badge '+l+'">'+leftText(n)+'</span><span class="sp"></span>'
        +'<button class="small" data-act="renew" data-v="'+v.id+'" data-d="'+d.id+'">更新する</button>'
        +'<button class="ghost small" data-act="dedit" data-v="'+v.id+'" data-d="'+d.id+'">編集</button>'
        +'<button class="ghost small danger" data-act="ddel" data-v="'+v.id+'" data-d="'+d.id+'">削除</button></div>'+hist+'</li>';
    }).join('');
    var form='';
    if(openForm[v.id]){
      var od=openForm[v.id]===true?null:findDl(v,openForm[v.id]);
      var opts=TYPES.map(function(t){return '<option'+(od&&od.type===t?' selected':'')+'>'+t+'</option>';}).join('');
      form='<div class="dl-form" data-form="'+v.id+'">'
        +'<label class="f">種類<select class="dType">'+opts+'</select></label>'
        +'<label class="f">期限日<input type="date" class="dDue" value="'+(od?esc(od.dueDate):'')+'"></label>'
        +'<label class="f wide">メモ（保険会社・補足など）<input class="dNote" maxlength="40" value="'+(od?esc(od.note||''):'')+'"></label>'
        +'<button class="small" data-act="dsave" data-v="'+v.id+'">'+(od?'保存':'追加')+'</button>'
        +'<button class="ghost small" data-act="dcancel" data-v="'+v.id+'">やめる</button></div>';
    }
    var mhtml=maintHtml(v);
    return '<div class="vehicle" data-vid="'+v.id+'"><div class="v-top">'+thumb+'<div>'
      +'<div class="v-name">'+esc(v.name)+'</div>'
      +(meta?'<div class="v-meta">'+esc(meta)+'</div>':'')
      +(meta2?'<div class="v-meta">'+esc(meta2)+'</div>':'')
      +(v.vin?'<div class="v-meta v-vin">車台番号：'+esc(v.vin)+'</div>':'')
      +'<div style="margin-top:6px">'+badge+'</div>'
      +'<div class="v-actions"><button class="small" data-act="dadd" data-v="'+v.id+'">期限を追加</button>'
      +'<button class="ghost small" data-act="vedit" data-v="'+v.id+'">編集</button>'
      +'<button class="ghost small" data-act="vprint" data-v="'+v.id+'">整備履歴を印刷</button>'
      +'<button class="ghost small danger" data-act="vdel" data-v="'+v.id+'">削除</button></div>'
      +'</div></div>'
      +(dlHtml?'<ul class="dl-list">'+dlHtml+'</ul>':'')
      +form+mhtml+'</div>';
  }

  // 整備記録（新しい順）
  function maintHtml(v){
    var all=(v.maintenance||[]).slice().sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:0);});
    var total=all.reduce(function(s,m){return s+(Number(m.cost)||0);},0);
    var rows=showAllM[v.id]?all:all.slice(0,M_SHOW);
    // 年ごとの費用合計
    var yearCost={};
    all.forEach(function(m){var y=m.date.slice(0,4);yearCost[y]=(yearCost[y]||0)+(Number(m.cost)||0);});
    // 同じ内容の整備が後で行われていれば、その「次回の目安」は実施済みとみなす
    var done=function(m){return all.some(function(o){return o.title===m.title&&o.date>m.date;});};
    var upcoming=all.filter(function(m){return m.nextDate&&!done(m);}).sort(function(a,b){return a.nextDate<b.nextDate?-1:1;});
    var folded=!!collM[v.id];
    var head='<div class="m-head"><button type="button" class="m-toggle" data-act="mtoggle" data-v="'+v.id+'" aria-expanded="'+(!folded)+'">'
      +'<span class="arrow">'+(folded?'▶':'▼')+'</span> 🔧 整備記録'
      +(all.length?'<span class="m-brief">'+all.length+'件・'+total.toLocaleString()+'円</span>':'')+'</button>'
      +'<button class="small" data-act="madd" data-v="'+v.id+'">＋ 整備を記録</button></div>';
    var h='';
    if(all.length){
      h+='<div class="m-sum"><div><b>記録</b>'+all.length+'件</div><div><b>費用の合計</b>'+total.toLocaleString()+'円</div>'
        +'<div><b>最後の整備</b>'+esc(all[0].date)+'（'+esc(all[0].title)+'）</div></div>';
    }
    if(upcoming.length){
      h+='<div class="m-next"><b>次の整備予定</b>'+upcoming.slice(0,3).map(function(m){
        var n=daysLeft(m.nextDate);
        return '<div>'+esc(m.title)+'　'+esc(m.nextDate)+' <span class="badge '+level(n)+'">'+leftText(n)+'</span>'
          +(m.nextOdometer?'　'+Number(m.nextOdometer).toLocaleString()+' km ごろ':'')+'</div>';
      }).join('')+'</div>';
    }
    if(!all.length&&!openM[v.id])h+='<div class="m-sub" style="margin-top:8px">まだ整備の記録がありません。「整備を記録」から追加してください。</div>';
    var lastY='';
    h+='<ul class="m-list">'+rows.map(function(m){
      var y=m.date.slice(0,4),yh='';
      if(y!==lastY){lastY=y;yh='<li class="m-year"><span>'+esc(y)+'年</span><span>'+yearCost[y].toLocaleString()+'円</span></li>';}
      var nx=[];
      if(m.nextDate&&!done(m)){var n=daysLeft(m.nextDate);nx.push('次回 '+esc(m.nextDate)+' <span class="badge '+level(n)+'">'+leftText(n)+'</span>');}
      if(m.nextOdometer&&!done(m))nx.push('次回 '+Number(m.nextOdometer).toLocaleString()+' km');
      var sub=(m.odometer?'<div class="m-sub">'+Number(m.odometer).toLocaleString()+' km</div>':'')
        +(m.shop?'<div class="m-sub">'+esc(m.shop)+'</div>':'')
        +(m.note?'<div class="m-sub m-note">'+esc(m.note)+'</div>':'');
      return yh+'<li class="m-item"><div class="m-date">'+Number(m.date.slice(5,7))+'/'+Number(m.date.slice(8,10))+'</div>'
        +'<div class="m-main"><div class="m-row"><span class="t">'+esc(m.title)+'</span>'
        +(m.cost?'<span class="c">'+Number(m.cost).toLocaleString()+'円</span>':'')+'</div>'
        +sub
        +(nx.length?'<div class="m-sub">'+nx.join('　')+'</div>':'')
        +'</div><div class="m-btns"><button class="ghost small" data-act="medit" data-v="'+v.id+'" data-m="'+m.id+'">編集</button>'
        +'<button class="ghost small danger" data-act="mdel" data-v="'+v.id+'" data-m="'+m.id+'">削除</button></div></li>';
    }).join('')+'</ul>';
    if(all.length>M_SHOW)h+='<button class="ghost small" style="margin-top:8px" data-act="mmore" data-v="'+v.id+'">'+(showAllM[v.id]?'新しい'+M_SHOW+'件だけ表示':'すべて表示（'+all.length+'件）')+'</button>';
    if(openM[v.id]){
      var om=openM[v.id]===true?null:findM(v,openM[v.id]);
      var g=function(k){return om&&om[k]!=null?esc(om[k]):'';};
      h+='<div class="m-form" data-mform="'+v.id+'">'
        +'<label class="f">日付<input type="date" class="mDate" value="'+(om?g('date'):ymd(new Date()))+'"></label>'
        +'<label class="f">走行距離（km）<input type="number" min="0" inputmode="numeric" class="mOdo" value="'+(om?g('odometer'):esc(v.odometer||''))+'"></label>'
        +'<label class="f w2">内容（必須）<input class="mTitle" maxlength="40" list="mTitles" placeholder="例：オイル交換" value="'+g('title')+'"></label>'
        +'<label class="f">費用（円）<input type="number" min="0" inputmode="numeric" class="mCost" value="'+g('cost')+'"></label>'
        +'<label class="f w2">店名<input class="mShop" maxlength="40" value="'+g('shop')+'"></label>'
        +'<label class="f">次回の目安（日付）<input type="date" class="mNextD" value="'+g('nextDate')+'"></label>'
        +'<label class="f">次回の目安（km）<input type="number" min="0" inputmode="numeric" class="mNextO" value="'+g('nextOdometer')+'"></label>'
        +'<label class="f w4">メモ（改行できます）<textarea class="mNote" rows="3" maxlength="500">'+g('note')+'</textarea></label>'
        +'<button class="small" data-act="msave" data-v="'+v.id+'">'+(om?'保存':'記録する')+'</button>'
        +'<button class="ghost small" data-act="mcancel" data-v="'+v.id+'">やめる</button></div>'
        +'<datalist id="mTitles"><option>オイル交換</option><option>オイルエレメント交換</option><option>タイヤ交換</option><option>バッテリー交換</option><option>ブレーキパッド交換</option><option>ワイパー交換</option><option>エアコンフィルター交換</option><option>12ヶ月点検</option><option>車検整備</option></datalist>';
    }
    return '<div class="m-box">'+head+(folded?'':h)+'</div>';
  }
  function findM(v,id){
    var a=v.maintenance||[];
    for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];
    return null;
  }

  function findDl(v,id){
    var a=v.deadlines||[];
    for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];
    return null;
  }

  $('list').onclick=function(e){
    var b=e.target.closest('button[data-act]');if(!b)return;
    var act=b.dataset.act,v=find(b.dataset.v);if(!v)return;
    var d=b.dataset.d?findDl(v,b.dataset.d):null;
    if(act==='vedit'){startEdit(v.id);return;}
    if(act==='vprint'){
      // 整備記録を全件表示にして、この車だけを印刷する
      showAllM[v.id]=true;collM[v.id]=false;render();
      document.body.classList.add('printing');
      document.querySelector('[data-vid="'+v.id+'"]').classList.add('print-target');
      window.print();
      return;
    }
    if(act==='vdel'){
      if(confirm('「'+v.name+'」を削除しますか？期限の記録も消えます。')){
        data.vehicles=data.vehicles.filter(function(x){return x.id!==v.id;});
        save();render();
      }
      return;
    }
    if(act==='mtoggle'){collM[v.id]=!collM[v.id];saveColl();render();return;}
    if(act==='madd'){openM[v.id]=true;if(collM[v.id]){collM[v.id]=false;saveColl();}render();return;}
    if(act==='medit'){openM[v.id]=b.dataset.m;render();return;}
    if(act==='mcancel'){delete openM[v.id];render();return;}
    if(act==='mmore'){showAllM[v.id]=!showAllM[v.id];render();return;}
    if(act==='mdel'){
      var dm=findM(v,b.dataset.m);
      if(dm&&confirm('「'+dm.title+'」（'+dm.date+'）の整備記録を削除しますか？')){
        v.maintenance=v.maintenance.filter(function(x){return x.id!==dm.id;});
        save();render();
      }
      return;
    }
    if(act==='msave'){
      var mf=document.querySelector('[data-mform="'+v.id+'"]');
      var rec={
        date:mf.querySelector('.mDate').value,
        odometer:mf.querySelector('.mOdo').value,
        title:mf.querySelector('.mTitle').value.trim(),
        cost:mf.querySelector('.mCost').value,
        shop:mf.querySelector('.mShop').value.trim(),
        nextDate:mf.querySelector('.mNextD').value,
        nextOdometer:mf.querySelector('.mNextO').value,
        note:mf.querySelector('.mNote').value.trim()
      };
      if(!rec.date){alert('日付を入力してください');return;}
      if(!rec.title){alert('内容を入力してください');mf.querySelector('.mTitle').focus();return;}
      var cm=openM[v.id]===true?null:findM(v,openM[v.id]);
      if(cm){for(var k in rec)cm[k]=rec[k];}
      else{rec.id=uid();(v.maintenance=v.maintenance||[]).push(rec);}
      // 走行距離が現在値より大きければ車の走行距離を更新
      if(rec.odometer&&Number(rec.odometer)>(Number(v.odometer)||0))v.odometer=rec.odometer;
      delete openM[v.id];save();render();return;
    }
    if(act==='dadd'){openForm[v.id]=true;render();return;}
    if(act==='dedit'&&d){openForm[v.id]=d.id;render();return;}
    if(act==='dcancel'){delete openForm[v.id];render();return;}
    if(act==='dsave'){
      var f=document.querySelector('[data-form="'+v.id+'"]');
      var type=f.querySelector('.dType').value,due=f.querySelector('.dDue').value,note=f.querySelector('.dNote').value.trim();
      if(!due){alert('期限日を入力してください');return;}
      var cur=openForm[v.id]===true?null:findDl(v,openForm[v.id]);
      if(cur){cur.type=type;cur.dueDate=due;cur.note=note;}
      else{(v.deadlines=v.deadlines||[]).push({id:uid(),type:type,dueDate:due,note:note,history:[]});}
      delete openForm[v.id];save();render();return;
    }
    if(act==='ddel'&&d){
      if(confirm(d.type+'の期限を削除しますか？')){
        v.deadlines=v.deadlines.filter(function(x){return x.id!==d.id;});
        save();render();
      }
      return;
    }
    if(act==='renew'&&d){
      var nd=prompt(d.type+'を更新します。次の期限日を入力してください（例：2028-10-31）',d.dueDate);
      if(nd===null)return;
      nd=nd.trim();
      if(!/^\d{4}-\d{2}-\d{2}$/.test(nd)||isNaN(new Date(nd+'T00:00:00'))){alert('「2028-10-31」の形式で入力してください');return;}
      (d.history=d.history||[]).push({due:d.dueDate,doneAt:ymd(new Date())});
      d.dueDate=nd;save();render();
    }
  };

  // バックアップ
  $('btnExport').onclick=function(){
    var blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='vehicle-manager-'+ymd(new Date())+'.json';
    a.click();URL.revokeObjectURL(a.href);
  };
  $('fImport').onchange=function(){
    var f=this.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.vehicles))throw new Error();
        if(!confirm('現在のデータを、読み込んだ内容（'+d.vehicles.length+'台）で置き換えますか？'))return;
        data=d;save();render();
      }catch(e){alert('読み込めませんでした。書き出したJSONファイルを選んでください。');}
      $('fImport').value='';
    };
    r.readAsText(f);
  };

  // 印刷が終わったら通常表示に戻す
  window.addEventListener('afterprint',function(){
    document.body.classList.remove('printing');
    var t=document.querySelector('.print-target');if(t)t.classList.remove('print-target');
  });

  // ダークモード切り替え（自動 → ダーク → ライト）
  var THEME_KEY='vehicle-manager-theme';
  var THEME_LABEL={auto:'表示：自動',dark:'表示：ダーク',light:'表示：ライト'};
  function getTheme(){try{return localStorage.getItem(THEME_KEY)||'auto';}catch(e){return 'auto';}}
  function applyTheme(t){
    if(t==='auto')document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme',t);
    $('btnTheme').textContent=THEME_LABEL[t];
  }
  $('btnTheme').onclick=function(){
    var n={auto:'dark',dark:'light',light:'auto'}[getTheme()];
    try{localStorage.setItem(THEME_KEY,n);}catch(e){}
    applyTheme(n);
  };
  applyTheme(getTheme());

  render();

  // クラウド同期（cloud-sync.js）。端末内が主で、ログイン中のみクラウドと合わせる
  if(window.CloudSync){
    cloud=CloudSync.init({
      appName:'車両管理',
      key:'data-v1',
      getData:function(){return {vehicles:data.vehicles};},
      hasData:function(){return data.vehicles.length>0;},
      applyData:function(d){
        if(!d||!Array.isArray(d.vehicles))throw new Error('車両管理のデータ形式が違います');
        data={vehicles:d.vehicles};
        try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
        editId=null;openForm={};openM={};
        render();
      }
    });
  }

  // PWA：ホーム画面に追加・オフライン表示
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('vehicle-sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
