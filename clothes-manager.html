<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>衣服管理</title>
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="衣服管理">
<link rel="manifest" href="clothes-manifest.json">
<link rel="icon" href="clothes-icon-192.png">
<link rel="apple-touch-icon" href="clothes-icon-192.png">
<script>
  /* 保存済みの表示設定を、画面が描かれる前に反映（ちらつき防止） */
  try{ var t=localStorage.getItem('clothes-manager-theme'); if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t); }catch(e){}
</script>
<style>
  /* ===== デザイントークン（ライト／ダーク。ダークは端末の設定に自動で従う） ===== */
  :root{
    color-scheme:light dark;
    --bg:#F4F5F7; --paper:#FFFFFF; --surface-2:#EEF0F4;
    --ink:#1B2333; --ink-soft:#505A6E; --line:#D7DBE3;
    --accent:#1B2333; --on-accent:#FFFFFF;
    --ok:#1F7A52; --ok-bg:#E4F1EA;
    --warn:#9A5B0C; --warn-bg:#FBEBD6;
    --danger:#B3281C; --danger-bg:#F8E2DE;
    --overlay:rgba(27,35,51,.45);
    --shadow-lg:0 8px 28px rgba(27,35,51,.22);
    --radius:14px; --r-s:8px; --r-m:12px;
    --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo UI",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0E1116; --paper:#171B22; --surface-2:#1F242C;
      --ink:#E8ECF2; --ink-soft:#A3ADBD; --line:#2D3440;
      --accent:#E8ECF2; --on-accent:#0E1116;
      --ok:#4CC38A; --ok-bg:#12301F;
      --warn:#F0A742; --warn-bg:#3A2A0C;
      --danger:#FF8176; --danger-bg:#3D1A17;
      --overlay:rgba(0,0,0,.6);
      --shadow-lg:0 8px 28px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="light"]{ color-scheme:light; }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#0E1116; --paper:#171B22; --surface-2:#1F242C;
    --ink:#E8ECF2; --ink-soft:#A3ADBD; --line:#2D3440;
    --accent:#E8ECF2; --on-accent:#0E1116;
    --ok:#4CC38A; --ok-bg:#12301F;
    --warn:#F0A742; --warn-bg:#3A2A0C;
    --danger:#FF8176; --danger-bg:#3D1A17;
    --overlay:rgba(0,0,0,.6);
    --shadow-lg:0 8px 28px rgba(0,0,0,.6);
  }

  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); line-height:1.6;
        padding:env(safe-area-inset-top) 16px calc(150px + env(safe-area-inset-bottom)); }
  main{ max-width:640px; margin:0 auto; }
  header{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:16px 0 10px; }
  h1{ font-size:1.25rem; margin:0; }
  button, input, select, textarea{ font:inherit; color:inherit; }
  button{ min-height:44px; padding:0 14px; border:1px solid var(--line); border-radius:10px; background:var(--paper); cursor:pointer; }
  button.primary{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  button.danger{ color:var(--danger); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .tab:focus-visible, .card:focus-visible{ outline:3px solid #3B82F6; outline-offset:2px; }
  .icon-btn{ width:44px; padding:0; font-size:18px; }

  /* 集計 */
  .sum{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin-bottom:12px; }
  .sum div{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r-m); padding:8px 12px; }
  .sum span{ display:block; font-size:.75rem; color:var(--ink-soft); }
  .sum strong{ font-size:1.15rem; font-weight:600; }

  /* 不足の帯 */
  .short{ background:var(--warn-bg); color:var(--warn); border-radius:var(--r-m); padding:10px 12px; margin-bottom:12px; }
  .short p{ margin:0 0 6px; font-size:.85rem; font-weight:600; }
  .short .chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .chip{ min-height:32px; padding:0 12px; font-size:.8rem; border-radius:999px; background:var(--paper); color:var(--warn); border:1px solid var(--warn); }

  /* タブ・検索 */
  .tabs{ display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:10px; overflow-x:auto; }
  .tab{ min-height:44px; padding:0 14px; border:0; border-bottom:3px solid transparent; border-radius:0; background:none; color:var(--ink-soft); white-space:nowrap; }
  .tab[aria-selected="true"]{ color:var(--ink); font-weight:600; border-bottom-color:var(--ink); }
  .tools{ display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .tools input[type=search]{ flex:1 1 160px; min-height:44px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:var(--paper); }
  .tools select{ min-height:44px; padding:0 10px; border:1px solid var(--line); border-radius:10px; background:var(--paper); }
  .filterbar{ display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:.85rem; color:var(--ink-soft); }

  /* 一覧 */
  .gh{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin:16px 4px 6px; font-size:.9rem; }
  .gh b{ font-weight:600; }
  .gh .ok{ color:var(--ok); font-size:.8rem; }
  .gh .ng{ color:var(--warn); font-size:.8rem; font-weight:600; }
  .card{ display:flex; align-items:center; gap:12px; padding:10px 12px; margin-bottom:8px; background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); cursor:pointer; }
  .card.gone{ opacity:.55; }
  .dot{ width:10px; align-self:stretch; min-height:36px; border-radius:3px; flex:none; background:#888780; }
  .card .body{ flex:1; min-width:0; }
  .card .t{ font-size:.95rem; word-break:break-word; }
  .card .s{ font-size:.78rem; color:var(--ink-soft); word-break:break-word; }
  .card .qty{ text-align:right; flex:none; font-size:.75rem; color:var(--ink-soft); }
  .card .qty b{ display:block; font-size:1.05rem; font-weight:600; color:var(--ink); }
  .badge{ display:inline-block; font-size:.7rem; padding:0 8px; border-radius:999px; background:var(--warn-bg); color:var(--warn); margin-right:6px; }
  .buy{ min-height:36px; margin-top:6px; font-size:.8rem; }
  .empty{ color:var(--ink-soft); text-align:center; padding:36px 8px; }

  .fab{ position:fixed; right:calc(12px + env(safe-area-inset-right)); bottom:calc(68px + env(safe-area-inset-bottom)); /* 右下端は同期の☁ボタン。その上に置く */ width:56px; height:56px; border-radius:50%; font-size:28px; padding:0; box-shadow:var(--shadow-lg); z-index:20; }

  /* メニュー・トースト */
  .menu{ position:absolute; right:0; top:100%; min-width:200px; background:var(--paper); border:1px solid var(--line); border-radius:var(--r-m); box-shadow:var(--shadow-lg); padding:4px; z-index:30; display:none; }
  .menu.show{ display:block; }
  .menu button{ display:block; width:100%; text-align:left; border:0; background:none; border-radius:8px; }
  .menu button:hover{ background:var(--surface-2); }
  .menu .sep{ border-top:1px solid var(--line); margin:4px 0; }
  .toast{ position:fixed; left:50%; bottom:calc(136px + env(safe-area-inset-bottom)); transform:translateX(-50%); display:none; align-items:center; gap:12px; padding:10px 14px; background:var(--ink); color:var(--bg); border-radius:12px; box-shadow:var(--shadow-lg); z-index:50; max-width:calc(100vw - 32px); }
  .toast.show{ display:flex; }
  .toast button{ min-height:36px; background:transparent; color:inherit; border-color:currentColor; }

  /* ダイアログ（入力・目標数） */
  dialog{ width:min(520px, calc(100vw - 24px)); max-height:calc(100dvh - 24px); padding:0; border:1px solid var(--line); border-radius:16px; background:var(--paper); color:var(--ink); box-shadow:var(--shadow-lg); }
  dialog::backdrop{ background:var(--overlay); }
  dialog form{ display:flex; flex-direction:column; max-height:calc(100dvh - 24px); }
  dialog h2{ font-size:1.05rem; margin:0; padding:16px 16px 8px; }
  .dbody{ padding:0 16px 8px; overflow-y:auto; }
  .dfoot{ display:flex; gap:8px; justify-content:flex-end; padding:12px 16px 16px; border-top:1px solid var(--line); }
  .dfoot .left{ margin-right:auto; }
  .f{ display:block; margin-bottom:10px; font-size:.8rem; color:var(--ink-soft); }
  .f input, .f select, .f textarea{ display:block; width:100%; margin-top:2px; min-height:44px; padding:8px 10px; font-size:1rem; border:1px solid var(--line); border-radius:10px; background:var(--bg); }
  .f textarea{ min-height:64px; resize:vertical; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .err{ color:var(--danger); font-size:.85rem; min-height:1.2em; margin:0; }
  .trow{ display:grid; grid-template-columns:1fr 72px 72px; gap:8px; align-items:center; margin-bottom:6px; font-size:.9rem; }
  .trow input{ min-height:40px; padding:4px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); width:100%; }
  .trow.h{ color:var(--ink-soft); font-size:.75rem; }
  .hint{ font-size:.8rem; color:var(--ink-soft); margin:0 0 8px; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none !important; animation:none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>衣服管理</h1>
    <div style="position:relative">
      <button id="menuBtn" class="icon-btn" type="button" aria-label="メニュー" aria-haspopup="true" aria-expanded="false">⋯</button>
      <div class="menu" id="menu" role="menu">
        <button type="button" role="menuitem" id="mTargets">品目の目標数</button>
        <button type="button" role="menuitem" id="mExport">書き出し（JSON）</button>
        <button type="button" role="menuitem" id="mImport">読み込み</button>
        <div class="sep"></div>
        <button type="button" role="menuitem" id="themeBtn"></button>
      </div>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <section class="sum" aria-label="集計">
    <div><span>所持</span><strong id="sCount">0点</strong></div>
    <div><span>購入額</span><strong id="sPrice">¥0</strong></div>
    <div><span>購入予定</span><strong id="sPlan">0点</strong></div>
  </section>

  <section class="short" id="short" hidden>
    <p id="shortTitle"></p>
    <div class="chips" id="shortChips"></div>
  </section>

  <div class="tabs" id="tabs" role="tablist" aria-label="区分"></div>

  <div class="tools">
    <input id="q" type="search" placeholder="名前・商品番号・色・サイズで検索" aria-label="検索">
    <select id="sort" aria-label="並び替え">
      <option value="dateDesc">購入日 新しい順</option>
      <option value="dateAsc">購入日 古い順</option>
      <option value="priceDesc">価格 高い順</option>
      <option value="priceAsc">価格 安い順</option>
      <option value="name">名前順</option>
    </select>
    <select id="status" aria-label="状態">
      <option value="active">所持・購入予定</option>
      <option value="所持">所持のみ</option>
      <option value="購入予定">購入予定のみ</option>
      <option value="処分済み">処分済み</option>
      <option value="all">すべて</option>
    </select>
  </div>
  <div class="filterbar" id="filterbar" hidden><span id="filterText"></span><button type="button" id="filterClear" style="min-height:32px">解除</button></div>

  <div id="list"></div>
</main>

<button class="fab primary" id="addBtn" type="button" aria-label="衣服を追加">＋</button>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo" type="button">元に戻す</button></div>

<!-- 衣服の入力 -->
<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="form" novalidate>
    <h2 id="dlgTitle">衣服を追加</h2>
    <div class="dbody">
      <label class="f">名前（必須）<input id="fName" maxlength="100" autocomplete="off"></label>
      <div class="row2">
        <label class="f">区分<select id="fSection"></select></label>
        <label class="f">状態<select id="fStatus"></select></label>
      </div>
      <label class="f">品目（目標数を決めるまとまり。例: ポロシャツ）<input id="fCat" maxlength="50" list="catList" autocomplete="off"></label>
      <datalist id="catList"></datalist>
      <div class="row2">
        <label class="f">サイズ<input id="fSize" maxlength="20" autocomplete="off"></label>
        <label class="f">カラー<input id="fColor" maxlength="30" autocomplete="off"></label>
      </div>
      <div class="row2">
        <label class="f">価格（1枚あたり・円）<input id="fPrice" inputmode="numeric" autocomplete="off"></label>
        <label class="f">数量<input id="fQty" inputmode="numeric" autocomplete="off"></label>
      </div>
      <div class="row2">
        <label class="f">購入日<input id="fDate" type="date"></label>
        <label class="f">購入店<input id="fShop" maxlength="50" autocomplete="off"></label>
      </div>
      <label class="f">商品番号<input id="fNo" maxlength="30" autocomplete="off"></label>
      <label class="f">使用感<input id="fFeel" maxlength="200" autocomplete="off"></label>
      <label class="f">メモ<textarea id="fNote" maxlength="500"></textarea></label>
      <p class="err" id="fErr" role="alert"></p>
    </div>
    <div class="dfoot">
      <button type="button" class="danger left" id="fDel">削除</button>
      <button type="button" id="fCancel">キャンセル</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>

<!-- 品目の目標数 -->
<dialog id="tdlg" aria-labelledby="tdlgTitle">
  <form id="tform" novalidate>
    <h2 id="tdlgTitle">品目の目標数</h2>
    <div class="dbody">
      <p class="hint">目標数に足りない品目は、画面の上に表示します。予備は、目標とは別に持っておきたい数です。0にすると、その品目の目標を外します。</p>
      <div class="trow h"><span>品目</span><span>目標</span><span>予備</span></div>
      <div id="trows"></div>
      <div class="row2" style="grid-template-columns:1fr auto;margin-top:8px">
        <input id="tNew" maxlength="50" placeholder="品目を追加（例: ロンT）" aria-label="追加する品目" style="min-height:44px;padding:4px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)">
        <button type="button" id="tAdd">追加</button>
      </div>
    </div>
    <div class="dfoot">
      <button type="button" id="tCancel">キャンセル</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>

<!-- クラウド同期（右下の☁ボタンは、このスクリプトが作る）。読み込めなくても端末内だけで動く -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud-sync.js"></script>
<script>
(function(){
  'use strict';
  const $ = (s) => document.querySelector(s);

  const STORAGE_KEY = 'clothes-manager-data-v1';
  const VIEW_KEY = 'clothes-manager-view';
  const THEME_KEY = 'clothes-manager-theme';
  const APP_NAME = '衣服管理'; // クラウドの app_name（他のアプリと重複させない）
  const SYNC_KEY = 'data-v1';

  const SECTIONS = ['冬', '夏', '年中', '靴下'];
  const STATUSES = ['所持', '購入予定', '処分済み'];
  // カラー名から、カードの左の帯の色を決める（該当しなければ灰色）
  const COLOR_MAP = [
    ['ブラック', '#2C2C2A'], ['黒', '#2C2C2A'], ['ネイビー', '#1F3A6E'], ['紺', '#1F3A6E'],
    ['ホワイト', '#D3D1C7'], ['白', '#D3D1C7'], ['グレー', '#888780'], ['灰', '#888780'],
    ['ブルー', '#378ADD'], ['青', '#378ADD'], ['レッド', '#E24B4A'], ['赤', '#E24B4A'],
    ['グリーン', '#639922'], ['緑', '#639922'], ['ベージュ', '#C8B79A'], ['ブラウン', '#7A5230'], ['茶', '#7A5230'],
    ['ピンク', '#D4537E'], ['イエロー', '#EF9F27'], ['黄', '#EF9F27'], ['カーキ', '#6B6B3A'], ['オレンジ', '#D85A30']
  ];

  let items = [];     // 衣服の一覧
  let targets = {};   // 品目ごとの目標数 { 品目: { target, spare } }
  let view = { tab: 'all', sort: 'dateDesc', status: 'active' };
  let catFilter = '';
  let cloud = null;
  let editingId = null;
  let undoFn = null;

  // ---------- 検証（端末・クラウド・ファイルに共通。壊れた値を取り除く） ----------
  const str = (v, n) => (typeof v === 'string' ? v.trim().slice(0, n) : '');
  const num = (v, max, def) => { const n = Math.floor(Number(v)); return Number.isFinite(n) && n >= 0 ? Math.min(n, max) : def; };
  function sanitizeItem(x){
    if(!x || typeof x !== 'object') return null;
    const name = str(x.name, 100);
    if(!name) return null;
    return {
      id: str(String(x.id == null ? '' : x.id), 60) || newId(),
      name,
      section: SECTIONS.includes(x.section) ? x.section : '年中',
      status: STATUSES.includes(x.status) ? x.status : '所持',
      category: str(x.category, 50),
      size: str(x.size, 20), color: str(x.color, 30),
      price: num(x.price, 9999999, 0), qty: num(x.qty, 9999, 1),
      boughtAt: /^\d{4}-\d{2}-\d{2}$/.test(x.boughtAt) ? x.boughtAt : '',
      shop: str(x.shop, 50), productNo: str(x.productNo, 30),
      feel: str(x.feel, 200), note: str(x.note, 500)
    };
  }
  function sanitizeTargets(t){
    const out = {};
    if(!t || typeof t !== 'object' || Array.isArray(t)) return out;
    Object.keys(t).slice(0, 200).forEach((k) => {
      const name = str(k, 50);
      const v = t[k];
      if(!name || !v || typeof v !== 'object') return;
      const target = num(v.target, 999, 0), spare = num(v.spare, 999, 0);
      if(target > 0 || spare > 0) out[name] = { target, spare };
    });
    return out;
  }
  function newId(){
    return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
  }

  // ---------- 保存と読み込み ----------
  function load(){
    try{
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      items = Array.isArray(raw.items) ? raw.items.map(sanitizeItem).filter(Boolean) : [];
      targets = sanitizeTargets(raw.targets);
    }catch(e){ items = []; targets = {}; }
    try{
      const v = JSON.parse(localStorage.getItem(VIEW_KEY) || '{}');
      if(v.tab === 'all' || SECTIONS.includes(v.tab)) view.tab = v.tab;
      if(['dateDesc','dateAsc','priceDesc','priceAsc','name'].includes(v.sort)) view.sort = v.sort;
      if(['active','all'].concat(STATUSES).includes(v.status)) view.status = v.status;
    }catch(e){ /* 保存した表示設定が壊れていたら既定のまま */ }
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ items, targets })); }
    catch(e){ toast('端末に保存できませんでした。ブラウザの設定をご確認ください。'); }
    if(cloud) cloud.notifyChanged(); // 端末へ保存した直後に必ず呼ぶ
  }
  function saveView(){ try{ localStorage.setItem(VIEW_KEY, JSON.stringify(view)); }catch(e){ /* 保存できなくても表示は続ける */ } }

  // ---------- 表示用の計算 ----------
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const yen = (n) => '¥' + n.toLocaleString('ja-JP');
  const ymd = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? m[1] + '/' + Number(m[2]) + '/' + Number(m[3]) : ''; };
  const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const catName = (it) => it.category || '未分類';
  function dotColor(it){
    const c = it.color || '';
    const hit = COLOR_MAP.find((p) => c.indexOf(p[0]) >= 0);
    return hit ? hit[1] : '#888780';
  }
  // 品目ごとの所持数（状態が「所持」のものだけ。区分・絞り込みに関係なく全体で数える）
  function ownedByCat(){
    const m = {};
    items.forEach((it) => { if(it.status === '所持') m[it.category] = (m[it.category] || 0) + it.qty; });
    return m;
  }

  // ---------- 画面 ----------
  function renderSummary(){
    const own = items.filter((it) => it.status === '所持');
    $('#sCount').textContent = own.reduce((a, it) => a + it.qty, 0) + '点';
    $('#sPrice').textContent = yen(own.reduce((a, it) => a + it.price * it.qty, 0));
    $('#sPlan').textContent = items.filter((it) => it.status === '購入予定').reduce((a, it) => a + it.qty, 0) + '点';
  }
  function renderShort(){
    const owned = ownedByCat();
    const lack = Object.keys(targets).filter((c) => targets[c].target > (owned[c] || 0));
    $('#short').hidden = lack.length === 0;
    if(!lack.length) return;
    $('#shortTitle').textContent = '不足 ' + lack.length + '品目';
    $('#shortChips').innerHTML = lack.map((c) =>
      '<button type="button" class="chip" data-cat="' + esc(c) + '">' + esc(c) + ' ' + (owned[c] || 0) + '/' + targets[c].target + '</button>').join('');
  }
  function renderTabs(){
    const all = [['all', 'すべて']].concat(SECTIONS.map((s) => [s, s]));
    $('#tabs').innerHTML = all.map((p) =>
      '<button type="button" class="tab" role="tab" data-tab="' + p[0] + '" aria-selected="' + (view.tab === p[0]) + '">' + p[1] + '</button>').join('');
  }
  function visibleItems(){
    const q = $('#q').value.trim().toLowerCase();
    let list = items.filter((it) => {
      if(view.tab !== 'all' && it.section !== view.tab) return false;
      if(view.status === 'active' ? it.status === '処分済み' : (view.status !== 'all' && it.status !== view.status)) return false;
      if(catFilter && catName(it) !== catFilter) return false;
      if(q && [it.name, it.productNo, it.color, it.size, it.category, it.shop, it.note].join(' ').toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    const by = {
      dateDesc: (a, b) => (b.boughtAt || '').localeCompare(a.boughtAt || ''),
      dateAsc: (a, b) => (a.boughtAt || '9999').localeCompare(b.boughtAt || '9999'),
      priceDesc: (a, b) => b.price - a.price,
      priceAsc: (a, b) => a.price - b.price,
      name: (a, b) => a.name.localeCompare(b.name, 'ja')
    }[view.sort];
    return list.sort(by);
  }
  function cardHtml(it){
    const sub = [it.size, it.color, ymd(it.boughtAt), it.price ? yen(it.price) : '', it.productNo ? '#' + it.productNo : ''].filter(Boolean).join('・');
    return '<div class="card' + (it.status === '処分済み' ? ' gone' : '') + '" tabindex="0" role="button" data-id="' + esc(it.id) + '" aria-label="' + esc(it.name) + 'を編集">' +
      '<span class="dot" style="background:' + dotColor(it) + '"></span>' +
      '<div class="body"><div class="t">' + (it.status === '購入予定' ? '<span class="badge">購入予定</span>' : it.status === '処分済み' ? '<span class="badge">処分済み</span>' : '') + esc(it.name) + '</div>' +
      '<div class="s">' + esc(sub || '詳細なし') + '</div>' +
      (it.status === '購入予定' ? '<button type="button" class="buy" data-buy="' + esc(it.id) + '">購入済みにする</button>' : '') + '</div>' +
      '<div class="qty">数量<b>' + it.qty + '</b></div></div>';
  }
  function renderList(){
    const list = visibleItems();
    const owned = ownedByCat();
    $('#filterbar').hidden = !catFilter;
    $('#filterText').textContent = '品目: ' + catFilter;
    if(!list.length){
      $('#list').innerHTML = '<p class="empty">' + (items.length ? '条件に合う衣服がありません。' : 'まだ登録がありません。右下の＋から追加します。') + '</p>';
      return;
    }
    // 並び替えの順に、品目ごとにまとめる
    const groups = [], idx = {};
    list.forEach((it) => {
      const c = catName(it);
      if(!(c in idx)){ idx[c] = groups.length; groups.push({ cat: c, items: [] }); }
      groups[idx[c]].items.push(it);
    });
    $('#list').innerHTML = groups.map((g) => {
      const t = targets[g.cat === '未分類' ? '' : g.cat];
      let st = '';
      if(t){
        const own = owned[g.cat === '未分類' ? '' : g.cat] || 0;
        if(own < t.target) st = '<span class="ng">' + own + '/' + t.target + '　あと' + (t.target - own) + '枚</span>';
        else if(t.spare && own < t.target + t.spare) st = '<span class="ok">' + own + '/' + t.target + '　予備あと' + (t.target + t.spare - own) + '</span>';
        else st = '<span class="ok">' + own + '/' + t.target + '　そろっています</span>';
      }
      return '<div class="gh"><b>' + esc(g.cat) + '</b>' + st + '</div>' + g.items.map(cardHtml).join('');
    }).join('');
  }
  function render(){ renderSummary(); renderShort(); renderTabs(); renderList(); }

  // ---------- 操作（一覧） ----------
  $('#tabs').addEventListener('click', (e) => {
    const b = e.target.closest('[data-tab]');
    if(!b) return;
    view.tab = b.dataset.tab; saveView(); render();
  });
  $('#q').addEventListener('input', renderList);
  $('#sort').addEventListener('change', (e) => { view.sort = e.target.value; saveView(); renderList(); });
  $('#status').addEventListener('change', (e) => { view.status = e.target.value; saveView(); renderList(); });
  $('#shortChips').addEventListener('click', (e) => {
    const b = e.target.closest('[data-cat]');
    if(!b) return;
    catFilter = b.dataset.cat;
    view.tab = 'all'; view.status = 'active'; $('#status').value = 'active'; saveView();
    render();
  });
  $('#filterClear').addEventListener('click', () => { catFilter = ''; renderList(); });

  $('#list').addEventListener('click', (e) => {
    const buy = e.target.closest('[data-buy]');
    if(buy){
      const it = items.find((x) => x.id === buy.dataset.buy);
      if(!it) return;
      const before = { status: it.status, boughtAt: it.boughtAt };
      it.status = '所持'; if(!it.boughtAt) it.boughtAt = todayStr();
      save(); render();
      toast('購入済みにしました', () => { it.status = before.status; it.boughtAt = before.boughtAt; save(); render(); });
      return;
    }
    const card = e.target.closest('.card');
    if(card) openEdit(card.dataset.id);
  });
  $('#list').addEventListener('keydown', (e) => {
    if((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')){ e.preventDefault(); openEdit(e.target.dataset.id); }
  });

  // ---------- 入力ダイアログ ----------
  const dlg = $('#dlg');
  $('#fSection').innerHTML = SECTIONS.map((s) => '<option>' + s + '</option>').join('');
  $('#fStatus').innerHTML = STATUSES.map((s) => '<option>' + s + '</option>').join('');
  function fillCatList(){
    const names = new Set(Object.keys(targets));
    items.forEach((it) => { if(it.category) names.add(it.category); });
    $('#catList').innerHTML = Array.from(names).map((n) => '<option value="' + esc(n) + '">').join('');
  }
  function openEdit(id){
    const it = id ? items.find((x) => x.id === id) : null;
    editingId = it ? it.id : null;
    fillCatList();
    $('#dlgTitle').textContent = it ? '衣服を編集' : '衣服を追加';
    $('#fDel').hidden = !it;
    const d = it || { name: '', section: SECTIONS.includes(view.tab) ? view.tab : '冬', status: '所持', category: catFilter, size: '', color: '', price: '', qty: 1, boughtAt: todayStr(), shop: '', productNo: '', feel: '', note: '' };
    $('#fName').value = d.name; $('#fSection').value = d.section; $('#fStatus').value = d.status;
    $('#fCat').value = d.category; $('#fSize').value = d.size; $('#fColor').value = d.color;
    $('#fPrice').value = d.price === 0 ? '' : d.price; $('#fQty').value = d.qty; $('#fDate').value = d.boughtAt;
    $('#fShop').value = d.shop; $('#fNo').value = d.productNo; $('#fFeel').value = d.feel; $('#fNote').value = d.note;
    $('#fErr').textContent = '';
    dlg.showModal();
    $('#fName').focus();
  }
  $('#addBtn').addEventListener('click', () => openEdit(null));
  $('#fCancel').addEventListener('click', () => dlg.close());
  $('#fName').addEventListener('input', () => { $('#fErr').textContent = ''; });
  $('#form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('#fName').value.trim();
    if(!name){ $('#fErr').textContent = '名前を入力してください'; $('#fName').focus(); return; }
    const price = $('#fPrice').value.trim(), qty = $('#fQty').value.trim();
    if((price && !/^\d+$/.test(price)) || (qty && !/^\d+$/.test(qty))){ $('#fErr').textContent = '価格と数量は、半角の数字で入力してください'; return; }
    const rec = sanitizeItem({
      id: editingId || newId(), name, section: $('#fSection').value, status: $('#fStatus').value,
      category: $('#fCat').value, size: $('#fSize').value, color: $('#fColor').value,
      price: price || 0, qty: qty === '' ? 1 : qty, boughtAt: $('#fDate').value,
      shop: $('#fShop').value, productNo: $('#fNo').value, feel: $('#fFeel').value, note: $('#fNote').value
    });
    const i = items.findIndex((x) => x.id === editingId);
    if(i >= 0) items[i] = rec; else items.unshift(rec);
    save(); dlg.close(); render();
  });
  $('#fDel').addEventListener('click', () => {
    const i = items.findIndex((x) => x.id === editingId);
    if(i < 0) return;
    const removed = items[i];
    items.splice(i, 1);
    save(); dlg.close(); render();
    toast('削除しました', () => { items.splice(i, 0, removed); save(); render(); });
  });

  // ---------- 品目の目標数 ----------
  const tdlg = $('#tdlg');
  function trowHtml(name, t){
    return '<div class="trow" data-name="' + esc(name) + '"><span>' + esc(name) + '</span>' +
      '<input inputmode="numeric" aria-label="' + esc(name) + 'の目標" value="' + (t ? t.target : '') + '">' +
      '<input inputmode="numeric" aria-label="' + esc(name) + 'の予備" value="' + (t ? t.spare : '') + '"></div>';
  }
  function openTargets(){
    const names = new Set(Object.keys(targets));
    items.forEach((it) => { if(it.category) names.add(it.category); });
    $('#trows').innerHTML = Array.from(names).map((n) => trowHtml(n, targets[n])).join('') || '<p class="hint">まだ品目がありません。下で追加します。</p>';
    $('#tNew').value = '';
    tdlg.showModal();
  }
  $('#tAdd').addEventListener('click', () => {
    const name = $('#tNew').value.trim().slice(0, 50);
    if(!name) return;
    if(!$('#trows').querySelector('[data-name="' + CSS.escape(name) + '"]')){
      if(!$('#trows').querySelector('.trow')) $('#trows').innerHTML = '';
      $('#trows').insertAdjacentHTML('beforeend', trowHtml(name, null));
    }
    $('#tNew').value = '';
    const row = $('#trows').querySelector('[data-name="' + CSS.escape(name) + '"] input');
    if(row) row.focus();
  });
  $('#tNew').addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); $('#tAdd').click(); } });
  $('#tCancel').addEventListener('click', () => tdlg.close());
  $('#tform').addEventListener('submit', (e) => {
    e.preventDefault();
    const next = {};
    $('#trows').querySelectorAll('.trow').forEach((r) => {
      const v = r.querySelectorAll('input');
      next[r.dataset.name] = { target: num(v[0].value, 999, 0), spare: num(v[1].value, 999, 0) };
    });
    const before = targets;
    targets = sanitizeTargets(next);
    save(); tdlg.close(); render();
    toast('目標数を保存しました', () => { targets = before; save(); render(); });
  });

  // ---------- 元に戻す（トースト） ----------
  let toastTimer = null;
  function toast(msg, undo){
    $('#toastMsg').textContent = msg;
    undoFn = undo || null;
    $('#toastUndo').style.display = undo ? '' : 'none';
    $('#toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 6000);
  }
  $('#toastUndo').addEventListener('click', () => {
    if(undoFn) undoFn();
    undoFn = null;
    $('#toast').classList.remove('show');
  });

  // ---------- メニュー ----------
  const menu = $('#menu');
  function setMenu(open){ menu.classList.toggle('show', open); $('#menuBtn').setAttribute('aria-expanded', String(open)); }
  $('#menuBtn').addEventListener('click', (e) => { e.stopPropagation(); setMenu(!menu.classList.contains('show')); });
  document.addEventListener('click', () => setMenu(false));
  document.addEventListener('keydown', (e) => { if(e.key === 'Escape') setMenu(false); });
  $('#mTargets').addEventListener('click', openTargets);

  // ---------- 書き出し・読み込み（バックアップ用） ----------
  $('#mExport').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify({ app: APP_NAME, items, targets })], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'clothes-manager-' + todayStr() + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('#mImport').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    try{
      const d = JSON.parse(await file.text());
      if(!d || !Array.isArray(d.items)) throw new Error('形式が違います');
      const next = d.items.map(sanitizeItem).filter(Boolean);
      if(!confirm('現在のデータを、読み込んだ ' + next.length + ' 件に置き換えます。よろしいですか？')) return;
      const before = { items, targets };
      items = next; targets = sanitizeTargets(d.targets);
      save(); render();
      toast('読み込みました', () => { items = before.items; targets = before.targets; save(); render(); });
    }catch(err){
      toast('読み込めませんでした: ' + err.message);
    }
  });

  // ---------- 表示の切り替え（自動 → ライト → ダーク） ----------
  const THEME_NEXT = { auto:'light', light:'dark', dark:'auto' };
  const THEME_LABEL = { auto:'◐ 表示：自動', light:'☀ 表示：ライト', dark:'☾ 表示：ダーク' };
  function getTheme(){
    try{ const t = localStorage.getItem(THEME_KEY); return (t === 'light' || t === 'dark') ? t : 'auto'; }
    catch(e){ return 'auto'; }
  }
  function applyTheme(t){
    if(t === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', t);
    $('#themeBtn').textContent = THEME_LABEL[t];
    document.querySelectorAll('meta[name="theme-color"]').forEach((m) => {
      const dark = (m.getAttribute('media') || '').indexOf('dark') >= 0;
      m.setAttribute('content', t === 'light' ? '#F4F5F7' : (t === 'dark' ? '#0E1116' : (dark ? '#0E1116' : '#F4F5F7')));
    });
  }
  $('#themeBtn').addEventListener('click', () => {
    const next = THEME_NEXT[getTheme()];
    try{ localStorage.setItem(THEME_KEY, next); }catch(e){ /* 保存できなくても表示は切り替える */ }
    applyTheme(next);
  });
  applyTheme(getTheme());

  // ---------- オフライン対応（PWA） ----------
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    navigator.serviceWorker.register('clothes-sw.js').catch(() => {});
  }

  load();
  $('#sort').value = view.sort;
  $('#status').value = view.status;
  render();

  // ---------- クラウド同期（cloud-sync.js） ----------
  if(window.CloudSync){
    cloud = CloudSync.init({
      appName: APP_NAME,
      key: SYNC_KEY,
      getData: function(){ return { items: items, targets: targets }; },
      hasData: function(){ return items.length > 0 || Object.keys(targets).length > 0; },
      applyData: function(d){
        if(!d || !Array.isArray(d.items)) throw new Error('衣服管理のデータ形式が違います');
        items = d.items.map(sanitizeItem).filter(Boolean);
        targets = sanitizeTargets(d.targets);
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({ items, targets })); }
        catch(e){ toast('クラウドのデータを端末に保存できませんでした。'); }
        render();
      }
    });
  }
})();
</script>
</body>
</html>
