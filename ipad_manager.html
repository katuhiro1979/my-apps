<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPad管理</title>
<meta name="theme-color" content="#3d5a73">
<link rel="manifest" href="ipad-manifest.json">
<link rel="icon" href="ipad-icon-192.png">
<link rel="apple-touch-icon" href="ipad-icon-192.png">
<style>
  /* ===== デザイントークン（ライト／ダークは light-dark() で一括管理） ===== */
  :root{
    color-scheme:light dark;
    --bg:light-dark(#f2f2f7,#000);
    --surface:light-dark(#fff,#1c1c1e);
    --surface-2:light-dark(#f2f2f7,#2c2c2e);
    --text:light-dark(#1c1c1e,#f2f2f7);
    --text-2:light-dark(#6c6c70,#98989f);
    --line:light-dark(#e5e5ea,#38383a);
    --accent:light-dark(#0a6cff,#4d9bff);
    --accent-text:#fff;
    --ok:light-dark(#1f8a3b,#46d36b);
    --ok-bg:light-dark(#e3f6e8,#12301b);
    --warn:light-dark(#a85f00,#ffb340);
    --warn-bg:light-dark(#fff1d9,#3a2a08);
    --bad:light-dark(#d70015,#ff6b6b);
    --bad-bg:light-dark(#ffe5e8,#3d1417);
    --r-s:10px;--r-m:16px;--r-l:22px;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);
    --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
  }
  /* 表示ボタンでの固定（自動のときは端末の設定に従う） */
  :root[data-theme="dark"]{color-scheme:dark;}
  :root[data-theme="light"]{color-scheme:light;}

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55;min-height:100vh;padding:0 0 60px 0;}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 20px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
  header h1{font-size:34px;letter-spacing:.01em;line-height:1.2;margin:0;font-weight:700;}
  header .sub{font-size:14px;color:var(--text-2);margin-top:6px;}
  .date-today{font-size:13px;color:var(--text-2);}

  /* 集計カード */
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:24px;}
  .stat{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--shadow);padding:16px 18px;text-align:left;}
  .stat .num{font-size:32px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;}
  .stat .label{font-size:13px;color:var(--text-2);margin-top:4px;}
  .stat.overdue .num{color:var(--bad);}
  .stat.soon .num{color:var(--warn);}

  .panel{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow);margin-bottom:24px;overflow:hidden;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
  .panel-head h2{font-size:18px;font-weight:700;margin:0;}
  .panel-body{padding:20px;}
  .sec{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--text-2);margin:8px 0 10px;}

  /* ボタン（主＝塗り / 副＝淡い塗り / 削除＝赤文字） */
  button{font-family:inherit;cursor:pointer;border:none;background:var(--accent);color:var(--accent-text);padding:11px 20px;min-height:44px;font-size:15px;font-weight:600;border-radius:12px;transition:filter .15s ease,transform .1s ease;}
  button:hover{filter:brightness(1.06);}
  button:active{transform:scale(.98);}
  button.ghost{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);}
  button.small{padding:7px 14px;min-height:36px;font-size:13.5px;border-radius:10px;}
  button.danger{background:transparent;color:var(--bad);}
  button.danger:hover{background:var(--bad-bg);filter:none;}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;}

  /* 入力欄 */
  input,select,textarea{font-family:inherit;font-size:16px;padding:10px 12px;min-height:44px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);border-radius:var(--r-s);width:100%;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--surface);}
  label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--text-2);}
  .form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px;}
  .form-grid .w3{grid-column:1 / -1;}
  .form-actions{display:flex;gap:10px;flex-wrap:wrap;}
  .img-pick{display:flex;align-items:center;gap:12px;margin-bottom:16px;font-size:13px;color:var(--text-2);}
  .img-pick img{width:72px;height:72px;object-fit:cover;border-radius:var(--r-s);border:1px solid var(--line);}
  .img-pick input[type=file]{min-height:0;padding:8px;}

  /* 絞り込み・並び替え */
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .seg{display:inline-flex;background:color-mix(in srgb,var(--text-2) 16%,transparent);border-radius:12px;padding:3px;gap:2px;}
  .seg button{background:transparent;color:var(--text);padding:6px 14px;min-height:38px;font-size:14px;font-weight:500;border-radius:9px;}
  .seg button:hover{filter:none;}
  .seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:700;}
  .seg .cnt{font-size:12px;color:var(--text-2);margin-left:4px;font-weight:400;}
  .search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--text-2) 16%,transparent);border-radius:12px;padding:0 12px;min-height:44px;color:var(--text-2);}
  .search input{flex:1;border:none;background:transparent;padding:0;min-height:42px;outline:none;-webkit-appearance:none;appearance:none;}
  .search:focus-within{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;}
  .sort{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);}
  .sort select{width:auto;min-height:44px;font-size:14px;font-weight:600;color:var(--accent);background:transparent;border:none;padding:0 4px;}

  /* iPadのカード一覧（開いたカードは1行ぶん広げて詳細を出す） */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-bottom:24px;align-items:start;grid-auto-flow:row dense;}
  .grid > .empty{grid-column:1 / -1;background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow);}
  .dev{background:var(--surface);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden;transition:transform .15s ease,box-shadow .15s ease;}
  .dev:not(.open):hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 12px 28px rgba(0,0,0,.10);}
  .card-main{display:flex;flex-direction:column;cursor:pointer;text-align:left;}
  .card-main:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:-3px;}
  .media{aspect-ratio:16/10;background:var(--surface-2);display:grid;place-items:center;position:relative;font-size:56px;overflow:hidden;}
  .media img{width:100%;height:100%;object-fit:cover;display:block;}
  .media .tag{position:absolute;top:12px;left:12px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.88);color:#1c1c1e;}
  .c-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .d-name{font-size:20px;font-weight:700;line-height:1.3;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--text-2);}
  .c-foot{display:flex;justify-content:space-between;gap:8px;color:var(--text-2);font-size:13px;margin-top:auto;}
  .c-foot .more{color:var(--accent);font-weight:600;white-space:nowrap;}

  /* 詳細・登録のシート（<dialog>。PCは中央、スマホは下から出る） */
  html:has(dialog[open]){overflow:hidden;}
  dialog.sheet{width:min(760px,calc(100vw - 32px));max-width:none;max-height:min(88vh,900px);border:none;padding:0;border-radius:var(--r-l);background:var(--surface);color:var(--text);box-shadow:0 24px 70px rgba(0,0,0,.35);overflow:hidden;}
  dialog.sheet[open]{display:flex;flex-direction:column;animation:sheet-in .22s ease;}
  dialog.sheet::backdrop{background:rgba(0,0,0,.42);}
  @keyframes sheet-in{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  @keyframes sheet-up{from{transform:translateY(100%);}to{transform:none;}}
  .sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-shrink:0;background:var(--surface);}
  .sheet-bar strong{font-size:16px;text-align:center;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sheet-bar button{flex-shrink:0;}
  .sheet-body{padding:18px 20px 28px;overflow-y:auto;flex:1;overscroll-behavior:contain;}
  .sheet .form-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .d-hero{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:center;margin-bottom:16px;}
  .d-hero .media{border-radius:var(--r-m);}
  .d-hero .d-name{font-size:24px;}
  .d-hero .chips{margin:10px 0;}

  /* 右下の登録ボタン（☁ボタンの上に置く） */
  .fab{position:fixed;right:16px;bottom:72px;width:60px;height:60px;padding:0;border-radius:50%;font-size:32px;line-height:1;z-index:50;box-shadow:0 8px 24px color-mix(in srgb,var(--accent) 45%,transparent);}
  .empty .small{margin-top:14px;}
  #printArea{display:none;}
  .c-groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px;}
  .group{background:var(--surface-2);border-radius:var(--r-m);overflow:hidden;align-self:start;}
  .group h3{margin:0;padding:10px 16px 2px;font-size:12px;color:var(--text-2);font-weight:600;letter-spacing:.04em;}
  .kv{display:flex;justify-content:space-between;gap:16px;padding:10px 16px;border-top:1px solid var(--line);font-size:15px;}
  .group h3 + .kv{border-top:none;}
  .kv .k{color:var(--text-2);flex-shrink:0;}
  .kv .v{text-align:right;font-weight:500;word-break:break-word;}
  .d-note{font-size:14px;margin:0 0 14px;padding:12px 16px;border-radius:var(--r-m);background:var(--surface-2);white-space:pre-wrap;word-break:break-word;}
  .badge{display:inline-flex;align-items:center;font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px;margin-right:6px;}
  .badge.ok{background:var(--ok-bg);color:var(--ok);}
  .badge.soon{background:var(--warn-bg);color:var(--warn);}
  .badge.overdue{background:var(--bad-bg);color:var(--bad);}
  .badge.none{background:var(--surface-2);color:var(--text-2);}
  .d-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:0;}
  .empty{padding:36px 20px;text-align:center;color:var(--text-2);font-size:15px;}

  /* アクセサリー */
  .a-box{margin-top:20px;border-radius:var(--r-m);background:var(--surface-2);padding:14px 16px;}
  .a-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .a-head > button.small{white-space:nowrap;flex-shrink:0;}
  .a-toggle{background:transparent;color:var(--text);padding:4px 2px;min-height:36px;font-size:16px;font-weight:700;text-align:left;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;border-radius:8px;}
  .a-toggle:hover{filter:none;}
  .a-toggle .arrow{font-size:11px;color:var(--text-2);}
  .a-brief{font-size:13px;font-weight:400;color:var(--text-2);margin-left:6px;}
  .a-list{list-style:none;margin:10px 0 0;padding:0;}
  .a-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;}
  .a-item:last-child{border-bottom:none;}
  .a-row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
  .a-row .t{font-weight:600;}
  .a-row .c{font-size:14px;margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .a-type{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--surface);color:var(--text-2);}
  .a-sub{font-size:13px;color:var(--text-2);margin-top:2px;}
  .a-note{white-space:pre-wrap;word-break:break-word;}
  .a-btns{display:flex;gap:6px;}
  .a-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px;align-items:end;}
  .a-form .w2{grid-column:span 2;}
  .a-form .w4{grid-column:1 / -1;}

  .io-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--text-2);}
  .io-row input[type=file]{width:auto;min-height:0;}

  /* 印刷（iPadごとの「印刷」ボタンで、その1台だけを白黒向けに出力。売却時の提出用） */
  @media print{
    :root,:root[data-theme]{color-scheme:light;--bg:#fff;--surface:#fff;--surface-2:#fff;--text:#000;--text-2:#444;--line:#999;--ok:#222;--ok-bg:#fff;--warn:#222;--warn-bg:#fff;--bad:#222;--bad-bg:#fff;--shadow:none;}
    .no-print,.stats,.fab,.d-actions,.a-btns,.a-form,.a-box button,.a-toggle .arrow,#cs-btn,#cs-panel{display:none !important;}
    body{background:#fff;}
    .wrap{padding:0;max-width:none;}
    .panel{border-radius:0;margin:0;box-shadow:none;}
    .toolbar,.c-foot .more{display:none !important;}
    .grid{display:block;}
    body.printing .wrap,body.printing dialog{display:none !important;}
    body.printing #printArea{display:block;}
    #printArea .d-hero{grid-template-columns:200px 1fr;}
    .badge{border:1px solid #999;}
    .a-box{border:1px solid #999;}
    .a-item{break-inside:avoid;}
  }
  @media (max-width:640px){
    .wrap{padding:20px 16px;}
    header h1{font-size:28px;}
    .form-grid{grid-template-columns:1fr;}
    .grid{grid-template-columns:1fr;}
    dialog.sheet{width:100%;max-height:92vh;max-height:92dvh;margin:auto 0 0;border-radius:var(--r-l) var(--r-l) 0 0;}
    dialog.sheet[open]{animation-name:sheet-up;}
    .sheet-body{padding:16px 16px 28px;}
    .sheet .form-grid{grid-template-columns:1fr;}
    .d-hero{grid-template-columns:1fr;gap:12px;}
    .d-hero .media{aspect-ratio:auto;height:170px;}
    .d-hero .d-name{font-size:21px;}
    .fab{right:14px;}
    .c-groups{grid-template-columns:1fr;}
    .d-name{font-size:19px;}
    .stat{padding:12px 12px;}
    .stat .num{font-size:26px;}
    .stat .label{font-size:11.5px;}
    .a-box{padding:12px;}
    .a-btns{flex-direction:column;}
    .a-form{grid-template-columns:1fr 1fr;}
    .a-form .w2,.a-form .w4{grid-column:1 / -1;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>iPad管理</h1>
      <div class="sub">端末情報と保証期限をまとめて確認</div>
    </div>
    <div style="text-align:right">
      <div class="date-today" id="today"></div>
      <button type="button" class="ghost small no-print" id="btnTheme" style="margin-top:6px"></button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="stCount">0</div><div class="label">登録台数</div></div>
    <div class="stat soon"><div class="num" id="stSoon">0</div><div class="label">保証が間もなく切れる（30日以内）</div></div>
    <div class="stat overdue"><div class="num" id="stOver">0</div><div class="label">保証切れ</div></div>
  </div>

  <div class="toolbar no-print">
    <div class="seg" id="fltSeg" role="group" aria-label="状態で絞り込み"></div>
    <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="呼び名・型番・場所で検索" aria-label="検索"></label>
    <label class="sort">並び順
      <select id="sortSel"><option value="warranty">保証が近い順</option><option value="name">呼び名順</option><option value="added">登録順</option></select>
    </label>
  </div>
  <div id="list" class="grid"></div>

  <div class="panel no-print">
    <div class="panel-head"><h2>バックアップ</h2></div>
    <div class="panel-body">
      <div class="io-row">
        <button type="button" class="ghost small" id="btnExport">書き出す（JSON）</button>
        <label>読み込む：<input type="file" id="fImport" accept="application/json"></label>
      </div>
    </div>
  </div>
</div>


<button type="button" class="fab no-print" id="btnNew" aria-label="iPadを登録する">＋</button>

<dialog class="sheet" id="detailSheet" aria-label="iPadの詳細">
  <div class="sheet-bar"><span style="width:64px"></span><strong>iPadの詳細</strong><button type="button" class="ghost small" data-act="close">閉じる</button></div>
  <div class="sheet-body" id="detailBody"></div>
</dialog>

<dialog class="sheet" id="formSheet" aria-label="iPadの登録・編集">
  <div class="sheet-bar">
    <button type="button" class="ghost small" id="btnCancel">キャンセル</button>
    <strong id="formTitle">iPadを登録する</strong>
    <button type="button" class="small" id="btnSave">登録する</button>
  </div>
  <div class="sheet-body">
        <div class="img-pick">
          <img id="imgPrev" alt="" style="display:none">
          <input type="file" id="fImage" accept="image/*" style="width:auto">
          <button type="button" class="ghost small" id="btnImgClear" style="display:none">写真を外す</button>
        </div>

        <div class="sec">基本</div>
        <div class="form-grid">
          <label class="f">呼び名（必須）<input id="fName" maxlength="30" placeholder="例：リビング用"></label>
          <label class="f">機種
            <select id="fModel">
              <option value="">選んでください</option>
              <option>iPad</option><option>iPad Air</option><option>iPad mini</option><option>iPad Pro</option><option>その他</option>
            </select>
          </label>
          <label class="f">世代・サイズ<input id="fGen" maxlength="30" placeholder="例：第10世代 / 11インチ"></label>
          <label class="f">型番<input id="fModelNo" maxlength="30" placeholder="例：MPQ03J/A"></label>
          <label class="f">容量
            <select id="fCapacity">
              <option value="">選んでください</option>
              <option>32GB</option><option>64GB</option><option>128GB</option><option>256GB</option><option>512GB</option><option>1TB</option><option>2TB</option>
            </select>
          </label>
          <label class="f">色<input id="fColor" maxlength="20" placeholder="例：シルバー"></label>
          <label class="f">回線
            <select id="fNetwork"><option>Wi-Fi</option><option>Wi-Fi + Cellular</option></select>
          </label>
          <label class="f">状態
            <select id="fStatus"><option>使用中</option><option>予備</option><option>修理中</option><option>売却済み</option></select>
          </label>
          <label class="f">置き場所・用途<input id="fPlace" maxlength="30" placeholder="例：リビング・動画用"></label>
        </div>

        <div class="sec">識別情報</div>
        <div class="form-grid">
          <label class="f">シリアル番号<input id="fSerial" maxlength="30"></label>
          <label class="f">iPadOSのバージョン<input id="fOs" maxlength="20" placeholder="例：18.1"></label>
        </div>

        <div class="sec">購入・保証</div>
        <div class="form-grid">
          <label class="f">購入日<input type="date" id="fBuyDate"></label>
          <label class="f">購入店<input id="fShop" maxlength="30" placeholder="例：Apple Store"></label>
          <label class="f">購入金額（円）<input type="number" min="0" inputmode="numeric" id="fPrice"></label>
          <label class="f">保証期限<input type="date" id="fWarranty"></label>
          <label class="f">AppleCare+
            <select id="fCare"><option>未加入</option><option>加入</option></select>
          </label>
        </div>

        <div class="form-grid">
          <label class="f w3">メモ（改行できます）<textarea id="fNote" rows="3" maxlength="500"></textarea></label>
        </div>
  </div>
</dialog>

<div id="printArea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud-sync.js"></script>
<script>
(function(){
  var KEY='ipad-manager-data';
  var data=load();
  var editId=null;   // 編集中のiPadのID
  var imgData='';    // フォーム上の写真
  var cloud=null;    // 同期モジュール（cloud-sync.js）
  var openA={};      // アクセサリーのフォーム（true=追加 / 記録ID=編集）
  var ATYPES=['ケース・カバー','保護フィルム','Apple Pencil','キーボード','充電器・ケーブル','スタンド','イヤホン・ヘッドホン','その他'];
  var ASTATUS=['使用中','故障','廃棄'];
  // アクセサリーの折りたたみ状態（この端末の表示設定のみ）
  var COLL_KEY='ipad-manager-collapsed';
  var collA=(function(){try{return JSON.parse(localStorage.getItem(COLL_KEY))||{};}catch(e){return {};}})();
  function saveColl(){try{localStorage.setItem(COLL_KEY,JSON.stringify(collA));}catch(e){}}
  // 一覧の見せ方（絞り込み・並び順。この端末の表示設定のみ）
  var VIEW_KEY='ipad-manager-view';
  var view=(function(){
    var d={filter:'all',sort:'warranty'};
    try{var s=JSON.parse(localStorage.getItem(VIEW_KEY));if(s){d.filter=s.filter||d.filter;d.sort=s.sort||d.sort;}}catch(e){}
    return d;
  })();
  function saveView(){try{localStorage.setItem(VIEW_KEY,JSON.stringify(view));}catch(e){}}
  var query='';      // 検索語
  var curId=null;    // 詳細シートで開いているiPadのID
  var backTo=null;   // 編集を終えたあとに詳細へ戻るiPadのID
  var FILTERS=[['all','すべて'],['使用中','使用中'],['予備','予備'],['other','その他']];
  function inFilter(v,f){
    if(f==='all')return true;
    if(f==='other')return v.status!=='使用中'&&v.status!=='予備';
    return v.status===f;
  }

  function load(){
    try{
      var d=JSON.parse(localStorage.getItem(KEY));
      if(d&&Array.isArray(d.devices))return d;
    }catch(e){}
    return {devices:[]};
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(data));if(cloud)cloud.notifyChanged();}
    catch(e){alert('保存できませんでした（容量が足りない可能性があります）');}
  }
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function $(id){return document.getElementById(id);}

  // 日付（時刻を除いた日数差）
  function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function daysLeft(due){
    var a=new Date(due+'T00:00:00'),b=new Date(ymd(new Date())+'T00:00:00');
    return Math.round((a-b)/86400000);
  }
  function level(n){return n<0?'overdue':(n<=30?'soon':'ok');}
  function leftText(n){
    if(n<0)return Math.abs(n)+'日超過';
    if(n===0)return '今日まで';
    return 'あと'+n+'日';
  }

  // 写真を縮小してJPEGにする
  function shrink(file,cb){
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var max=600,s=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas');
        c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        cb(c.toDataURL('image/jpeg',0.8));
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  }

  function showImg(){
    $('imgPrev').style.display=imgData?'block':'none';
    $('imgPrev').src=imgData||'';
    $('btnImgClear').style.display=imgData?'inline-block':'none';
  }
  $('fImage').onchange=function(){
    var f=this.files[0];if(!f)return;
    shrink(f,function(u){imgData=u;showImg();});
  };
  $('btnImgClear').onclick=function(){imgData='';$('fImage').value='';showImg();};

  // [フォームのID, データのキー, 初期値]
  var FIELDS=[
    ['fName','name',''],['fModel','model',''],['fGen','gen',''],['fModelNo','modelNo',''],
    ['fCapacity','capacity',''],['fColor','color',''],['fNetwork','network','Wi-Fi'],['fStatus','status','使用中'],
    ['fPlace','place',''],['fSerial','serial',''],['fOs','os',''],
    ['fBuyDate','buyDate',''],['fShop','shop',''],['fPrice','price',''],['fWarranty','warranty',''],['fCare','care','未加入'],
    ['fNote','note','']
  ];

  function resetForm(){
    editId=null;imgData='';
    FIELDS.forEach(function(p){$(p[0]).value=p[2];});
    $('fImage').value='';showImg();
    $('formTitle').textContent='iPadを登録する';
    $('btnSave').textContent='登録する';
  }
  // 登録・編集シートの開閉（閉じたら入力を空に戻し、編集だった場合は詳細へ戻る）
  function openForm(){
    resetForm();backTo=null;
    $('formSheet').showModal();
    $('formSheet').querySelector('.sheet-body').scrollTop=0;
  }
  $('btnNew').onclick=openForm;
  $('btnCancel').onclick=function(){$('formSheet').close();};
  $('formSheet').addEventListener('close',function(){
    var b=backTo;backTo=null;resetForm();
    if(b&&find(b))openDetail(b);
  });

  $('btnSave').onclick=function(){
    var name=$('fName').value.trim();
    if(!name){alert('呼び名を入力してください');$('fName').focus();return;}
    var v=editId?find(editId):null;
    if(!v){
      v={id:uid()};data.devices.push(v);
    }
    FIELDS.forEach(function(p){v[p[1]]=$(p[0]).value.trim();});
    v.image=imgData;
    save();render();$('formSheet').close();
  };

  function find(id){
    for(var i=0;i<data.devices.length;i++)if(data.devices[i].id===id)return data.devices[i];
    return null;
  }

  function startEdit(id){
    var v=find(id);if(!v)return;
    editId=id;imgData=v.image||'';
    FIELDS.forEach(function(p){$(p[0]).value=v[p[1]]!=null&&v[p[1]]!==''?v[p[1]]:p[2];});
    showImg();
    $('formTitle').textContent='iPadを編集する';
    $('btnSave').textContent='保存する';
    backTo=id;
    if($('detailSheet').open)$('detailSheet').close();
    $('formSheet').showModal();
    $('formSheet').querySelector('.sheet-body').scrollTop=0;
  }

  // 保証の状態（売却済みは対象外）
  function warrantyOf(v){
    if(v.status==='売却済み'||!v.warranty)return null;
    return daysLeft(v.warranty);
  }

  function render(){
    renderDetail();
    $('today').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
    var soon=0,over=0;
    data.devices.forEach(function(v){
      var n=warrantyOf(v);
      if(n===null)return;
      var l=level(n);
      if(l==='soon')soon++;else if(l==='overdue')over++;
    });
    $('stCount').textContent=data.devices.length;
    $('stSoon').textContent=soon;
    $('stOver').textContent=over;

    // 絞り込みの切り替え（件数つき）
    $('fltSeg').innerHTML=FILTERS.map(function(f){
      var c=data.devices.filter(function(v){return inFilter(v,f[0]);}).length;
      return '<button type="button" data-flt="'+f[0]+'" aria-pressed="'+(view.filter===f[0])+'">'+f[1]+'<span class="cnt">'+c+'</span></button>';
    }).join('');
    $('sortSel').value=view.sort;

    if(!data.devices.length){
      $('list').innerHTML='<div class="empty">まだiPadが登録されていません。<br><button type="button" class="small" data-act="new">iPadを登録する</button></div>';
      return;
    }
    var list=data.devices.filter(function(v){
      if(!inFilter(v,view.filter))return false;
      if(!query)return true;
      var s=[v.name,v.model,v.gen,v.modelNo,v.serial,v.place,v.color,v.capacity].join(' ').toLowerCase();
      return s.indexOf(query.toLowerCase())>=0;
    });
    if(view.sort==='name'){
      list.sort(function(a,b){return String(a.name).localeCompare(String(b.name),'ja');});
    }else if(view.sort==='warranty'){
      // 保証が近い（期限切れを含む）順。期限なしは後ろ、売却済みは最後
      var key=function(v){var n=warrantyOf(v);return n!==null?n:(v.status==='売却済み'?2e6:1e6);};
      list.sort(function(a,b){return key(a)-key(b);});
    }
    if(!list.length){
      $('list').innerHTML='<div class="empty">条件に合うiPadがありません。</div>';
      return;
    }
    $('list').innerHTML=list.map(deviceHtml).join('');
  }

  function row(k,val){return val?'<div class="kv"><span class="k">'+k+'</span><span class="v">'+esc(val)+'</span></div>':'';}

  function badgeOf(v){
    var n=warrantyOf(v);
    if(n!==null)return '<span class="badge '+level(n)+'">'+(v.care==='加入'?'AppleCare+ ':'保証 ')+'：'+leftText(n)+'</span>';
    if(v.status==='売却済み')return '<span class="badge none">売却済み</span>';
    return '<span class="badge none">保証期限の登録なし</span>';
  }
  function chipsOf(v){
    var c=[v.model,v.gen,v.capacity,v.color,v.network].filter(Boolean).map(function(c){return '<span class="chip">'+esc(c)+'</span>';}).join('');
    return c?'<div class="chips">'+c+'</div>':'';
  }
  function mediaOf(v){return v.image?'<img src="'+v.image+'" alt="">':'<span aria-hidden="true">📱</span>';}

  // 一覧のカード（押すと詳細シートが開く）
  function deviceHtml(v){
    var using=(v.accessories||[]).filter(function(a){return a.status==='使用中';}).length;
    return '<div class="dev" data-did="'+v.id+'">'
      +'<div class="card-main" role="button" tabindex="0" data-open="'+v.id+'">'
      +'<div class="media">'+mediaOf(v)+'<span class="tag">'+esc(v.status||'')+'</span></div>'
      +'<div class="c-body"><div class="d-name">'+esc(v.name)+'</div>'
      +chipsOf(v)
      +'<div>'+badgeOf(v)+'</div>'
      +'<div class="c-foot"><span>'+esc(v.place||'')+(using?(v.place?'　':'')+'🎒 '+using+'点':'')+'</span><span class="more">詳細 ›</span></div>'
      +'</div></div></div>';
  }

  // 詳細シートの中身（forPrint=true のときは操作ボタンを出さない）
  function detailHtml(v,forPrint){
    return '<div class="d-hero"><div class="media">'+mediaOf(v)+'</div>'
      +'<div><div class="d-name">'+esc(v.name)+'</div>'+chipsOf(v)+'<div>'+badgeOf(v)+'</div></div></div>'
      +'<div class="c-groups">'
      +'<div class="group"><h3>端末</h3>'
      +row('状態',v.status)+row('回線',v.network)+row('置き場所・用途',v.place)
      +row('型番',v.modelNo)+row('シリアル番号',v.serial)+row('iPadOS',v.os)+'</div>'
      +'<div class="group"><h3>購入・保証</h3>'
      +row('購入日',v.buyDate)+row('購入店',v.shop)+row('金額',v.price?Number(v.price).toLocaleString()+'円':'')
      +row('保証期限',v.warranty)+row('AppleCare+',v.care)+'</div></div>'
      +(v.note?'<div class="d-note">'+esc(v.note)+'</div>':'')
      +(forPrint?'':'<div class="d-actions"><button class="small" data-act="edit" data-d="'+v.id+'">編集</button>'
        +'<button class="ghost small" data-act="print" data-d="'+v.id+'">この端末を印刷</button>'
        +'<button class="small danger" data-act="del" data-d="'+v.id+'">削除</button></div>')
      +accHtml(v,forPrint);
  }

  // 詳細シートの開閉・更新
  function renderDetail(){
    if(!curId||!$('detailSheet').open)return;
    var v=find(curId);
    if(!v){$('detailSheet').close();return;}
    $('detailBody').innerHTML=detailHtml(v);
  }
  function openDetail(id){
    curId=id;
    var first=!$('detailSheet').open;
    if(first)$('detailSheet').showModal();
    renderDetail();
    if(first)$('detailBody').scrollTop=0;
  }
  $('detailSheet').addEventListener('close',function(){curId=null;});

  function findA(v,id){
    var a=v.accessories||[];
    for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];
    return null;
  }

  // アクセサリー（使用中のものを先に、あとは購入日の新しい順）
  function accHtml(v,forPrint){
    var all=(v.accessories||[]).slice().sort(function(a,b){
      var ra=a.status==='使用中'?0:1,rb=b.status==='使用中'?0:1;
      if(ra!==rb)return ra-rb;
      return (a.buyDate||'')<(b.buyDate||'')?1:((a.buyDate||'')>(b.buyDate||'')?-1:0);
    });
    var using=all.filter(function(a){return a.status==='使用中';});
    var total=using.reduce(function(s,a){return s+(Number(a.price)||0);},0);
    var folded=!forPrint&&!!collA[v.id];
    var h='<div class="a-box"><div class="a-head"><button type="button" class="a-toggle" data-act="atoggle" data-d="'+v.id+'" aria-expanded="'+(!folded)+'">'
      +'<span class="arrow">'+(folded?'▶':'▼')+'</span> 🎒 アクセサリー'
      +(all.length?'<span class="a-brief">使用中 '+using.length+'点・'+total.toLocaleString()+'円</span>':'')+'</button>'
      +'<button class="small" data-act="aadd" data-d="'+v.id+'">＋ 追加</button></div>';
    if(folded)return h+'</div>';
    if(forPrint&&!all.length)return h+'</div>';
    if(!all.length&&!openA[v.id])h+='<div class="a-sub" style="margin-top:8px">まだアクセサリーがありません。「追加」から登録してください。</div>';
    h+='<ul class="a-list">'+all.map(function(a){
      var sub=[a.modelNo?'型番 '+a.modelNo:'',a.buyDate?'購入 '+a.buyDate:''].filter(Boolean).join(' ・ ');
      return '<li class="a-item"><div><div class="a-row"><span class="a-type">'+esc(a.type||'その他')+'</span><span class="t">'+esc(a.name)+'</span>'
        +(a.status&&a.status!=='使用中'?'<span class="badge '+(a.status==='故障'?'overdue':'none')+'">'+esc(a.status)+'</span>':'')
        +(a.price?'<span class="c">'+Number(a.price).toLocaleString()+'円</span>':'')+'</div>'
        +(sub?'<div class="a-sub">'+esc(sub)+'</div>':'')
        +(a.note?'<div class="a-sub a-note">'+esc(a.note)+'</div>':'')
        +'</div><div class="a-btns"><button class="ghost small" data-act="aedit" data-d="'+v.id+'" data-a="'+a.id+'">編集</button>'
        +'<button class="ghost small danger" data-act="adel" data-d="'+v.id+'" data-a="'+a.id+'">削除</button></div></li>';
    }).join('')+'</ul>';
    if(!forPrint&&openA[v.id]){
      var oa=openA[v.id]===true?null:findA(v,openA[v.id]);
      var g=function(k){return oa&&oa[k]!=null?esc(oa[k]):'';};
      var tOpts=ATYPES.map(function(t){return '<option'+(oa&&oa.type===t?' selected':'')+'>'+t+'</option>';}).join('');
      var sOpts=ASTATUS.map(function(s){return '<option'+(oa&&oa.status===s?' selected':'')+'>'+s+'</option>';}).join('');
      h+='<div class="a-form" data-aform="'+v.id+'">'
        +'<label class="f">種類<select class="aType">'+tOpts+'</select></label>'
        +'<label class="f w2">名称（必須）<input class="aName" maxlength="40" placeholder="例：Apple Pencil 第2世代" value="'+g('name')+'"></label>'
        +'<label class="f">状態<select class="aStatus">'+sOpts+'</select></label>'
        +'<label class="f w2">型番<input class="aModel" maxlength="30" value="'+g('modelNo')+'"></label>'
        +'<label class="f">購入日<input type="date" class="aDate" value="'+g('buyDate')+'"></label>'
        +'<label class="f">金額（円）<input type="number" min="0" inputmode="numeric" class="aPrice" value="'+g('price')+'"></label>'
        +'<label class="f w4">メモ（互換性・購入先など。改行できます）<textarea class="aNote" rows="2" maxlength="300">'+g('note')+'</textarea></label>'
        +'<button class="small" data-act="asave" data-d="'+v.id+'">'+(oa?'保存':'登録する')+'</button>'
        +'<button class="ghost small" data-act="acancel" data-d="'+v.id+'">やめる</button></div>';
    }
    return h+'</div>';
  }

  $('list').onkeydown=function(e){
    if(e.key!=='Enter'&&e.key!==' ')return;
    var c=e.target.closest('.card-main');
    if(c&&e.target===c){e.preventDefault();openDetail(c.dataset.open);}
  };
  // 絞り込み・検索・並び替え
  $('fltSeg').onclick=function(e){
    var b=e.target.closest('button[data-flt]');if(!b)return;
    view.filter=b.dataset.flt;saveView();render();
  };
  $('q').oninput=function(){query=this.value.trim();render();};
  $('sortSel').onchange=function(){view.sort=this.value;saveView();render();};

  // 一覧・詳細シートのボタン操作
  function onAct(e){
    var b=e.target.closest('button[data-act]');if(!b)return;
    var act=b.dataset.act;
    if(act==='new'){openForm();return;}
    if(act==='close'){$('detailSheet').close();return;}
    var v=find(b.dataset.d);if(!v)return;
    if(act==='edit'){startEdit(v.id);return;}
    if(act==='print'){
      // アクセサリーを開いた状態で、この1台だけを印刷する
      $('printArea').innerHTML=detailHtml(v,true);
      document.body.classList.add('printing');
      window.print();
      return;
    }
    if(act==='del'){
      if(confirm('「'+v.name+'」を削除しますか？アクセサリーの記録も消えます。')){
        data.devices=data.devices.filter(function(x){return x.id!==v.id;});
        $('detailSheet').close();
        save();render();
      }
      return;
    }
    if(act==='atoggle'){collA[v.id]=!collA[v.id];saveColl();render();return;}
    if(act==='aadd'){openA[v.id]=true;if(collA[v.id]){collA[v.id]=false;saveColl();}render();return;}
    if(act==='aedit'){openA[v.id]=b.dataset.a;render();return;}
    if(act==='acancel'){delete openA[v.id];render();return;}
    if(act==='adel'){
      var da=findA(v,b.dataset.a);
      if(da&&confirm('「'+da.name+'」を削除しますか？')){
        v.accessories=v.accessories.filter(function(x){return x.id!==da.id;});
        save();render();
      }
      return;
    }
    if(act==='asave'){
      var f=document.querySelector('[data-aform="'+v.id+'"]');
      var rec={
        type:f.querySelector('.aType').value,
        name:f.querySelector('.aName').value.trim(),
        status:f.querySelector('.aStatus').value,
        modelNo:f.querySelector('.aModel').value.trim(),
        buyDate:f.querySelector('.aDate').value,
        price:f.querySelector('.aPrice').value,
        note:f.querySelector('.aNote').value.trim()
      };
      if(!rec.name){alert('名称を入力してください');f.querySelector('.aName').focus();return;}
      var ca=openA[v.id]===true?null:findA(v,openA[v.id]);
      if(ca){for(var k in rec)ca[k]=rec[k];}
      else{rec.id=uid();(v.accessories=v.accessories||[]).push(rec);}
      delete openA[v.id];save();render();
    }
  }
  $('list').onclick=function(e){
    var card=e.target.closest('.card-main');
    if(card){openDetail(card.dataset.open);return;}
    onAct(e);
  };
  $('detailSheet').onclick=function(e){
    if(e.target===this){this.close();return;}   // 外側（背景）を押したら閉じる
    onAct(e);
  };

  // バックアップ
  $('btnExport').onclick=function(){
    var blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='ipad-manager-'+ymd(new Date())+'.json';
    a.click();URL.revokeObjectURL(a.href);
  };
  $('fImport').onchange=function(){
    var f=this.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.devices))throw new Error();
        if(!confirm('現在のデータを、読み込んだ内容（'+d.devices.length+'台）で置き換えますか？'))return;
        data=d;save();render();
      }catch(e){alert('読み込めませんでした。書き出したJSONファイルを選んでください。');}
      $('fImport').value='';
    };
    r.readAsText(f);
  };

  // 印刷が終わったら通常表示に戻す
  window.addEventListener('afterprint',function(){
    document.body.classList.remove('printing');
    $('printArea').innerHTML='';
  });

  // ダークモード切り替え（自動 → ダーク → ライト）
  var THEME_KEY='ipad-manager-theme';
  var THEME_LABEL={auto:'表示：自動',dark:'表示：ダーク',light:'表示：ライト'};
  function getTheme(){try{return localStorage.getItem(THEME_KEY)||'auto';}catch(e){return 'auto';}}
  function applyTheme(t){
    if(t==='auto')document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme',t);
    $('btnTheme').textContent=THEME_LABEL[t];
  }
  $('btnTheme').onclick=function(){
    var n={auto:'dark',dark:'light',light:'auto'}[getTheme()];
    try{localStorage.setItem(THEME_KEY,n);}catch(e){}
    applyTheme(n);
  };
  applyTheme(getTheme());

  render();

  // クラウド同期（cloud-sync.js）。端末内が主で、ログイン中のみクラウドと合わせる
  if(window.CloudSync){
    cloud=CloudSync.init({
      appName:'iPad管理',
      key:'data-v1',
      getData:function(){return {devices:data.devices};},
      hasData:function(){return data.devices.length>0;},
      applyData:function(d){
        if(!d||!Array.isArray(d.devices))throw new Error('iPad管理のデータ形式が違います');
        data={devices:d.devices};
        try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
        editId=null;openA={};
        render();
      }
    });
  }

  // PWA：ホーム画面に追加・オフライン表示
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('ipad-sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
