<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPad管理</title>
<meta name="theme-color" content="#3d5a73">
<link rel="manifest" href="ipad-manifest.json">
<link rel="icon" href="ipad-icon-192.png">
<link rel="apple-touch-icon" href="ipad-icon-192.png">
<style>
  :root{
    --field:#fff;
    --paper:#f6f4ec;
    --ink:#23261f;
    --ink-soft:#5a5c50;
    --rule:#cfc9b4;
    --stamp-red:#a8382b;
    --stamp-red-bg:#f4e3df;
    --sage:#3d5a73;
    --sage-bg:#e1e9f0;
    --amber:#a1731f;
    --amber-bg:#f2e6cf;
    --card:#fffdf7;
    --shadow:0 1px 0 rgba(35,38,31,0.06);
  }
  /* ダークモード（端末の設定に合わせる。右上のボタンで固定も可） */
  @media screen and (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --field:#2d3027;--paper:#1c1e1a;--ink:#e8e6dc;--ink-soft:#a9aa9c;--rule:#4a4c42;
      --stamp-red:#e0796b;--stamp-red-bg:#3d2623;--sage:#8fb0cc;--sage-bg:#1f2a33;
      --amber:#d9a94a;--amber-bg:#3a2f17;--card:#25271f;--shadow:none;color-scheme:dark;
    }
    :root:not([data-theme="light"]) .stats{background:var(--rule);border-color:var(--rule);}
  }
  :root[data-theme="dark"]{
    --field:#2d3027;--paper:#1c1e1a;--ink:#e8e6dc;--ink-soft:#a9aa9c;--rule:#4a4c42;
    --stamp-red:#e0796b;--stamp-red-bg:#3d2623;--sage:#8fb0cc;--sage-bg:#1f2a33;
    --amber:#d9a94a;--amber-bg:#3a2f17;--card:#25271f;--shadow:none;color-scheme:dark;
  }
  :root[data-theme="dark"] .stats{background:var(--rule);border-color:var(--rule);}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Iowan Old Style","Noto Serif JP",Georgia,serif;line-height:1.6;min-height:100vh;padding:0 0 60px 0;}
  .wrap{max-width:960px;margin:0 auto;padding:36px 24px;}
  header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:28px;gap:16px;flex-wrap:wrap;}
  header h1{font-size:28px;letter-spacing:0.04em;margin:0;font-weight:600;}
  header .sub{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .date-today{font-size:13px;color:var(--ink-soft);}

  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--ink);border:1px solid var(--ink);margin-bottom:24px;}
  .stat{background:var(--card);padding:8px 14px;text-align:left;}
  .stat .num{font-size:20px;font-weight:600;line-height:1.3;}
  .stat .label{font-size:11px;color:var(--ink-soft);}
  .stat.overdue .num{color:var(--stamp-red);}
  .stat.soon .num{color:var(--amber);}

  .panel{background:var(--card);border:1px solid var(--rule);box-shadow:var(--shadow);margin-bottom:24px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--rule);gap:10px;flex-wrap:wrap;}
  .panel-head h2{font-size:16px;margin:0;}
  .panel-body{padding:18px;}
  details.add > summary{cursor:pointer;padding:14px 18px;font-size:16px;font-weight:600;list-style:none;}
  details.add > summary::-webkit-details-marker{display:none;}
  details.add > summary::before{content:"＋ ";}
  details.add[open] > summary{border-bottom:1px solid var(--rule);}
  .sec{font-size:12px;font-weight:600;color:var(--ink-soft);margin:6px 0 8px;padding-bottom:3px;border-bottom:1px dashed var(--rule);font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;}

  button{font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;cursor:pointer;border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 16px;font-size:13px;border-radius:2px;}
  button.ghost{background:transparent;color:var(--ink);}
  button.small{padding:5px 11px;font-size:12px;}
  button.danger{color:var(--stamp-red);border-color:var(--stamp-red);}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--stamp-red);outline-offset:1px;}
  input,select,textarea{font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;font-size:14px;padding:9px 10px;border:1px solid var(--rule);background:var(--field);color:var(--ink);border-radius:2px;width:100%;}
  label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-soft);font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;}
  .form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px;}
  .form-grid .w3{grid-column:1 / -1;}
  .form-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .img-pick{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;color:var(--ink-soft);font-family:-apple-system,sans-serif;}
  .img-pick img{width:64px;height:64px;object-fit:cover;border:1px solid var(--rule);}

  .dev{padding:16px 18px;border-top:1px solid var(--rule);}
  .dev:first-child{border-top:none;}
  .d-top{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:start;}
  .thumb{width:120px;height:120px;object-fit:cover;border:1px solid var(--rule);background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--rule);}
  .d-name{font-size:18px;font-weight:600;}
  .d-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .d-note{font-size:13px;margin-top:8px;white-space:pre-wrap;word-break:break-word;font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;}
  .badge{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:20px;margin-right:6px;font-family:-apple-system,sans-serif;}
  .badge.ok{background:var(--sage-bg);color:var(--sage);}
  .badge.soon{background:var(--amber-bg);color:var(--amber);}
  .badge.overdue{background:var(--stamp-red-bg);color:var(--stamp-red);}
  .badge.none{background:var(--paper);color:var(--ink-soft);border:1px solid var(--rule);}
  .d-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .empty{padding:28px 18px;text-align:center;color:var(--ink-soft);font-size:14px;}

  .a-box{margin-top:18px;border:1px solid var(--rule);background:var(--field);padding:12px 14px;}
  .a-head{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .a-toggle{background:transparent;color:var(--ink);border:none;padding:4px 2px;font-size:16px;font-weight:600;font-family:inherit;text-align:left;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
  .a-toggle .arrow{font-size:11px;color:var(--ink-soft);}
  .a-brief{font-size:12.5px;font-weight:400;color:var(--ink-soft);font-family:-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;margin-left:6px;}
  .a-list{list-style:none;margin:10px 0 0;padding:0;}
  .a-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:9px 0;border-bottom:1px dashed var(--rule);font-size:15px;}
  .a-item:last-child{border-bottom:none;}
  .a-row{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
  .a-row .t{font-weight:600;}
  .a-row .c{font-family:-apple-system,sans-serif;font-size:14px;margin-left:auto;white-space:nowrap;}
  .a-type{font-size:11.5px;padding:1px 8px;border-radius:20px;background:var(--paper);border:1px solid var(--rule);color:var(--ink-soft);font-family:-apple-system,sans-serif;}
  .a-sub{font-size:12.5px;color:var(--ink-soft);font-family:-apple-system,sans-serif;margin-top:2px;}
  .a-note{white-space:pre-wrap;word-break:break-word;}
  .a-btns{display:flex;gap:6px;}
  .a-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px;align-items:end;}
  .a-form .w2{grid-column:span 2;}
  .a-form .w4{grid-column:1 / -1;}

  .io-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;}
  .io-row input[type=file]{width:auto;}

  /* 印刷（iPadごとの「印刷」ボタンで、その1台だけを白黒向けに出力。売却時の提出用） */
  @media print{
    :root,:root[data-theme]{--field:#fff;--paper:#fff;--ink:#000;--ink-soft:#444;--rule:#999;--card:#fff;--sage:#222;--sage-bg:#fff;--amber:#222;--amber-bg:#fff;--stamp-red:#222;--stamp-red-bg:#fff;--shadow:none;color-scheme:light;}
    .no-print,.stats,details.add,.d-actions,.a-btns,.a-form,.a-box button,.a-toggle .arrow,#cs-btn,#cs-panel{display:none !important;}
    body{background:#fff;}
    .wrap{padding:0;max-width:none;}
    .panel{border:none;margin:0;}
    body.printing .dev:not(.print-target),body.printing .panel-head{display:none;}
    .dev{padding:0;}
    .a-item{break-inside:avoid;}
  }
  @media (max-width:640px){
    .a-box{padding:10px;}
    .a-btns{flex-direction:column;}
    .a-form{grid-template-columns:1fr 1fr;}
    .a-form .w2,.a-form .w4{grid-column:1 / -1;}
    .wrap{padding:20px 14px;}
    header h1{font-size:23px;}
    .form-grid{grid-template-columns:1fr;}
    .d-top{grid-template-columns:96px 1fr;gap:12px;}
    .thumb{width:96px;height:96px;}
    .stat{padding:6px 8px;}
    .stat .label{font-size:10px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>iPad管理</h1>
      <div class="sub">端末情報と保証期限をまとめて確認</div>
    </div>
    <div style="text-align:right">
      <div class="date-today" id="today"></div>
      <button type="button" class="ghost small no-print" id="btnTheme" style="margin-top:6px"></button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="stCount">0</div><div class="label">登録台数</div></div>
    <div class="stat soon"><div class="num" id="stSoon">0</div><div class="label">保証が間もなく切れる（30日以内）</div></div>
    <div class="stat overdue"><div class="num" id="stOver">0</div><div class="label">保証切れ</div></div>
  </div>

  <div class="panel">
    <details class="add" id="addPanel">
      <summary id="formTitle">iPadを登録する</summary>
      <div class="panel-body">
        <div class="img-pick">
          <img id="imgPrev" alt="" style="display:none">
          <input type="file" id="fImage" accept="image/*" style="width:auto">
          <button type="button" class="ghost small" id="btnImgClear" style="display:none">写真を外す</button>
        </div>

        <div class="sec">基本</div>
        <div class="form-grid">
          <label class="f">呼び名（必須）<input id="fName" maxlength="30" placeholder="例：リビング用"></label>
          <label class="f">機種
            <select id="fModel">
              <option value="">選んでください</option>
              <option>iPad</option><option>iPad Air</option><option>iPad mini</option><option>iPad Pro</option><option>その他</option>
            </select>
          </label>
          <label class="f">世代・サイズ<input id="fGen" maxlength="30" placeholder="例：第10世代 / 11インチ"></label>
          <label class="f">型番<input id="fModelNo" maxlength="30" placeholder="例：MPQ03J/A"></label>
          <label class="f">容量
            <select id="fCapacity">
              <option value="">選んでください</option>
              <option>32GB</option><option>64GB</option><option>128GB</option><option>256GB</option><option>512GB</option><option>1TB</option><option>2TB</option>
            </select>
          </label>
          <label class="f">色<input id="fColor" maxlength="20" placeholder="例：シルバー"></label>
          <label class="f">回線
            <select id="fNetwork"><option>Wi-Fi</option><option>Wi-Fi + Cellular</option></select>
          </label>
          <label class="f">状態
            <select id="fStatus"><option>使用中</option><option>予備</option><option>修理中</option><option>売却済み</option></select>
          </label>
          <label class="f">置き場所・用途<input id="fPlace" maxlength="30" placeholder="例：リビング・動画用"></label>
        </div>

        <div class="sec">識別情報</div>
        <div class="form-grid">
          <label class="f">シリアル番号<input id="fSerial" maxlength="30"></label>
          <label class="f">iPadOSのバージョン<input id="fOs" maxlength="20" placeholder="例：18.1"></label>
        </div>

        <div class="sec">購入・保証</div>
        <div class="form-grid">
          <label class="f">購入日<input type="date" id="fBuyDate"></label>
          <label class="f">購入店<input id="fShop" maxlength="30" placeholder="例：Apple Store"></label>
          <label class="f">購入金額（円）<input type="number" min="0" inputmode="numeric" id="fPrice"></label>
          <label class="f">保証期限<input type="date" id="fWarranty"></label>
          <label class="f">AppleCare+
            <select id="fCare"><option>未加入</option><option>加入</option></select>
          </label>
        </div>

        <div class="form-grid">
          <label class="f w3">メモ（改行できます）<textarea id="fNote" rows="3" maxlength="500"></textarea></label>
        </div>

        <div class="form-actions">
          <button type="button" id="btnSave">登録する</button>
          <button type="button" class="ghost" id="btnCancel" style="display:none">編集をやめる</button>
        </div>
      </div>
    </details>
  </div>

  <div class="panel">
    <div class="panel-head"><h2>iPad一覧</h2></div>
    <div id="list"></div>
  </div>

  <div class="panel no-print">
    <div class="panel-head"><h2>バックアップ</h2></div>
    <div class="panel-body">
      <div class="io-row">
        <button type="button" class="ghost small" id="btnExport">書き出す（JSON）</button>
        <label>読み込む：<input type="file" id="fImport" accept="application/json"></label>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cloud-sync.js"></script>
<script>
(function(){
  var KEY='ipad-manager-data';
  var data=load();
  var editId=null;   // 編集中のiPadのID
  var imgData='';    // フォーム上の写真
  var cloud=null;    // 同期モジュール（cloud-sync.js）
  var openA={};      // アクセサリーのフォーム（true=追加 / 記録ID=編集）
  var ATYPES=['ケース・カバー','保護フィルム','Apple Pencil','キーボード','充電器・ケーブル','スタンド','イヤホン・ヘッドホン','その他'];
  var ASTATUS=['使用中','故障','廃棄'];
  // アクセサリーの折りたたみ状態（この端末の表示設定のみ）
  var COLL_KEY='ipad-manager-collapsed';
  var collA=(function(){try{return JSON.parse(localStorage.getItem(COLL_KEY))||{};}catch(e){return {};}})();
  function saveColl(){try{localStorage.setItem(COLL_KEY,JSON.stringify(collA));}catch(e){}}

  function load(){
    try{
      var d=JSON.parse(localStorage.getItem(KEY));
      if(d&&Array.isArray(d.devices))return d;
    }catch(e){}
    return {devices:[]};
  }
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(data));if(cloud)cloud.notifyChanged();}
    catch(e){alert('保存できませんでした（容量が足りない可能性があります）');}
  }
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function $(id){return document.getElementById(id);}

  // 日付（時刻を除いた日数差）
  function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  function daysLeft(due){
    var a=new Date(due+'T00:00:00'),b=new Date(ymd(new Date())+'T00:00:00');
    return Math.round((a-b)/86400000);
  }
  function level(n){return n<0?'overdue':(n<=30?'soon':'ok');}
  function leftText(n){
    if(n<0)return Math.abs(n)+'日超過';
    if(n===0)return '今日まで';
    return 'あと'+n+'日';
  }

  // 写真を縮小してJPEGにする
  function shrink(file,cb){
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var max=600,s=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement('canvas');
        c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        cb(c.toDataURL('image/jpeg',0.8));
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  }

  function showImg(){
    $('imgPrev').style.display=imgData?'block':'none';
    $('imgPrev').src=imgData||'';
    $('btnImgClear').style.display=imgData?'inline-block':'none';
  }
  $('fImage').onchange=function(){
    var f=this.files[0];if(!f)return;
    shrink(f,function(u){imgData=u;showImg();});
  };
  $('btnImgClear').onclick=function(){imgData='';$('fImage').value='';showImg();};

  // [フォームのID, データのキー, 初期値]
  var FIELDS=[
    ['fName','name',''],['fModel','model',''],['fGen','gen',''],['fModelNo','modelNo',''],
    ['fCapacity','capacity',''],['fColor','color',''],['fNetwork','network','Wi-Fi'],['fStatus','status','使用中'],
    ['fPlace','place',''],['fSerial','serial',''],['fOs','os',''],
    ['fBuyDate','buyDate',''],['fShop','shop',''],['fPrice','price',''],['fWarranty','warranty',''],['fCare','care','未加入'],
    ['fNote','note','']
  ];

  function resetForm(){
    editId=null;imgData='';
    FIELDS.forEach(function(p){$(p[0]).value=p[2];});
    $('fImage').value='';showImg();
    $('formTitle').textContent='iPadを登録する';
    $('btnSave').textContent='登録する';
    $('btnCancel').style.display='none';
  }
  $('btnCancel').onclick=function(){resetForm();$('addPanel').open=false;};

  $('btnSave').onclick=function(){
    var name=$('fName').value.trim();
    if(!name){alert('呼び名を入力してください');$('fName').focus();return;}
    var v=editId?find(editId):null;
    if(!v){
      v={id:uid()};data.devices.push(v);
    }
    FIELDS.forEach(function(p){v[p[1]]=$(p[0]).value.trim();});
    v.image=imgData;
    save();resetForm();$('addPanel').open=false;render();
  };

  function find(id){
    for(var i=0;i<data.devices.length;i++)if(data.devices[i].id===id)return data.devices[i];
    return null;
  }

  function startEdit(id){
    var v=find(id);if(!v)return;
    editId=id;imgData=v.image||'';
    FIELDS.forEach(function(p){$(p[0]).value=v[p[1]]!=null&&v[p[1]]!==''?v[p[1]]:p[2];});
    showImg();
    $('formTitle').textContent='iPadを編集する';
    $('btnSave').textContent='保存する';
    $('btnCancel').style.display='inline-block';
    $('addPanel').open=true;
    $('addPanel').scrollIntoView({behavior:'smooth',block:'start'});
  }

  // 保証の状態（売却済みは対象外）
  function warrantyOf(v){
    if(v.status==='売却済み'||!v.warranty)return null;
    return daysLeft(v.warranty);
  }

  function render(){
    $('today').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
    var soon=0,over=0;
    data.devices.forEach(function(v){
      var n=warrantyOf(v);
      if(n===null)return;
      var l=level(n);
      if(l==='soon')soon++;else if(l==='overdue')over++;
    });
    $('stCount').textContent=data.devices.length;
    $('stSoon').textContent=soon;
    $('stOver').textContent=over;

    if(!data.devices.length){
      $('list').innerHTML='<div class="empty">まだiPadが登録されていません。上の「iPadを登録する」から追加してください。</div>';
      return;
    }
    $('list').innerHTML=data.devices.map(deviceHtml).join('');
  }

  function deviceHtml(v){
    var n=warrantyOf(v),badge;
    if(n!==null){
      badge='<span class="badge '+level(n)+'">'+(v.care==='加入'?'AppleCare+ ':'保証 ')+'：'+leftText(n)+'</span>';
    }else if(v.status==='売却済み'){
      badge='<span class="badge none">売却済み</span>';
    }else{
      badge='<span class="badge none">保証期限の登録なし</span>';
    }
    var meta=[v.model,v.gen,v.capacity,v.color,v.network].filter(Boolean).join(' / ');
    var meta2=[v.status,v.place].filter(Boolean).join(' ・ ');
    var meta3=[v.modelNo?'型番 '+v.modelNo:'',v.serial?'シリアル '+v.serial:'',v.os?'iPadOS '+v.os:''].filter(Boolean).join(' ・ ');
    var meta4=[v.buyDate?'購入 '+v.buyDate:'',v.shop,v.price?Number(v.price).toLocaleString()+'円':'',v.warranty?'保証期限 '+v.warranty:''].filter(Boolean).join(' ・ ');
    var thumb=v.image?'<img class="thumb" src="'+v.image+'" alt="">':'<div class="thumb">📱</div>';
    return '<div class="dev" data-did="'+v.id+'"><div class="d-top">'+thumb+'<div>'
      +'<div class="d-name">'+esc(v.name)+'</div>'
      +(meta?'<div class="d-meta">'+esc(meta)+'</div>':'')
      +(meta2?'<div class="d-meta">'+esc(meta2)+'</div>':'')
      +(meta3?'<div class="d-meta">'+esc(meta3)+'</div>':'')
      +(meta4?'<div class="d-meta">'+esc(meta4)+'</div>':'')
      +'<div style="margin-top:6px">'+badge+'</div>'
      +(v.note?'<div class="d-note">'+esc(v.note)+'</div>':'')
      +'<div class="d-actions"><button class="ghost small" data-act="edit" data-d="'+v.id+'">編集</button>'
      +'<button class="ghost small" data-act="print" data-d="'+v.id+'">この端末を印刷</button>'
      +'<button class="ghost small danger" data-act="del" data-d="'+v.id+'">削除</button></div>'
      +'</div></div>'+accHtml(v)+'</div>';
  }

  function findA(v,id){
    var a=v.accessories||[];
    for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];
    return null;
  }

  // アクセサリー（使用中のものを先に、あとは購入日の新しい順）
  function accHtml(v){
    var all=(v.accessories||[]).slice().sort(function(a,b){
      var ra=a.status==='使用中'?0:1,rb=b.status==='使用中'?0:1;
      if(ra!==rb)return ra-rb;
      return (a.buyDate||'')<(b.buyDate||'')?1:((a.buyDate||'')>(b.buyDate||'')?-1:0);
    });
    var using=all.filter(function(a){return a.status==='使用中';});
    var total=using.reduce(function(s,a){return s+(Number(a.price)||0);},0);
    var folded=!!collA[v.id];
    var h='<div class="a-box"><div class="a-head"><button type="button" class="a-toggle" data-act="atoggle" data-d="'+v.id+'" aria-expanded="'+(!folded)+'">'
      +'<span class="arrow">'+(folded?'▶':'▼')+'</span> 🎒 アクセサリー'
      +(all.length?'<span class="a-brief">使用中 '+using.length+'点・'+total.toLocaleString()+'円</span>':'')+'</button>'
      +'<button class="small" data-act="aadd" data-d="'+v.id+'">＋ 追加</button></div>';
    if(folded)return h+'</div>';
    if(!all.length&&!openA[v.id])h+='<div class="a-sub" style="margin-top:8px">まだアクセサリーがありません。「追加」から登録してください。</div>';
    h+='<ul class="a-list">'+all.map(function(a){
      var sub=[a.modelNo?'型番 '+a.modelNo:'',a.buyDate?'購入 '+a.buyDate:''].filter(Boolean).join(' ・ ');
      return '<li class="a-item"><div><div class="a-row"><span class="a-type">'+esc(a.type||'その他')+'</span><span class="t">'+esc(a.name)+'</span>'
        +(a.status&&a.status!=='使用中'?'<span class="badge '+(a.status==='故障'?'overdue':'none')+'">'+esc(a.status)+'</span>':'')
        +(a.price?'<span class="c">'+Number(a.price).toLocaleString()+'円</span>':'')+'</div>'
        +(sub?'<div class="a-sub">'+esc(sub)+'</div>':'')
        +(a.note?'<div class="a-sub a-note">'+esc(a.note)+'</div>':'')
        +'</div><div class="a-btns"><button class="ghost small" data-act="aedit" data-d="'+v.id+'" data-a="'+a.id+'">編集</button>'
        +'<button class="ghost small danger" data-act="adel" data-d="'+v.id+'" data-a="'+a.id+'">削除</button></div></li>';
    }).join('')+'</ul>';
    if(openA[v.id]){
      var oa=openA[v.id]===true?null:findA(v,openA[v.id]);
      var g=function(k){return oa&&oa[k]!=null?esc(oa[k]):'';};
      var tOpts=ATYPES.map(function(t){return '<option'+(oa&&oa.type===t?' selected':'')+'>'+t+'</option>';}).join('');
      var sOpts=ASTATUS.map(function(s){return '<option'+(oa&&oa.status===s?' selected':'')+'>'+s+'</option>';}).join('');
      h+='<div class="a-form" data-aform="'+v.id+'">'
        +'<label class="f">種類<select class="aType">'+tOpts+'</select></label>'
        +'<label class="f w2">名称（必須）<input class="aName" maxlength="40" placeholder="例：Apple Pencil 第2世代" value="'+g('name')+'"></label>'
        +'<label class="f">状態<select class="aStatus">'+sOpts+'</select></label>'
        +'<label class="f w2">型番<input class="aModel" maxlength="30" value="'+g('modelNo')+'"></label>'
        +'<label class="f">購入日<input type="date" class="aDate" value="'+g('buyDate')+'"></label>'
        +'<label class="f">金額（円）<input type="number" min="0" inputmode="numeric" class="aPrice" value="'+g('price')+'"></label>'
        +'<label class="f w4">メモ（互換性・購入先など。改行できます）<textarea class="aNote" rows="2" maxlength="300">'+g('note')+'</textarea></label>'
        +'<button class="small" data-act="asave" data-d="'+v.id+'">'+(oa?'保存':'登録する')+'</button>'
        +'<button class="ghost small" data-act="acancel" data-d="'+v.id+'">やめる</button></div>';
    }
    return h+'</div>';
  }

  $('list').onclick=function(e){
    var b=e.target.closest('button[data-act]');if(!b)return;
    var v=find(b.dataset.d);if(!v)return;
    var act=b.dataset.act;
    if(act==='edit'){startEdit(v.id);return;}
    if(act==='print'){
      // アクセサリーを開いた状態で、この1台だけを印刷する
      collA[v.id]=false;render();
      document.body.classList.add('printing');
      document.querySelector('[data-did="'+v.id+'"]').classList.add('print-target');
      window.print();
      return;
    }
    if(act==='del'){
      if(confirm('「'+v.name+'」を削除しますか？アクセサリーの記録も消えます。')){
        data.devices=data.devices.filter(function(x){return x.id!==v.id;});
        save();render();
      }
      return;
    }
    if(act==='atoggle'){collA[v.id]=!collA[v.id];saveColl();render();return;}
    if(act==='aadd'){openA[v.id]=true;if(collA[v.id]){collA[v.id]=false;saveColl();}render();return;}
    if(act==='aedit'){openA[v.id]=b.dataset.a;render();return;}
    if(act==='acancel'){delete openA[v.id];render();return;}
    if(act==='adel'){
      var da=findA(v,b.dataset.a);
      if(da&&confirm('「'+da.name+'」を削除しますか？')){
        v.accessories=v.accessories.filter(function(x){return x.id!==da.id;});
        save();render();
      }
      return;
    }
    if(act==='asave'){
      var f=document.querySelector('[data-aform="'+v.id+'"]');
      var rec={
        type:f.querySelector('.aType').value,
        name:f.querySelector('.aName').value.trim(),
        status:f.querySelector('.aStatus').value,
        modelNo:f.querySelector('.aModel').value.trim(),
        buyDate:f.querySelector('.aDate').value,
        price:f.querySelector('.aPrice').value,
        note:f.querySelector('.aNote').value.trim()
      };
      if(!rec.name){alert('名称を入力してください');f.querySelector('.aName').focus();return;}
      var ca=openA[v.id]===true?null:findA(v,openA[v.id]);
      if(ca){for(var k in rec)ca[k]=rec[k];}
      else{rec.id=uid();(v.accessories=v.accessories||[]).push(rec);}
      delete openA[v.id];save();render();
    }
  };

  // バックアップ
  $('btnExport').onclick=function(){
    var blob=new Blob([JSON.stringify(data)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='ipad-manager-'+ymd(new Date())+'.json';
    a.click();URL.revokeObjectURL(a.href);
  };
  $('fImport').onchange=function(){
    var f=this.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.devices))throw new Error();
        if(!confirm('現在のデータを、読み込んだ内容（'+d.devices.length+'台）で置き換えますか？'))return;
        data=d;save();render();
      }catch(e){alert('読み込めませんでした。書き出したJSONファイルを選んでください。');}
      $('fImport').value='';
    };
    r.readAsText(f);
  };

  // 印刷が終わったら通常表示に戻す
  window.addEventListener('afterprint',function(){
    document.body.classList.remove('printing');
    var t=document.querySelector('.print-target');if(t)t.classList.remove('print-target');
  });

  // ダークモード切り替え（自動 → ダーク → ライト）
  var THEME_KEY='ipad-manager-theme';
  var THEME_LABEL={auto:'表示：自動',dark:'表示：ダーク',light:'表示：ライト'};
  function getTheme(){try{return localStorage.getItem(THEME_KEY)||'auto';}catch(e){return 'auto';}}
  function applyTheme(t){
    if(t==='auto')document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme',t);
    $('btnTheme').textContent=THEME_LABEL[t];
  }
  $('btnTheme').onclick=function(){
    var n={auto:'dark',dark:'light',light:'auto'}[getTheme()];
    try{localStorage.setItem(THEME_KEY,n);}catch(e){}
    applyTheme(n);
  };
  applyTheme(getTheme());

  render();

  // クラウド同期（cloud-sync.js）。端末内が主で、ログイン中のみクラウドと合わせる
  if(window.CloudSync){
    cloud=CloudSync.init({
      appName:'iPad管理',
      key:'data-v1',
      getData:function(){return {devices:data.devices};},
      hasData:function(){return data.devices.length>0;},
      applyData:function(d){
        if(!d||!Array.isArray(d.devices))throw new Error('iPad管理のデータ形式が違います');
        data={devices:d.devices};
        try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}
        editId=null;openA={};
        render();
      }
    });
  }

  // PWA：ホーム画面に追加・オフライン表示
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('ipad-sw.js').catch(function(){});
  }
})();
</script>
</body>
</html>
