<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定期券マネージャー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F4F5F7;
    --ink: #1B2333;
    --ink-soft: #5B6478;
    --paper: #FFFFFF;
    --line: #D7DBE3;
    --ok: #2E7D5B;
    --warn: #C97A1A;
    --danger: #C0392B;
    --track: #1B2333;
    --radius: 14px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    line-height:1.6;
    min-height:100vh;
  }
  .app{
    max-width:920px;
    margin:0 auto;
    padding:32px 20px 80px;
  }

  /* ---------- Header ---------- */
  .app-header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    margin-bottom:28px;
    border-bottom:3px solid var(--ink);
    padding-bottom:16px;
  }
  .app-header h1{
    font-size:26px;
    font-weight:900;
    margin:0;
    letter-spacing:.02em;
  }
  .app-header .sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .add-btn{
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:11px 22px;
    font-size:14px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
    transition:transform .12s ease, background .12s ease;
  }
  .add-btn:hover{ background:#333d54; transform:translateY(-1px); }
  .add-btn:active{ transform:translateY(0); }

  .header-actions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }

  .autosave-bar{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:20px;
    padding:9px 14px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--paper);
  }
  .autosave-dot{
    width:8px; height:8px;
    border-radius:50%;
    background:#B9BFCB;
    flex-shrink:0;
  }
  .autosave-dot.on{ background:var(--ok); }
  .autosave-dot.pending{ background:var(--warn); }
  #autosaveStatus{ margin-right:auto; }
  .btn-secondary.sm{
    padding:5px 12px;
    font-size:12px;
  }

  /* ---------- Mini calendar ---------- */
  .calendar-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px 18px 12px;
    margin-bottom:20px;
  }
  .calendar-head{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:18px;
    margin-bottom:12px;
  }
  .cal-title{
    font-size:14.5px;
    font-weight:700;
    min-width:110px;
    text-align:center;
    font-family:'Space Mono', monospace;
  }
  .cal-nav{
    width:26px; height:26px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--ink-soft);
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    line-height:1;
  }
  .cal-nav:hover{ border-color:var(--ink); color:var(--ink); }
  .calendar-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    font-weight:700;
    margin-bottom:4px;
  }
  .calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:3px;
  }
  .cal-day{
    min-height:56px;
    border-radius:8px;
    padding:4px 3px;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  /* 一覧用の .empty（余白・破線）が効かないように打ち消す */
  .cal-day.empty{ background:transparent; padding:0; border:none; border-radius:0; }
  .cal-day.today{ box-shadow:inset 0 0 0 1.5px var(--ink); }
  .cal-day .cal-num{
    font-size:10.5px;
    font-family:'Space Mono', monospace;
    color:var(--ink-soft);
    text-align:center;
  }
  .cal-day.today .cal-num{ color:var(--ink); font-weight:700; }
  .cal-pill{
    font-size:9.5px;
    font-weight:700;
    color:#fff;
    background:var(--ink);
    border-radius:5px;
    padding:1px 4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
  }
  .cal-pill.more{
    background:none;
    color:var(--ink-soft);
    font-weight:700;
    text-align:center;
    cursor:default;
  }

  /* ---------- Summary strip ---------- */
  .summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    margin-bottom:28px;
  }
  .summary-cell{
    background:var(--paper);
    padding:10px 16px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .summary-cell .label{
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:0;
    white-space:nowrap;
  }
  .summary-cell .value{
    font-family:'Space Mono', monospace;
    font-size:17px;
    font-weight:700;
  }
  .summary-cell.warn .value{ color:var(--warn); }

  /* ---------- Member filter ---------- */
  .filter-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .sort-select{
    padding:7px 12px;
    border:1.5px solid var(--line);
    border-radius:999px;
    font-family:inherit;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    background:var(--paper);
    cursor:pointer;
    flex-shrink:0;
  }
  .sort-select:focus{
    outline:2px solid var(--ink);
    outline-offset:1px;
  }
  .member-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 14px 7px 10px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:var(--paper);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    color:var(--ink-soft);
    font-family:inherit;
    transition:border-color .12s ease, color .12s ease;
  }
  .chip .dot{
    width:9px; height:9px; border-radius:50%;
    flex-shrink:0;
  }
  .chip.active{
    border-color:var(--ink);
    color:var(--ink);
    font-weight:700;
  }

  /* ---------- Ticket list ---------- */
  .list{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
  }
  .empty .big{
    font-size:15px;
    color:var(--ink);
    font-weight:700;
    margin-bottom:6px;
  }

  .ticket{
    position:relative;
    background:var(--paper);
    border-radius:var(--radius);
    border:1px solid var(--line);
    display:grid;
    grid-template-columns:5px 1fr auto;
    overflow:hidden;
  }
  .ticket .stripe{ background:var(--member-color, var(--ink)); }
  .ticket-body{ padding:16px 18px; min-width:0; }
  .ticket-top{
    display:flex;
    align-items:baseline;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .member-tag{
    font-size:11.5px;
    font-weight:700;
    padding:2px 9px;
    border-radius:999px;
    color:#fff;
    background:var(--member-color, var(--ink));
  }
  .route{
    font-size:16.5px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .status-tag{
    margin-left:auto;
    font-size:11.5px;
    font-weight:700;
    padding:3px 10px;
    border-radius:999px;
  }
  .status-ok{ background:#E4F1EA; color:var(--ok); }
  .status-warn{ background:#FBEBD6; color:var(--warn); }
  .status-danger{ background:#F8E2DE; color:var(--danger); }

  .timeline{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Space Mono', monospace;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  .timeline .start-date{ flex-shrink:0; }
  .timeline .track{
    flex:1;
    height:8px;
    background:var(--line);
    border-radius:999px;
    position:relative;
    min-width:90px;
  }
  .timeline .track .fill{
    position:absolute; left:0; top:0; bottom:0;
    background:var(--member-color, var(--ink));
    border-radius:999px;
    transition:width .2s ease;
  }
  .timeline .track .marker{
    position:absolute;
    top:50%;
    width:14px; height:14px;
    background:#fff;
    border:3px solid var(--member-color, var(--ink));
    border-radius:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 0 2px #fff;
  }
  .timeline .end-date{ color:var(--ink); font-weight:700; flex-shrink:0; }
  .timeline .pct-label{
    font-size:13px;
    font-weight:800;
    color:var(--member-color, var(--ink));
    background:color-mix(in srgb, var(--member-color, var(--ink)) 14%, white);
    flex-shrink:0;
    padding:3px 10px;
    border-radius:999px;
    text-align:center;
    white-space:nowrap;
  }

  .meta-row{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:8px;
  }
  .meta-row b{
    color:var(--ink);
    font-family:'Space Mono', monospace;
    font-weight:700;
  }

  .ticket-actions{
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:6px;
    padding:16px 14px;
    border-left:1px dashed var(--line);
  }
  .icon-btn{
    border:none;
    background:none;
    cursor:pointer;
    font-size:12.5px;
    color:var(--ink-soft);
    font-family:inherit;
    text-align:right;
    padding:2px 4px;
  }
  .icon-btn:hover{ color:var(--ink); }
  .icon-btn.danger:hover{ color:var(--danger); }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(27,35,51,.45);
    display:none;
    align-items:flex-start;
    justify-content:center;
    padding:40px 16px;
    overflow-y:auto;
    z-index:50;
  }
  .overlay.show{ display:flex; }
  .modal{
    background:var(--paper);
    border-radius:16px;
    width:100%;
    max-width:460px;
    padding:26px 24px 24px;
  }
  .modal h2{
    margin:0 0 18px;
    font-size:19px;
    font-weight:900;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:var(--ink-soft);
    margin-bottom:5px;
  }
  .field input, .field select{
    width:100%;
    padding:10px 11px;
    border:1.5px solid var(--line);
    border-radius:9px;
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    background:var(--paper);
  }
  .field input:focus, .field select:focus{
    outline:2px solid var(--ink);
    outline-offset:1px;
  }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .color-picker{ display:flex; gap:8px; flex-wrap:wrap; }
  .color-swatch{
    width:28px; height:28px; border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
  }
  .color-swatch.selected{ border-color:var(--ink); }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
  }
  .btn-secondary{
    background:none;
    border:1.5px solid var(--line);
    border-radius:999px;
    padding:9px 18px;
    font-size:13.5px;
    font-weight:700;
    font-family:inherit;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .btn-primary{
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:999px;
    padding:9px 20px;
    font-size:13.5px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }

  @media (max-width:520px){
    .app-header{ flex-wrap:wrap; }
    .header-actions{ width:100%; }
    .cal-day{ min-height:42px; }
    .cal-pill{ font-size:8.5px; padding:1px 3px; }
    .timeline{ flex-wrap:wrap; row-gap:4px; }
    .timeline .track{ order:3; flex-basis:100%; }
    .ticket{ grid-template-columns:5px 1fr; }
    .ticket-actions{
      border-left:none;
      border-top:1px dashed var(--line);
      flex-direction:row;
      justify-content:flex-end;
      grid-column:1 / -1;
    }
    .summary{ grid-template-columns:1fr; }
    .two-col{ grid-template-columns:1fr; }
  }

  .visually-hidden{
    position:absolute; width:1px; height:1px;
    overflow:hidden; clip:rect(0,0,0,0);
  }
</style>
</head>
<body>
<div class="app">

  <div class="app-header">
    <div>
      <h1>定期券マネージャー</h1>
      <div class="sub">家族の定期券をまとめて管理</div>
    </div>
    <div class="header-actions">
      <button class="btn-secondary" id="exportBtn">エクスポート</button>
      <button class="btn-secondary" id="importBtn" type="button">インポート</button>
      <input type="file" id="importInput" accept="application/json" class="visually-hidden">
      <button class="add-btn" id="openAdd">＋ 定期券を追加</button>
    </div>
  </div>

  <div class="autosave-bar" id="autosaveBar">
    <span id="autosaveDot" class="autosave-dot"></span>
    <span id="autosaveStatus">自動保存ファイル：未設定</span>
    <button class="btn-secondary sm" id="autosaveBtn">保存先を選択</button>
    <button class="btn-secondary sm" id="autosaveOffBtn" style="display:none;">解除</button>
  </div>

  <div class="autosave-bar" id="ioFolderBar">
    <span id="ioFolderDot" class="autosave-dot"></span>
    <span id="ioFolderStatus">書き出し・読み込みフォルダ：未設定</span>
    <button class="btn-secondary sm" id="ioFolderBtn">フォルダを選択</button>
    <button class="btn-secondary sm" id="ioFolderOffBtn" style="display:none;">解除</button>
  </div>

  <div class="calendar-card">
    <div class="calendar-head">
      <button class="cal-nav" id="calPrev" aria-label="前の月">‹</button>
      <div class="cal-title" id="calTitle"></div>
      <button class="cal-nav" id="calNext" aria-label="次の月">›</button>
    </div>
    <div class="calendar-weekdays">
      <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <div class="summary">
    <div class="summary-cell">
      <div class="label">登録件数</div>
      <div class="value" id="statTotal">0</div>
    </div>
    <div class="summary-cell warn">
      <div class="label">期限14日以内</div>
      <div class="value" id="statWarn">0</div>
    </div>
    <div class="summary-cell">
      <div class="label">合計金額</div>
      <div class="value" id="statSum">¥0</div>
    </div>
  </div>

  <div class="filter-row">
    <div class="member-row" id="memberRow"></div>
    <select class="sort-select" id="sortSelect">
      <option value="end-asc">有効期限が近い順</option>
      <option value="end-desc">有効期限が遠い順</option>
      <option value="start-desc">開始日が新しい順</option>
      <option value="start-asc">開始日が古い順</option>
    </select>
  </div>

  <div class="list" id="list"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">定期券を追加</h2>
    <form id="ticketForm">
      <div class="field">
        <label for="f-member">利用者名</label>
        <input type="text" id="f-member" placeholder="例：花子" required list="memberSuggestions">
        <datalist id="memberSuggestions"></datalist>
      </div>
      <div class="field">
        <label>ラベルカラー</label>
        <div class="color-picker" id="colorPicker"></div>
      </div>
      <div class="field">
        <label for="f-route">区間（例：新宿 〜 渋谷）</label>
        <input type="text" id="f-route" placeholder="新宿 〜 渋谷" required>
      </div>
      <div class="two-col">
        <div class="field">
          <label for="f-start">使用開始日</label>
          <input type="date" id="f-start" required>
        </div>
        <div class="field">
          <label for="f-period">期間</label>
          <select id="f-period">
            <option value="1">1ヶ月</option>
            <option value="3">3ヶ月</option>
            <option value="6" selected>6ヶ月</option>
          </select>
        </div>
      </div>
      <div class="two-col">
        <div class="field">
          <label for="f-end">有効期限（自動計算・変更可）</label>
          <input type="date" id="f-end" required>
        </div>
        <div class="field">
          <label for="f-price">金額（円）</label>
          <input type="number" id="f-price" min="0" step="1" placeholder="18900" required>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelBtn">キャンセル</button>
        <button type="submit" class="btn-primary" id="submitBtn">保存する</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  const COLORS = ['#2B6CB8','#2E9E5B','#C97A1A','#C0392B','#7A5CC9','#1B8A8A'];
  let passes = [];
  let activeMember = 'all';
  let sortMode = 'end-asc';
  const today = new Date();
  let calYear = today.getFullYear();
  let calMonth = today.getMonth(); // 0-11
  let editingId = null;
  let selectedColor = COLORS[0];
  let lastFocus = null;

  const $ = (sel) => document.querySelector(sel);

  const listEl = $('#list');
  const memberRow = $('#memberRow');
  const overlay = $('#overlay');
  const form = $('#ticketForm');
  const colorPicker = $('#colorPicker');

  // 日付はすべてローカル時間で扱う（UTC変換による1日ずれを防ぐ）
  function fmtISO(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
  function parseISO(s){
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y, m-1, d);
  }
  function todayISO(){ return fmtISO(new Date()); }

  function addMonths(dateStr, months){
    const d = parseISO(dateStr);
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + Number(months));
    // 月末の繰り上がりを防ぐ（例：8/31＋1ヶ月 → 9/30）
    const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, last));
    return fmtISO(d);
  }

  function daysUntil(dateStr){
    const end = parseISO(dateStr);
    const now = new Date(); now.setHours(0,0,0,0);
    return Math.round((end - now) / 86400000);
  }

  function statusOf(dateStr){
    const d = daysUntil(dateStr);
    if(d < 0) return 'danger';
    if(d <= 14) return 'warn';
    return 'ok';
  }

  function statusLabel(dateStr){
    const d = daysUntil(dateStr);
    if(d < 0) return '期限切れ';
    if(d === 0) return '本日まで';
    if(d <= 14) return `あと${d}日`;
    return '有効';
  }

  function fmtDate(s){
    const [y,m,d] = s.split('-');
    return `${y}/${Number(m)}/${Number(d)}`;
  }

  function fmtYen(n){
    return '¥' + Number(n).toLocaleString('ja-JP');
  }

  function colorForMember(name){
    const existing = passes.find(p => p.member === name);
    if(existing) return existing.color;
    return null;
  }

  function uniqueMembers(){
    const map = new Map();
    passes.forEach(p => { if(!map.has(p.member)) map.set(p.member, p.color); });
    return map;
  }

  // ---------- Persistence (localStorage + auto-save file) ----------
  const STORAGE_KEY = 'teiki-manager:passes';
  const fsSupported = 'showSaveFilePicker' in window;
  let fileHandle = null;

  const BACKUP_KEY = 'teiki-manager:backup';
  const COLOR_RE = /^#[0-9A-Fa-f]{6}$/;
  const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  // 外部データ（インポート・保存ファイル）を検証して安全な形に整える
  function sanitizePass(p){
    if(!p || typeof p !== 'object') return null;
    const member = String(p.member || '').trim();
    const route = String(p.route || '').trim();
    if(!member || !route) return null;
    if(!DATE_RE.test(p.start) || !DATE_RE.test(p.end)) return null;
    const period = Number(p.period);
    const price = Number(p.price);
    return {
      id: (typeof p.id === 'string' && /^[\w-]+$/.test(p.id)) ? p.id : newId(),
      member,
      color: COLOR_RE.test(p.color) ? p.color : COLORS[0],
      route,
      start: p.start,
      period: String(Number.isFinite(period) && period > 0 ? period : 1),
      end: p.end,
      price: Number.isFinite(price) && price >= 0 ? price : 0
    };
  }

  function backupCurrent(){
    if(passes.length === 0) return;
    try{ localStorage.setItem(BACKUP_KEY, JSON.stringify(passes)); }catch(e){}
  }

  function loadPasses(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      passes = Array.isArray(arr) ? arr.map(sanitizePass).filter(Boolean) : [];
    }catch(e){
      console.error('読み込みに失敗しました', e);
      passes = [];
    }
    render();
  }

  let saveErrorShown = false;
  function savePasses(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(passes));
      saveErrorShown = false;
    }catch(e){
      console.error('保存に失敗しました', e);
      if(!saveErrorShown){
        saveErrorShown = true;
        alert('データの保存に失敗しました。ブラウザの設定をご確認ください。');
      }
    }
    writeToAutosaveFile();
  }

  // 他のタブでデータが変更されたら反映する
  window.addEventListener('storage', (e) => {
    if(e.key !== STORAGE_KEY) return;
    try{
      const arr = e.newValue ? JSON.parse(e.newValue) : [];
      passes = Array.isArray(arr) ? arr.map(sanitizePass).filter(Boolean) : [];
      render();
    }catch(err){ console.error(err); }
  });

  // ---- IndexedDB: remembers chosen file/folder handles across reloads ----
  function idbOpen(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('teiki-manager-db', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('handles');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbSetHandle(key, handle){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').put(handle, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function idbGetHandle(key){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('handles', 'readonly');
      const req = tx.objectStore('handles').get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbClearHandle(key){
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction('handles', 'readwrite');
      tx.objectStore('handles').delete(key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }


  function setAutosaveUI(state, name){
    const dot = $('#autosaveDot');
    const status = $('#autosaveStatus');
    const btn = $('#autosaveBtn');
    const offBtn = $('#autosaveOffBtn');
    dot.className = 'autosave-dot' + (state === 'on' ? ' on' : (state === 'pending' ? ' pending' : ''));
    if(state === 'on'){
      status.textContent = `自動保存ファイル：${name}（有効）`;
      btn.textContent = '変更';
      offBtn.style.display = '';
    }else if(state === 'pending'){
      status.textContent = `自動保存ファイル：${name}（再接続が必要）`;
      btn.textContent = '再接続';
      offBtn.style.display = '';
    }else{
      status.textContent = fsSupported ? '自動保存ファイル：未設定' : '自動保存ファイル：このブラウザは非対応（エクスポートをご利用ください）';
      btn.textContent = '保存先を選択';
      offBtn.style.display = 'none';
    }
    btn.disabled = !fsSupported;
  }

  async function initAutosave(){
    if(!fsSupported){
      setAutosaveUI('off');
      return;
    }
    try{
      const handle = await idbGetHandle('autosave');
      if(!handle){ setAutosaveUI('off'); return; }
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if(perm === 'granted'){
        fileHandle = handle;
        setAutosaveUI('on', handle.name);
        if(!(await reconcileWithFile())) await disconnectAutosaveFile();
      }else{
        fileHandle = handle;
        setAutosaveUI('pending', handle.name);
      }
    }catch(e){
      setAutosaveUI('off');
    }
  }

  // 接続したファイルに既存データがあれば、上書き前に読み込むか確認する
  // 戻り値：false = ファイルを守るため接続を中止すべき
  async function reconcileWithFile(){
    if(!fileHandle) return true;
    try{
      const perm = await fileHandle.queryPermission({ mode: 'readwrite' });
      if(perm !== 'granted') return true;
      const text = await (await fileHandle.getFile()).text();
      if(!text.trim()) return true;
      let arr;
      try{ arr = JSON.parse(text); }catch(err){ arr = null; }
      if(!Array.isArray(arr)){
        return confirm('保存先ファイルの内容を読み取れません。上書きして自動保存を続けますか？\n（キャンセルすると接続を解除します）');
      }
      const fromFile = arr.map(sanitizePass).filter(Boolean);
      if(fromFile.length === 0) return true;
      if(JSON.stringify(fromFile) === JSON.stringify(passes)) return true;
      const useFile = confirm(
        `保存先ファイルに${fromFile.length}件のデータがあります（現在：${passes.length}件）。\n\n` +
        `「OK」= ファイルの内容を読み込む（現在のデータは退避）\n` +
        `「キャンセル」= 現在のデータでファイルを上書きする`
      );
      if(useFile){
        backupCurrent();
        passes = fromFile;
        savePasses();
        render();
      }
      return true;
    }catch(e){
      console.error('自動保存ファイルの確認に失敗しました', e);
      return true;
    }
  }

  async function connectAutosaveFile(){
    if(!fsSupported) return;
    try{
      if(fileHandle){
        // 既に接続済み → 再許可のリクエスト
        const perm = await fileHandle.requestPermission({ mode: 'readwrite' });
        if(perm === 'granted'){
          setAutosaveUI('on', fileHandle.name);
          if(!(await reconcileWithFile())){ await disconnectAutosaveFile(); return; }
          await writeToAutosaveFile();
          return;
        }
      }
      const handle = await window.showSaveFilePicker({
        suggestedName: 'teiki-data.json',
        types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
      });
      fileHandle = handle;
      await idbSetHandle('autosave', handle);
      setAutosaveUI('on', handle.name);
      if(!(await reconcileWithFile())){ await disconnectAutosaveFile(); return; }
      await writeToAutosaveFile();
    }catch(e){
      if(e && e.name !== 'AbortError'){
        console.error('自動保存ファイルの設定に失敗しました', e);
      }
    }
  }

  async function disconnectAutosaveFile(){
    fileHandle = null;
    try{ await idbClearHandle('autosave'); }catch(e){}
    setAutosaveUI('off');
  }

  // 連続保存で書き込みが衝突しないよう直列化する
  let writeChain = Promise.resolve();
  function writeToAutosaveFile(){
    writeChain = writeChain.then(doWriteAutosave);
    return writeChain;
  }

  async function doWriteAutosave(){
    if(!fsSupported || !fileHandle) return;
    try{
      const perm = await fileHandle.queryPermission({ mode: 'readwrite' });
      if(perm !== 'granted'){
        setAutosaveUI('pending', fileHandle.name);
        return;
      }
      const writable = await fileHandle.createWritable();
      await writable.write(JSON.stringify(passes, null, 2));
      await writable.close();
    }catch(e){
      console.error('自動保存に失敗しました', e);
    }
  }

  $('#autosaveOffBtn').addEventListener('click', disconnectAutosaveFile);

  // ---------- Rendering ----------
  function renderMemberFilter(){
    const members = uniqueMembers();
    let html = `<button type="button" class="chip ${activeMember==='all'?'active':''}" data-member="all" aria-pressed="${activeMember==='all'}">
        <span class="dot" style="background:${'#1B2333'}"></span>すべて</button>`;
    members.forEach((color, name) => {
      html += `<button type="button" class="chip ${activeMember===name?'active':''}" data-member="${escapeHtml(name)}" aria-pressed="${activeMember===name}">

  function renderStats(){
    // 絞り込み中の利用者に連動。合計金額は期限切れを除く
    const visible = filteredPasses();
    $('#statTotal').textContent = visible.length;
    $('#statWarn').textContent = visible.filter(p => statusOf(p.end) === 'warn').length;
    const sum = visible.filter(p => statusOf(p.end) !== 'danger').reduce((a,p) => a + Number(p.price||0), 0);
    $('#statSum').textContent = fmtYen(sum);
  }

  function filteredPasses(){
    return activeMember === 'all' ? passes : passes.filter(p => p.member === activeMember);
  }

  function renderList(){
    const filtered = filteredPasses();
    const sorters = {
      'end-asc': (a,b) => daysUntil(a.end) - daysUntil(b.end),
      'end-desc': (a,b) => daysUntil(b.end) - daysUntil(a.end),
      'start-desc': (a,b) => new Date(b.start) - new Date(a.start),
      'start-asc': (a,b) => new Date(a.start) - new Date(b.start)
    };
    const sorted = [...filtered].sort(sorters[sortMode] || sorters['end-asc']);

    if(sorted.length === 0){
      listEl.innerHTML = `<div class="empty">
        <div class="big">まだ定期券が登録されていません</div>
        右上の「＋ 定期券を追加」から登録してください
      </div>`;
      return;
    }

    listEl.innerHTML = sorted.map(p => {
      const st = statusOf(p.end);
      const label = statusLabel(p.end);
      const statusClass = st === 'ok' ? 'status-ok' : (st === 'warn' ? 'status-warn' : 'status-danger');
      const totalSpan = Math.max(1, (parseISO(p.end) - parseISO(p.start)) / 86400000);
      const elapsed = Math.min(totalSpan, Math.max(0, (new Date() - parseISO(p.start)) / 86400000));
      const pct = Math.min(100, Math.round((elapsed/totalSpan)*100));
      return `
      <div class="ticket" style="--member-color:${p.color}" data-id="${p.id}">
        <div class="stripe"></div>
        <div class="ticket-body">
          <div class="ticket-top">
            <span class="member-tag">${escapeHtml(p.member)}</span>
            <span class="route">${escapeHtml(p.route)}</span>
            <span class="status-tag ${statusClass}">${label}</span>
          </div>
          <div class="timeline">
            <span class="start-date">${fmtDate(p.start)}</span>
            <span class="track">
              <span class="fill" style="width:${pct}%"></span>
              <span class="marker" style="left:${pct}%"></span>
            </span>
            <span class="end-date">${fmtDate(p.end)}</span>
            <span class="pct-label">${pct}%</span>
          </div>
          <div class="meta-row">
            <span>期間：<b>${p.period}ヶ月</b></span>
            <span>金額：<b>${fmtYen(p.price)}</b></span>
          </div>
        </div>
        <div class="ticket-actions">
          <button class="icon-btn edit-btn" aria-label="${escapeHtml(p.member)}の定期券を編集">編集</button>
          <button class="icon-btn danger delete-btn" aria-label="${escapeHtml(p.member)}の定期券を削除">削除</button>
        </div>
      </div>`;
    }).join('');

    listEl.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = e.target.closest('.ticket').dataset.id;
        openEdit(id);
      });
    });
    listEl.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = e.target.closest('.ticket').dataset.id;
        deletePass(id);
      });
    });
  }

  function render(){
    // 絞り込み中の利用者がいなくなったら「すべて」に戻す
    if(activeMember !== 'all' && !uniqueMembers().has(activeMember)) activeMember = 'all';
    renderMemberFilter();
    renderStats();
    renderList();
    renderCalendar();
  }

  function renderCalendar(){
    const y = calYear, m = calMonth;
    $('#calTitle').textContent = `${y}年${m+1}月`;

    // date string (YYYY-MM-DD) -> array of passes expiring that day
    const byDate = {};
    passes.forEach(p => {
      if(!byDate[p.end]) byDate[p.end] = [];
      byDate[p.end].push(p);
    });

    const firstDay = new Date(y, m, 1);
    const startOffset = firstDay.getDay(); // 0=Sun
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const todayStr = todayISO();

    let cells = '';
    for(let i=0; i<startOffset; i++){
      cells += `<div class="cal-day empty"></div>`;
    }
    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${y}-${pad2(m+1)}-${pad2(d)}`;
      const items = byDate[dateStr] || [];
      const isToday = dateStr === todayStr;
      const visible = items.slice(0,2);
      const extra = items.length - visible.length;
      const pillsHtml = visible.map(p =>
        `<span class="cal-pill" style="background:${p.color}" data-id="${p.id}" title="${escapeHtml(p.member)}：${escapeHtml(p.route)}">${escapeHtml(p.member)}</span>`
      ).join('') + (extra > 0 ? `<span class="cal-pill more">+${extra}件</span>` : '');
      cells += `<div class="cal-day${isToday ? ' today' : ''}">
        <div class="cal-num">${d}</div>
        ${pillsHtml}
      </div>`;
    }

    $('#calendarGrid').innerHTML = cells;
    $('#calendarGrid').querySelectorAll('.cal-pill[data-id]').forEach(pill => {
      pill.addEventListener('click', () => {
        let el = document.querySelector(`.ticket[data-id="${pill.dataset.id}"]`);
        if(!el && activeMember !== 'all'){
          // 絞り込みで非表示の場合は解除して表示する
          activeMember = 'all';
          render();
          el = document.querySelector(`.ticket[data-id="${pill.dataset.id}"]`);
        }
        if(el){
          el.scrollIntoView({ behavior:'smooth', block:'center' });
          el.style.boxShadow = '0 0 0 3px var(--member-color)';
          setTimeout(() => { el.style.boxShadow = ''; }, 1200);
        }
      });
    });
  }

  $('#calPrev').addEventListener('click', () => {
    calMonth--;
    if(calMonth < 0){ calMonth = 11; calYear--; }
    renderCalendar();
  });
  $('#calNext').addEventListener('click', () => {
    calMonth++;
    if(calMonth > 11){ calMonth = 0; calYear++; }
    renderCalendar();
  });

  // 属性値の中でも安全に使えるよう引用符もエスケープする
  function escapeHtml(str){
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function deletePass(id){
    const p = passes.find(x => x.id === id);
    if(!p) return;
    if(!confirm(`${p.member}の定期券（${p.route}）を削除しますか？`)) return;

    const start = $('#f-start').value;
    const period = $('#f-period').value;
    if(start) $('#f-end').value = addMonths(start, period);

  $('#f-member').addEventListener('input', (e) => {
    const existingColor = colorForMember(e.target.value.trim());
    if(existingColor){
      selectedColor = existingColor;
      renderColorPicker();
    }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const data = {
      id: editingId || newId(),
      member: $('#f-member').value.trim(),
      color: selectedColor,
      route: $('#f-route').value.trim(),
      start: $('#f-start').value,
      period: $('#f-period').value,
      end: $('#f-end').value,
      price: Number($('#f-price').value)
    };
    if(data.end < data.start){
      alert('有効期限は使用開始日以降の日付にしてください。');
      return;
    }
    if(editingId){
      passes = passes.map(p => p.id === editingId ? data : p);
    }else{
      passes.push(data);
    }
    // 同じ利用者の色を統一する
    passes.forEach(p => { if(p.member === data.member) p.color = data.color; });
    savePasses();
    closeModal();
    render();
  });

  document.addEventListener('keydown', (e) => {
    if(!overlay.classList.contains('show')) return;
    if(e.key === 'Escape'){ closeModal(); return; }
    // モーダル内でフォーカスを循環させる
    if(e.key === 'Tab'){
      const items = [...overlay.querySelectorAll('input, select, button')].filter(el => !el.disabled);
      if(items.length === 0) return;
      const first = items[0], last = items[items.length - 1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  });

  // ---------- Export / Import ----------
  function pad2(n){ return String(n).padStart(2,'0'); }

  async function exportPasses(){
    const now = new Date();
    const fname = `teiki-export-${now.getFullYear()}${pad2(now.getMonth()+1)}${pad2(now.getDate())}.json`;
    const jsonText = JSON.stringify(passes, null, 2);

    // 0) 記憶済みフォルダがあれば、ダイアログなしでそこに直接保存
    if(dirPickerSupported && ioFolderHandle){
      try{
        const perm = await ioFolderHandle.queryPermission({ mode: 'readwrite' });
        if(perm === 'granted'){
          const handle = await ioFolderHandle.getFileHandle(fname, { create: true });
          const writable = await handle.createWritable();
          await writable.write(jsonText);
          await writable.close();
          alert(`「${ioFolderHandle.name}」フォルダに保存しました：${fname}`);
          return;
        }else{
          setIOFolderUI('pending', ioFolderHandle.name);
        }
      }catch(e){
        console.error('記憶済みフォルダへの保存に失敗しました', e);
        // 失敗時は下の方法にフォールバック
      }
    }

    // 1) PC(Chrome/Edge)：保存先フォルダを選べるダイアログ
    if('showSaveFilePicker' in window){
      try{
        const handle = await window.showSaveFilePicker({
          suggestedName: fname,
          types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(jsonText);
        await writable.close();
        return;
      }catch(e){
        if(e && e.name === 'AbortError') return; // ユーザーがキャンセル
        // 失敗時は下の方法にフォールバック
      }
    }

    // 2) Android Chromeなど：共有シートから保存先アプリ・フォルダを選べる
    const file = new File([jsonText], fname, { type: 'application/json' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try{
        await navigator.share({
          files: [file],
          title: '定期券データのエクスポート',
          text: fname
        });
        return;
      }catch(e){
        if(e && e.name === 'AbortError') return; // ユーザーがキャンセル
        // 失敗時は下のダウンロード方式にフォールバック
      }
    }

    // 3) それ以外：通常のダウンロード（ダウンロードフォルダに保存される）
    const url = URL.createObjectURL(new Blob([jsonText], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  $('#exportBtn').addEventListener('click', exportPasses);

  function processImportText(text){
    let incoming;
    try{
      incoming = JSON.parse(text);
      if(!Array.isArray(incoming)) throw new Error('形式が正しくありません');
    }catch(err){
      alert('このファイルは読み込めませんでした。定期券マネージャーからエクスポートしたJSONファイルを選択してください。');
      return;
    }

    // 各項目を検証（不正な色・日付・数値は除外／補正）
    const valid = incoming.map(sanitizePass).filter(Boolean);
    if(valid.length === 0){
      alert('有効な定期券データが見つかりませんでした。');
      return;
    }

    // 追加／置換／中止 の3択（confirmを2段階で使用）
    const doAdd = confirm(
      `${valid.length}件のデータが見つかりました。\n\n` +
      `「OK」= 現在のデータに追加する\n` +
      `「キャンセル」= 次の画面で置き換え／中止を選ぶ`
    );

    if(doAdd){
      // 追加：同じIDがあれば上書き、なければ追加
      const map = new Map(passes.map(p => [p.id, p]));
      valid.forEach(p => map.set(p.id, p));
      passes = [...map.values()];
    }else{
      const doReplace = confirm(
        '現在のデータを削除して、読み込んだデータに置き換えますか？\n' +
        '（現在のデータは退避されます）\n\n' +
        '「OK」= 置き換える\n' +
        '「キャンセル」= インポートを中止'
      );
      if(!doReplace) return;
      backupCurrent();
      passes = valid;
    }

    savePasses();
    render();
    alert('インポートが完了しました。');
  }

  async function startImport(){
    // PC(Chrome/Edge)で記憶済みフォルダがあれば、そこを開いた状態でファイル選択ダイアログを表示
    if(dirPickerSupported && ioFolderHandle && 'showOpenFilePicker' in window){
      try{
        // 読み込みには読み取り権限だけで足りる
        const perm = await ioFolderHandle.queryPermission({ mode: 'read' });
        if(perm !== 'granted'){
          setIOFolderUI('pending', ioFolderHandle.name);
        }else{
          const [handle] = await window.showOpenFilePicker({
            startIn: ioFolderHandle,
            types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
          });
          const file = await handle.getFile();
          const text = await file.text();
          processImportText(text);
          return;
        }
      }catch(e){
        if(e && e.name === 'AbortError') return; // ユーザーがキャンセル
        // 失敗時は下の通常の方法にフォールバック
      }
    }
    // それ以外：通常のファイル選択（Androidなど）
    $('#importInput').click();
  }

  $('#importBtn').addEventListener('click', startImport);

  $('#importInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      processImportText(reader.result);
      e.target.value = '';
    };
    reader.onerror = () => {
      alert('ファイルの読み込みに失敗しました。');
      e.target.value = '';
    };
    reader.readAsText(file);
  });

  loadPasses();
  initAutosave();
  initIOFolder();
})();
</script>
